      g.on = true;
      try { g.el.setPointerCapture(e.pointerId); } catch (err) {}
      try { const sel = window.getSelection(); if (sel && sel.rangeCount) sel.removeAllRanges(); } catch (err) {}
      this.setState({ dragging: true });
    }
    g.dx = dx; g.dy = dy;
    if (!this.state.reduced) {
      const f = Math.max(-56, Math.min(56, dx * 0.35));
      try { g.el.style.setProperty('--cl-dx', f.toFixed(1) + 'px'); } catch (err) {}
    }
  }
  swEnd(e, cancelled) {
    const g = this._sw;
    if (!g || e.pointerId !== g.id) return;
    this._sw = null;
    if (!g.on) return;
    this.swReset(g);
    this._dragEnd = Date.now();
    const dx = cancelled ? g.dx : e.clientX - g.x0;
    const dy = cancelled ? g.dy : e.clientY - g.y0;
    const ax = Math.abs(dx);
    const patch = { dragging: false };
    if (!cancelled && ax > Math.abs(dy) && (ax >= 40 || (ax >= 24 && this._dragEnd - g.t0 <= 250))) {
      const n = this.slideCount();
      const step = (dx < 0 ? 1 : -1) * (this.lang() === 'ar' ? -1 : 1);
      patch.slide = (this.state.slide + step + n) % n;
      patch.stopped = true;
    }
    this.setState(patch);
  }
  swReset(g) {
    if (!g || !g.el) return;
    try { if (g.el.hasPointerCapture && g.el.hasPointerCapture(g.id)) g.el.releasePointerCapture(g.id); } catch (err) {}
    try { g.el.style.removeProperty('--cl-dx'); if (!g.el.getAttribute('style')) g.el.removeAttribute('style'); } catch (err) {}
  }
  /* The slideshow's clock is the current dot's fill animation itself (cl-fill, 7s): when it completes, the next
     slide comes. So the visible progress and the slide change cannot disagree, and pausing (.is-playing off)
     holds both at once. A fill that completes in the same frame as a pause still counts (it is full). */
  fillDone(e) {
    if (!e || e.animationName !== 'cl-fill') return;
    const s = this.state;
    if (s.stopped || s.reduced || this.slideCount() < 2) return;
    this.setState(st => ({ slide: (st.slide + 1) % this.slideCount() }));
  }

  /* ---------- layers: menu sheet and WhatsApp chooser ---------- */
  focusId(id) {
    const el = document.getElementById(id);
    if (!el) return;
    try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
  }
  syncLock() {
    const lock = this.state.menuOpen || (this.state.waOpen && this.state.narrow);
    try { document.documentElement.classList.toggle('cl-locked', !!lock); } catch (e) {}
  }
  openLayer(which, e, from) {
    const key = which === 'menu' ? 'menuOpen' : 'waOpen';
    if (this.state[key]) return;
    const opener = (e && e.currentTarget) || null;
    if (which === 'menu') this._menuOpener = opener; else this._waOpener = opener;
    try {
      const d = this._depth + 1;
      /* Stepping back off the sentinel must not let the browser restore the old scroll position
         over a menu jump (some engines restore after popstate), so pause restoration meanwhile. */
      if (this._depth === 0) {
        clearTimeout(this._srT);
        if (this._srPrev == null) { try { this._srPrev = history.scrollRestoration || 'auto'; history.scrollRestoration = 'manual'; } catch (e2) { this._srPrev = null; } }
      }
      history.pushState(Object.assign({}, history.state || {}, { __fnBack: d }), '');
      this._depth = d; this._histOk = true;
    } catch (err) { this._histOk = false; this.resetRestore(0); }
    const patch = {}; patch[key] = true;
    if (which === 'wa') patch.waFrom = from || 'fab';
    this.setState(patch, () => { this.syncLock(); this.focusId(which === 'menu' ? 'cl-menu-close' : 'cl-wa-close'); });
  }
  stepBack() {
    if (!this._histOk || this._depth <= 0) return false;
    let st = null;
    try { st = history.state; } catch (e) {}
    const d = this._depth; this._depth = d - 1;
    if (st && st.__fnBack === d) {
      this._ignorePop++;
      Promise.resolve().then(() => { try { history.go(-1); } catch (e) { this._ignorePop = Math.max(0, this._ignorePop - 1); } });
      return true;
    }
    return false;
  }
  closeLayer(which, opts) {
    opts = opts || {};
    const key = which === 'menu' ? 'menuOpen' : 'waOpen';
    if (!this.state[key]) return false;
    const opener = which === 'menu' ? this._menuOpener : this._waOpener;
    let stepped = false;
    if (!opts.fromPop) { stepped = this.stepBack(); if (!stepped) this.resetRestore(0); }
    const patch = {}; patch[key] = false;
    this.setState(patch, () => {
      this.syncLock();
      if (!opts.noFocus && opener && opener.isConnected) { try { opener.focus({ preventScroll: true }); } catch (e) {} }
    });
    return stepped;
  }
  handlePop() {
    this.syncLangUrl();
    if (this._ignorePop > 0) { this._ignorePop--; this.flushNav(); this.resetRestore(800); return; }
    if (this.state.waOpen) { this._depth = Math.max(0, this._depth - 1); this.closeLayer('wa', { fromPop: true }); }
    else if (this.state.menuOpen) { this._depth = Math.max(0, this._depth - 1); this.closeLayer('menu', { fromPop: true }); }
    this.resetRestore(800);
  }
  resetRestore(ms) {
    clearTimeout(this._srT);
    const run = () => {
      if (this._depth > 0 || this._srPrev == null) return;
      try { history.scrollRestoration = this._srPrev; } catch (e) {}
      this._srPrev = null;
    };
    if (ms) this._srT = setTimeout(run, ms); else run();
  }
  layerKey(e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault(); e.stopPropagation();
      if (this.state.waOpen) this.closeLayer('wa', {}); else if (this.state.menuOpen) this.closeLayer('menu', {});
      return;
    }
    if (e.key === 'Tab') {
      const root = e.currentTarget;
      const list = Array.prototype.slice.call(root.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])'))
        .filter(el => el.getClientRects().length > 0);
      if (!list.length) return;
      const first = list[0], last = list[list.length - 1];
      /* the layer itself takes focus (tabIndex -1) after a click on plain text in it: Shift+Tab from there wraps too */
      if (e.shiftKey && (document.activeElement === first || document.activeElement === root)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }
  navTo(e, id) {
    if (e && e.preventDefault) e.preventDefault();
    this._pendingNav = id;
    const stepped = this.closeLayer('menu', { noFocus: true });
    clearTimeout(this._navT);
    if (stepped) this._navT = setTimeout(() => this.flushNav(), 450);
    else this._navT = setTimeout(() => this.flushNav(), 30);
  }
  flushNav() {
    const id = this._pendingNav;
    if (!id) return;
    this._pendingNav = null; clearTimeout(this._navT);
    const smooth = !this.state.reduced;
    if (id === 'top') {
      try { window.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' }); } catch (e) { window.scrollTo(0, 0); }
      this.focusId('main');
      return;
    }
    const el = document.getElementById(id);
    if (!el) return;
    try { el.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' }); } catch (e) { el.scrollIntoView(); }
    try { el.focus({ preventScroll: true }); } catch (e) {}
  }

  /* ---------- form ---------- */
  check(k, v) {
    v = (v || '').trim();
    if (k === 'name') return v ? null : 'errName';
    if (k === 'email') return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? null : 'errEmail';
    if (k === 'phone') return (v.match(/\d/g) || []).length >= 6 ? null : 'errPhone';
    if (k === 'service') return v ? null : 'errService';
    if (k === 'message') return v.length >= 2 ? null : 'errMessage';
    return null;
  }
  setField(k, v) {
    this.setState(s => {
      const form = Object.assign({}, s.form); form[k] = v;
      const errors = Object.assign({}, s.errors);
      if (s.tried) errors[k] = this.check(k, v);
      return { form, errors };
    });
  }
  submit(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (this.state.sending) return;
    const errors = {}; let first = null;
    CL_FIELDS.forEach(k => { const er = this.check(k, this.state.form[k]); errors[k] = er; if (er && !first) first = k; });
    if (first) { this.setState({ errors, tried: true }, () => this.focusId('cl-f-' + first)); return; }
    this.setState({ errors: {}, tried: true, sending: true });
    clearTimeout(this._sendT);
    this._sendT = setTimeout(() => {
      this.setState({ sending: false, success: true, form: Object.assign({}, CL_EMPTY), errors: {}, tried: false }, () => this.focusId('cl-success'));
    }, 900);
  }
  /* A card's "Get a quote" is a real #contact link: Ctrl/Cmd/Shift/Alt or non-primary clicks keep the browser's own
     behaviour (new tab, window...). A plain click pre-fills the Service field and scrolls there itself, but still
     records #contact in history (as the link would), so Back returns to the card instead of leaving the site.
     No layer is open here, so history.state carries no Back sentinel and popstate has nothing to close. */
  quoteFor(id, e) {
    if (e && (e.defaultPrevented || e.button > 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey)) return;
    if (e && e.preventDefault) e.preventDefault();
    try { if (window.location.hash !== '#contact') window.history.pushState(window.history.state, '', '#contact'); } catch (err) {}
    this.setState(s => {
      const form = Object.assign({}, s.form, { service: id });
      const errors = Object.assign({}, s.errors, { service: null });
      return { form, errors, flash: true, success: false };
    }, () => this.showQuote());
    clearTimeout(this._flashT);
    this._flashT = setTimeout(() => this.setState({ flash: false }), 1500);
  }
  /* Land on Contact (as the #contact link did) when the pre-filled Service field is then on screen; in the stacked
     layout the form sits below the contact cards, so centre the field instead. Focus goes to the section as before. */
  showQuote() {
    const sec = document.getElementById('contact');
    if (!sec) return;
    const sel = document.getElementById('cl-f-service');
    const below = sel ? sel.getBoundingClientRect().bottom - sec.getBoundingClientRect().top + 96 : 0;
    const target = sel && below > window.innerHeight - 16 ? sel : sec;
    const behavior = this.state.reduced ? 'auto' : 'smooth';
    try { target.scrollIntoView({ behavior, block: target === sel ? 'center' : 'start' }); } catch (err) { target.scrollIntoView(); }
    try { sec.focus({ preventScroll: true }); } catch (err) {}
  }

  /* ---------- render values ---------- */
  renderVals() {
    const lang = this.lang();
    const t = COPY[lang] || COPY.en;
    const x = EXTRA[lang] || EXTRA.en;
    const c = COPY.contact || {};
    const s = this.state;
    const n = this.slideCount();
    const slideIdx = Math.min(s.slide, n - 1);
    const playing = this.isPlaying();
    const F = (t.contactSection && t.contactSection.form) || {};

    const slides = ((t.hero && t.hero.slides) || []).map((sl, i) => ({
      eyebrow: sl.eyebrow, title: sl.title, body: sl.body,
      cls: i === slideIdx ? 'is-active' : '',
      ariaHidden: i === slideIdx ? undefined : 'true',
      label: (i + 1) + ' / ' + n,
      img: i === 0 ? CL_IMG.hero : CL_IMG.ocean,
      alt: i === 0 ? x.alt.hero : x.alt.ocean
    }));
    const dots = slides.map((sl, i) => ({
      cls: i === slideIdx ? 'is-active' : '',
      current: i === slideIdx ? 'true' : undefined,
      label: (t.hero.goTo || '') + ' ' + (i + 1),
      go: (e) => this.pickSlide(i, e)
    }));

    const services = ((t.services && t.services.items) || []).map(it => {
      const open = s.openSvc === it.id;
      return {
        id: it.id, title: it.title, short: it.short, detailTitle: it.detailTitle, detail: it.detail,
        img: CL_IMG[it.id] || CL_IMG.hero, alt: (x.alt && x.alt[it.id]) || '',
        cls: 'cl-svc--' + it.id + (open ? ' is-open' : ''),
        expanded: open ? 'true' : 'false',
        panelId: 'cl-svc-d-' + it.id,
        toggle: () => this.setState(st => ({ openSvc: st.openSvc === it.id ? null : it.id })),
        quote: (e) => this.quoteFor(it.id, e)
      };
    });
    const svc = {};
    ((t.services && t.services.items) || []).forEach(it => { svc[it.id] = it.title; });

    const numbers = (c.whatsapp || []).map(w => ({
      display: w.display, wa: w.wa, tel: 'tel:' + (w.e164 || ''),
      callLabel: (x.call || 'Call') + ' ' + w.display
    }));
    /* call-only lines (no WhatsApp): listed under the WhatsApp numbers, never in the WhatsApp chooser */
    const phones = (c.phones || []).filter(p => p && p.display).map(p => ({
      display: p.display, tel: p.tel || ('tel:' + (p.e164 || ''))
    }));
    const insta = (c.social && c.social[0]) || { name: 'Instagram', handle: '@freightnetsarl', url: 'https://www.instagram.com/freightnetsarl/' };

    const fe = {};
    CL_FIELDS.forEach(k => {
      const key = s.errors[k];
      fe[k] = { has: !!key, msg: key ? (F[key] || '') : '', invalid: key ? 'true' : 'false', desc: key ? 'cl-e-' + k : undefined };
    });

    const isFcl = s.load !== 'lcl';
    const rootCls = [playing ? 'is-playing' : '', s.stopped || s.reduced ? 'is-still' : ''].join(' ').trim();

    return {
      lang, dir: lang === 'ar' ? 'rtl' : 'ltr', otherLang: lang === 'ar' ? 'en' : 'ar',
      t, x, c, F, insta, numbers, phones, svc,
      langShort: x.langShort || (t.nav && t.nav.lang) || '',
      rootCls,
      h1: (t.legal || '') + ' — ' + (t.tagline || ''),
      brandLabel: 'FREIGHT NET SARL' + (lang === 'ar' ? '، ' : ', ') + ((t.nav && t.nav.home) || ''),
      toggleLang: this.toggleLang,
      menuOpen: s.menuOpen, menuExpanded: s.menuOpen ? 'true' : 'false',
      openMenu: this.openMenu, closeMenu: this.closeMenu,
      navHome: this.navHome, navServices: this.navServices, navAbout: this.navAbout, navContact: this.navContact, navQuote: this.navQuote,
      onLayerKey: this.onLayerKey,
      waOpen: s.waOpen, waPop: !s.narrow,
      waExpFab: s.waOpen && s.waFrom === 'fab' ? 'true' : 'false',
      waExpHero: s.waOpen && s.waFrom === 'hero' ? 'true' : 'false',
      waExpCard: s.waOpen && s.waFrom === 'card' ? 'true' : 'false',
      openWaHero: this.openWaHero, openWaCard: this.openWaCard,
      waCls: s.narrow ? 'cl-wa--sheet' : 'cl-wa--pop', fabCls: s.narrow ? 'is-narrow' : '',
      openWa: this.openWa, closeWa: this.closeWa, closeWaLink: this.closeWaLink,
      slides, dots, heroLive: playing ? 'off' : 'polite',
      panelCls: s.dragging ? 'is-drag' : '',
      heroEnter: this.heroEnter, heroLeave: this.heroLeave, heroFocus: this.heroFocus, heroBlur: this.heroBlur,
      swipeDown: this.swipeDown, swipeMove: this.swipeMove, swipeUp: this.swipeUp, swipeCancel: this.swipeCancel, swipeLost: this.swipeLost,
      noDrag: this.noDrag, heroLink: this.heroLink, fillDone: this.onFillDone,
      services,
      isFcl, isLcl: !isFcl, segCls: isFcl ? '' : 'is-lcl',
      fclCls: isFcl ? 'is-active' : '', lclCls: isFcl ? '' : 'is-active',
      fclHidden: isFcl ? undefined : 'true', lclHidden: isFcl ? 'true' : undefined,
      pickFcl: this.pickFcl, pickLcl: this.pickLcl,
      form: s.form, fe,
      onName: this.onName, onEmail: this.onEmail, onPhone: this.onPhone, onService: this.onService, onMessage: this.onMessage,
      onSubmit: this.onSubmit, sending: !!s.sending,
      submitLabel: s.sending ? (F.sending || F.submit) : F.submit,
      showForm: !s.success, success: !!s.success, sendAnother: this.sendAnother,
      flashCls: s.flash ? 'is-flash' : ''
    };
  }
}
return Component;
});
</script>
</body>
</html>
