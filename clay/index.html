<style>
body{margin:0}
html.cl-locked,html.cl-locked body{overflow:hidden}

/* ---------- 1. Tokens ---------- */
.cl-root{
  --bg:#F5F7FB;--bg-2:#FFFFFF;--bg-3:#EBEFF7;--line:#DCE2EE;--edge:#858DAE;
  --ink:#373D74;--body:#262B57;--muted:#555C80;
  --navy:#373D74;--navy-2:#2A2F5E;--navy-3:#4A5192;
  --crimson:#A2303C;--crimson-2:#86242F;
  --coral:#F2493B;--sun:#FFC845;--sun-2:#F5B82A;--sky:#8EC5F2;--sky-soft:#D4E9FB;--sun-soft:#FFF0C7;
  --err:#B42318;--err-bg:#FFF4F3;
  --ring:#373D74;
  --r-sm:16px;--r-md:24px;--r-lg:30px;--r-xl:40px;--pill:999px;
  --sh-1:0 1px 2px rgb(16 20 40 / .05),0 12px 30px -16px rgb(16 20 40 / .22);
  --sh-2:0 2px 6px rgb(16 20 40 / .06),0 28px 50px -22px rgb(16 20 40 / .34);
  --clay:inset 0 -4px 0 rgb(0 0 0 / .22),inset 0 2px 0 rgb(255 255 255 / .16),0 8px 16px -8px rgb(16 20 40 / .45);
  --clay-press:inset 0 -1px 0 rgb(0 0 0 / .22),inset 0 2px 0 rgb(255 255 255 / .12),0 3px 8px -4px rgb(16 20 40 / .4);
  --clay-soft:inset 0 -3px 0 rgb(16 20 40 / .08),0 6px 14px -8px rgb(16 20 40 / .32);
  --blob:inset -7px -9px 14px rgb(0 0 0 / .14),inset 7px 8px 12px rgb(255 255 255 / .42),0 16px 26px -14px rgb(16 20 40 / .38);
  --bounce:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1);
  --f-display:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-brand:'Montserrat','Plus Jakarta Sans',sans-serif;
  --gut:clamp(16px,3.2cqi,40px);
  --t-hero:clamp(2.6rem,1.1rem + 5cqi,5.15rem);
  --t-h2:clamp(2rem,1rem + 3.1cqi,3.6rem);
  --t-h3:clamp(1.2rem,1rem + .55cqi,1.5rem);
  --t-lede:clamp(1.05rem,.98rem + .3cqi,1.22rem);
  --cl-x:1;
  position:relative;background:var(--bg);color:var(--body);
  font-family:var(--f-body);font-size:16px;line-height:1.6;
  overflow-x:clip;-webkit-font-smoothing:antialiased;font-optical-sizing:auto;
}
.cl-root[dir="rtl"]{--cl-x:-1}
.cl-root[lang="ar"]{
  --f-display:'Alexandria',system-ui,sans-serif;
  --f-body:'Alexandria',system-ui,sans-serif;
  line-height:1.8;
}
:where(.cl-root) *,:where(.cl-root) *::before,:where(.cl-root) *::after{box-sizing:border-box}
:where(.cl-root) img{display:block;max-width:100%}
:where(.cl-root) :where(h1,h2,h3,h4,p,figure){margin:0}
:where(.cl-root) p{text-wrap:pretty}
:where(.cl-root) a{color:inherit}
:where(.cl-root) :where(button,input,select,textarea){font:inherit;color:inherit}
:where(.cl-root) :where(a,button,input,select,textarea,label){touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cl-root :focus-visible{outline:3px solid var(--ring);outline-offset:3px}
.cl-root [tabindex="-1"]:focus{outline:none}
.cl-i{width:20px;height:20px;flex:none;display:block}
.cl-root[dir="rtl"] .cl-flip{scale:-1 1}
.cl-sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.cl-pin{unicode-bidi:plaintext;white-space:nowrap}
.cl-anywhere{overflow-wrap:anywhere}

/* ---------- 2. Layout shell ---------- */
.cl-shell{container:cl / inline-size}
.cl-wrap{width:min(100% - 2 * var(--gut),1320px);margin-inline:auto}
.cl-sec{padding-block-start:clamp(64px,8.5cqi,120px);scroll-margin-top:96px}
.cl-skip{position:absolute;inset-inline-start:16px;top:12px;z-index:100;transform:translateY(-220%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:var(--pill);font-weight:700;text-decoration:none;box-shadow:var(--clay)}
.cl-skip:focus{transform:none}

/* ---------- 3. Type ---------- */
.cl-eyebrow{display:inline-flex;align-items:center;gap:9px;justify-self:start;align-self:start;padding-block:8px;padding-inline:11px 15px;background:var(--bg-2);border-radius:var(--pill);font:700 12.5px/1 var(--f-body);letter-spacing:.11em;text-transform:uppercase;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line),0 2px 0 rgb(16 20 40 / .04)}
.cl-eyebrow::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--coral);box-shadow:inset -2px -2px 0 rgb(0 0 0 / .16)}
.cl-eyebrow--sky::before{background:var(--sky)}
.cl-eyebrow--sun::before{background:var(--sun)}
.cl-eyebrow--navy::before{background:var(--navy)}
.cl-h2{font:800 var(--t-h2)/1.02 var(--f-display);letter-spacing:-.035em;color:var(--ink);text-wrap:balance}
.cl-lede{font-size:var(--t-lede);line-height:1.6;color:var(--muted);max-width:56ch}
.cl-head{display:grid;gap:16px;margin-block-end:clamp(28px,4cqi,52px);max-width:780px}
.cl-root[lang="ar"] .cl-eyebrow{letter-spacing:0;text-transform:none;font-size:14px;font-weight:500;padding-block:7px}
.cl-root[lang="ar"] .cl-h2{font-weight:700;letter-spacing:0;line-height:1.3;font-size:calc(var(--t-h2) * .86)}

/* ---------- 4. Buttons ---------- */
.cl-btn{--b-bg:var(--crimson);--b-bg-h:var(--crimson-2);--b-fg:#fff;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;border:0;border-radius:var(--pill);background:var(--b-bg);color:var(--b-fg);font:700 16px/1.15 var(--f-body);text-decoration:none;text-align:center;cursor:pointer;box-shadow:var(--clay);transition:background-color .2s,transform .3s var(--bounce),box-shadow .2s}
.cl-btn:active{transform:translateY(2px) scale(.98);box-shadow:var(--clay-press)}
.cl-btn--navy{--b-bg:var(--navy);--b-bg-h:var(--navy-2)}
.cl-nav__a:active,.cl-foot__a:active,.cl-link:active,.cl-brand:active,.cl-dot:active{transform:scale(.97)}
.cl-btn--sun{--b-bg:var(--sun);--b-bg-h:var(--sun-2);--b-fg:var(--navy)}
.cl-btn--light{--b-bg:#fff;--b-bg-h:var(--bg-3);--b-fg:var(--ink);box-shadow:var(--clay-soft)}
.cl-btn--light:active{box-shadow:0 2px 6px -3px rgb(16 20 40 / .3)}
.cl-btn--sm{min-height:46px;padding:0 20px;font-size:15px}
.cl-btn--block{width:100%}
.cl-btn .cl-i{transition:transform .3s var(--bounce)}
.cl-btn[disabled]{cursor:progress;opacity:.82}
@media (hover:hover){
  .cl-btn:hover{background:var(--b-bg-h)}
  .cl-btn:hover .cl-go{transform:translateX(3px)}
}

/* ---------- 5. Header ---------- */
.cl-header{position:sticky;top:0;z-index:40;background:var(--bg);padding-block:12px}
.cl-bar{display:flex;align-items:center;gap:8px;min-height:68px;padding-block:8px;padding-inline:16px 10px;background:var(--bg-2);border-radius:var(--pill);box-shadow:var(--sh-1)}
/* brand mark: the original emblem at the inline-start, the two-line wordmark beside it, leaning toward the
   emblem in both directions (emblem ~2.7x the name size, gap ~0.2x the emblem, as in brand/logo-horizontal.svg).
   The emblem is never mirrored; the pill-shaped hover hugs its round arc. */
.cl-brand{--em:46px;display:inline-flex;align-items:center;gap:max(6px,calc(var(--em) * .21));min-height:44px;flex:none;padding-block:3px;padding-inline:6px 14px;margin-inline-start:-6px;border-radius:var(--pill);text-decoration:none;line-height:1;transition:background-color .2s}
.cl-brand__mark{flex:none;display:block;width:auto;height:var(--em);aspect-ratio:512 / 431;max-width:none}
.cl-brand__words{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.cl-brand__name{font:800 17px/1 var(--f-brand);letter-spacing:.02em;color:var(--navy);white-space:nowrap}
.cl-brand__tag{font:700 9.5px/1 var(--f-brand);letter-spacing:.18em;color:var(--crimson);white-space:nowrap;margin-top:6px}
.cl-root[dir="rtl"] .cl-brand__tag{margin-inline-start:-.18em}
.cl-brand--dark .cl-brand__name{color:#fff}
.cl-brand--dark .cl-brand__tag{color:#F79AA6}
.cl-brand--lg{--fn:22px;--em:calc(var(--fn) * 2.9)}
.cl-brand--lg .cl-brand__name{font-size:var(--fn)}
.cl-brand--lg .cl-brand__tag{font-size:calc(var(--fn) * .52);margin-top:calc(var(--fn) * .36)}
.cl-nav{display:flex;align-items:center;gap:2px;margin-inline:auto}
.cl-nav__a{display:inline-flex;align-items:center;min-height:44px;padding-inline:17px;white-space:nowrap;border-radius:var(--pill);font-weight:500;font-size:15.5px;color:var(--body);text-decoration:none;transition:background-color .2s,color .2s}
.cl-bar__end{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.cl-lang{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:46px;padding-inline:13px 16px;border-radius:var(--pill);border:1.5px solid var(--line);background:var(--bg-2);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;transition:background-color .2s,transform .25s var(--bounce)}
.cl-lang:active{transform:scale(.97)}
.cl-lang__txt:lang(ar){font-family:'Alexandria',system-ui,sans-serif;font-weight:500}
.cl-lang__txt:lang(en){font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.cl-lang__short{display:none}
.cl-menu-btn{display:none;align-items:center;justify-content:center;gap:8px;min-width:46px;min-height:46px;padding-inline:14px;border-radius:var(--pill);border:0;background:var(--navy);color:#fff;font-weight:700;font-size:15px;cursor:pointer;box-shadow:var(--clay);transition:background-color .2s,transform .25s var(--bounce)}
.cl-menu-btn:active{transform:scale(.96);box-shadow:var(--clay-press)}
.cl-bar__cta{min-height:48px;padding-inline:22px;font-size:15px}
@media (hover:hover){
  .cl-brand:hover{background:var(--bg-3)}
  .cl-nav__a:hover{background:var(--bg-3);color:var(--ink)}
  .cl-lang:hover{background:var(--bg-3)}
  .cl-menu-btn:hover{background:var(--navy-2)}
}
@container cl (max-width:1023px){
  .cl-nav{display:none}
  .cl-menu-btn{display:inline-flex}
}
.cl-bar__cta,.cl-menu-btn,.cl-lang{white-space:nowrap}
/* below full desktop the header is shared with the emblem: the language switch drops its globe (its label says it all) */
@container cl (max-width:1199px){
  .cl-header .cl-lang{padding-inline:15px}
  .cl-header .cl-lang .cl-i{display:none}
}
@container cl (min-width:1024px) and (max-width:1199px){
  .cl-nav{gap:0}
  .cl-nav__a{padding-inline:13px}
}
/* small tablets: the quote CTA stays one tap away in the hero and the menu sheet */
@container cl (max-width:767px){
  .cl-bar__cta{display:none}
}
@container cl (max-width:640px){
  .cl-header{padding-block:8px}
  .cl-bar{min-height:60px;padding-inline:12px 8px;gap:6px}
  .cl-bar__cta{display:none}
  .cl-menu-btn{padding-inline:0;width:46px}
  .cl-menu-btn__txt{display:none}
  .cl-header .cl-brand{--em:38px;padding-inline-end:10px}
  .cl-header .cl-brand__name{font-size:15px}
  .cl-header .cl-brand__tag{font-size:8.5px;margin-top:5px}
}
/* compact mark: the tagline hides, the emblem stays and scales down with the name */
@container cl (max-width:399px){
  .cl-bar{padding-inline:10px 7px;gap:5px}
  .cl-bar__end{gap:5px}
  .cl-header .cl-brand{--em:clamp(28px,8.5cqi,33px);padding-inline-end:6px}
  .cl-header .cl-brand__tag{display:none}
  .cl-header .cl-brand__name{font-size:clamp(11.5px,3.5cqi,14px)}
  .cl-header .cl-lang{min-height:44px;padding-inline:12px;font-size:14px}
  .cl-header .cl-lang .cl-i{display:none}
  .cl-menu-btn{width:44px;min-width:44px;height:44px;min-height:44px}
}
/* smallest phones: the Arabic page's switch reads "EN" (the full label stays its accessible name) */
@container cl (max-width:359px){
  .cl-bar{padding-inline:8px 6px;gap:4px}
  .cl-header .cl-brand__name{letter-spacing:.01em}
  .cl-header .cl-lang{padding-inline:11px}
  .cl-header .cl-lang__full{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .cl-header .cl-lang__short{display:inline}
}

/* ---------- 6. Hero ---------- */
.cl-hero{padding-block-start:6px}
/* the whole panel is the swipe surface: vertical pans and pinch-zoom stay with the browser, sideways drags come
   to the pointer handlers. While a drag is under way the current words and picture follow it a little. */
.cl-hero__panel{position:relative;overflow:hidden;isolation:isolate;background:var(--sky);border-radius:var(--r-xl);display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"art" "copy" "actions";padding:18px 20px 24px;row-gap:16px;touch-action:pan-y pinch-zoom}
.cl-hero__panel.is-drag{-webkit-user-select:none;user-select:none;cursor:grabbing}
.cl-hero__panel.is-drag .cl-slide.is-active,.cl-hero__panel.is-drag .cl-hero__img.is-active{transform:translateX(var(--cl-dx,0px));transition:none}
.cl-hero__copy{grid-area:copy;display:grid;align-self:end;position:relative;z-index:1}
.cl-slide{grid-area:1 / 1;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:18px;opacity:0;visibility:hidden;transform:translateX(calc(var(--cl-x) * 28px));transition:opacity .3s var(--out),transform .3s var(--out),visibility 0s linear .3s}
.cl-slide.is-active{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.cl-chip{display:inline-flex;align-items:center;gap:9px;padding-block:8px;padding-inline:10px 15px;background:#fff;border-radius:var(--pill);font:700 13px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);box-shadow:0 3px 0 rgb(16 20 40 / .06)}
.cl-chip::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--coral);box-shadow:inset -2px -2px 0 rgb(0 0 0 / .16)}
.cl-hero__title{font:800 var(--t-hero)/.97 var(--f-display);letter-spacing:-.04em;color:var(--navy);text-wrap:balance;max-width:11.5em}
.cl-hero__body{font-size:clamp(1.05rem,.95rem + .45cqi,1.28rem);line-height:1.55;color:var(--body);max-width:31em}
.cl-hero__actions{grid-area:actions;display:flex;flex-direction:column;gap:22px;margin-top:16px;position:relative;z-index:1}
.cl-hero__ctas{display:flex;flex-wrap:wrap;gap:12px}
/* slide picker: one 44px button per slide in a white pill tray that sits on the art's orbit, centred under the
   picture. It must never share the WhatsApp button's lane at the inline end: that only gets close in the two-column
   layout just above 860px (English, where the button is widest), so there the tray leans toward the inline start
   by up to 30px, easing back to centred by 970px (see the 860px container query). The current slide's
   pill is long and navy; while the slideshow plays it fills with crimson over 7s, and the end of that fill is
   what moves to the next slide (fillDone in the script), so progress and slide change always agree. Once the
   slideshow has stopped for good (a dot, a swipe, reduced motion) the current pill is solid crimson. */
.cl-dots{position:absolute;z-index:2;inset-block-end:0;inset-inline:0;width:max-content;margin-inline:auto;display:flex;align-items:center;padding-inline:4px;background:#fff;border-radius:var(--pill);box-shadow:var(--clay-soft)}
.cl-dot{width:44px;height:44px;display:grid;place-items:center;border:0;padding:0;background:none;cursor:pointer;border-radius:var(--pill)}
.cl-dot.is-active{width:62px}
.cl-dot:focus-visible{outline-offset:-3px}
.cl-dot__pill{position:relative;display:block;width:12px;height:12px;border-radius:var(--pill);background:var(--edge);overflow:hidden;transition:background-color .2s}
.cl-dot.is-active .cl-dot__pill{width:34px;background:var(--navy)}
.cl-dot.is-active .cl-dot__pill::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 -2px 0 rgb(0 0 0 / .22),inset 0 1px 0 rgb(255 255 255 / .18)}
.cl-dot__fill{position:absolute;inset:0;background:var(--crimson);transform:scaleX(0);transform-origin:left center}
.cl-root[dir="rtl"] .cl-dot__fill{transform-origin:right center}
.cl-dot.is-active .cl-dot__fill{animation:cl-fill 7s linear forwards;animation-play-state:paused}
.cl-root.is-playing .cl-dot.is-active .cl-dot__fill{animation-play-state:running}
.cl-root.is-still .cl-dot.is-active .cl-dot__fill{animation:none;transform:none}
@media (hover:hover){ .cl-dot:not(.is-active):hover .cl-dot__pill{background:var(--navy)} }
/* art */
.cl-hero__art{grid-area:art;position:relative;display:grid;place-items:center;width:min(100%,330px);aspect-ratio:1;justify-self:center}
@media (hover:hover) and (pointer:fine){ .cl-hero__art{cursor:grab} }
.cl-hero__float{grid-area:1 / 1;width:100%;height:100%;display:grid;place-items:center;animation:cl-float 1.5s var(--out) .15s both}
.cl-hero__halo{position:absolute;inset:9%;border-radius:50%;background:rgb(255 255 255 / .42)}
.cl-hero__orbit{position:absolute;inset:1.5%;border-radius:50%;border:2.5px dashed rgb(255 255 255 / .9)}
.cl-hero__img{grid-area:1 / 1;width:92%;height:auto;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 26px 22px rgb(16 20 40 / .22));opacity:0;transform:translateX(calc(var(--cl-x) * 48px)) scale(.9) rotate(calc(var(--cl-x) * 6deg));transition:opacity .3s var(--out),transform .5s var(--bounce)}
.cl-hero__img.is-active{opacity:1;transform:none}
.cl-hero__img--ship{width:84%;translate:0 -3%}
.cl-peb{position:absolute;display:block;border-radius:50%;box-shadow:var(--blob);animation:cl-pop .7s var(--bounce) both}
.cl-peb--coral{width:17%;aspect-ratio:1;background:var(--coral);top:4%;inset-inline-start:1%;animation-delay:.5s}
.cl-peb--sun{width:27%;aspect-ratio:2.7;border-radius:var(--pill);background:var(--sun);bottom:7%;inset-inline-end:-3%;rotate:-18deg;animation-delay:.65s}
.cl-peb--ring{width:11%;aspect-ratio:1;background:transparent;border:clamp(7px,1.1cqi,12px) solid var(--navy);top:10%;inset-inline-end:5%;box-shadow:0 10px 18px -10px rgb(16 20 40 / .4),inset 2px 2px 3px rgb(255 255 255 / .25);animation-delay:.8s}
.cl-peb--dot{width:5%;aspect-ratio:1;background:#fff;bottom:20%;inset-inline-start:7%;animation-delay:.95s}
@container cl (min-width:520px){
  .cl-hero__art{width:min(100%,400px)}
  .cl-hero__panel{padding:24px 32px 32px}
}
@container cl (min-width:860px){
  .cl-hero__panel{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);grid-template-areas:"copy art" "actions art";column-gap:28px;row-gap:0;padding:clamp(44px,5cqi,76px);padding-block-end:clamp(96px,8cqi,124px);min-height:560px}
  .cl-hero__art{width:min(100%,560px);align-self:center}
  .cl-hero__actions{margin-top:34px}
  /* the tray centres between its insets, so an end inset of X moves it X/2 toward the start: 30px at 860, 0 from 970 */

  .cl-load__copy{padding:10px 18px 10px 0}
  .cl-root[dir="rtl"] .cl-load__copy{padding:10px 0 10px 18px}
}
@container cl (min-width:960px){
  .cl-ocean{grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);gap:20px}
}

/* ---------- 10. Values ---------- */
.cl-values{list-style:none;margin:0;padding:0;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.cl-value{display:grid;grid-template-columns:56px minmax(0,1fr);column-gap:16px;row-gap:6px;align-items:start;align-content:start;background:var(--bg-2);border-radius:var(--r-lg);padding:22px;box-shadow:var(--sh-1);min-width:0}
.cl-value__chip{grid-row:span 2;width:56px;height:56px;display:grid;place-items:center;box-shadow:var(--blob)}
.cl-value__chip .cl-i{width:26px;height:26px}
.cl-value--0 .cl-value__chip{background:var(--sky);color:var(--navy);border-radius:50%}
.cl-value--1 .cl-value__chip{background:var(--sun);color:var(--navy);border-radius:18px}
.cl-value--2 .cl-value__chip{background:var(--coral);color:#fff;border-radius:50%}
.cl-value--3 .cl-value__chip{background:var(--navy);color:#fff;border-radius:18px}
.cl-value__title{font:700 21px/1.2 var(--f-display);letter-spacing:-.015em;color:var(--ink);align-self:center}
.cl-value__body{color:var(--muted);font-size:16px;line-height:1.6}
.cl-root[lang="ar"] .cl-value__title{letter-spacing:0;line-height:1.4}
@container cl (min-width:560px){
  .cl-values{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .cl-value{grid-template-columns:minmax(0,1fr);padding:28px;row-gap:12px}
  .cl-value__chip{grid-row:auto;margin-bottom:12px}
  .cl-value__title{align-self:start}
}
@container cl (min-width:1100px){
  .cl-values{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
  .cl-value{padding:32px 28px 34px}
}

/* ---------- 11. About ---------- */
.cl-about{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.cl-who{background:var(--bg-2);border-radius:var(--r-xl);padding:clamp(24px,4.6cqi,68px);box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:18px;min-width:0}
.cl-trio{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:auto;padding-top:26px;border-top:2px dashed var(--line)}
.cl-trio__chips{display:flex;align-items:center;padding-inline-start:4px}
.cl-trio__chip{--s:clamp(56px,44px + 1.6cqi,70px);width:var(--s);height:var(--s);display:grid;place-items:center;border-radius:50%;margin-inline-start:-10px;box-shadow:0 0 0 4px var(--bg-2),var(--blob)}
.cl-trio__chip:first-child{margin-inline-start:0}
.cl-trio__chip .cl-i{width:44%;height:44%}
.cl-trio__chip--sea{background:var(--sky);color:var(--navy);rotate:-6deg}
.cl-trio__chip--air{background:var(--sun);color:var(--navy);border-radius:32%;rotate:5deg;translate:0 -6px}
.cl-trio__chip--land{background:var(--coral);color:#fff;rotate:-4deg}
.cl-trio__txt{font:800 clamp(1.25rem,1rem + .9cqi,1.75rem)/1.15 var(--f-display);letter-spacing:-.025em;color:var(--ink)}
.cl-root[lang="ar"] .cl-trio__txt{letter-spacing:0;font-weight:700;line-height:1.4}
.cl-who__body{font-size:clamp(1.04rem,.96rem + .32cqi,1.2rem);line-height:1.7;color:var(--body);max-width:62ch;margin-top:6px}
.cl-mission{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;min-width:0;background:var(--navy);color:#fff;border-radius:var(--r-xl);padding:clamp(24px,4cqi,56px);padding-block-start:150px;--ring:#FFC845}
.cl-mission__blob{position:absolute;z-index:-1;border-radius:50%;box-shadow:var(--blob)}
.cl-mission__blob--a{width:210px;height:210px;background:var(--coral);inset-block-start:-96px;inset-inline-end:-60px}
.cl-mission__blob--b{width:116px;height:44px;border-radius:var(--pill);background:var(--sun);inset-block-start:46px;inset-inline-start:clamp(24px,4cqi,56px);rotate:-14deg}
.cl-mission__blob--c{width:30px;height:30px;background:var(--sky);inset-block-start:34px;inset-inline-start:calc(clamp(24px,4cqi,56px) + 136px)}
.cl-mission__title{font:700 13px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--sun)}
.cl-mission__text{font:600 clamp(1.15rem,.95rem + .62cqi,1.45rem)/1.5 var(--f-display);letter-spacing:-.01em;color:#fff}
.cl-root[lang="ar"] .cl-mission__title{letter-spacing:0;text-transform:none;font-size:15px;font-weight:500}
.cl-root[lang="ar"] .cl-mission__text{letter-spacing:0;font-weight:500;line-height:1.85;font-size:clamp(1.05rem,.92rem + .5cqi,1.3rem)}
@container cl (min-width:960px){
  .cl-about{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:20px}
  .cl-mission{padding-block-start:180px}
}

/* ---------- 12. CTA ---------- */
.cl-cta{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;background:var(--sun);border-radius:var(--r-xl);padding:clamp(24px,5cqi,76px);margin-top:70px}
.cl-cta__art{display:grid;place-items:center;margin-top:-96px}
.cl-cta__art img{width:min(70%,240px);height:auto;aspect-ratio:1;filter:drop-shadow(0 22px 18px rgb(16 20 40 / .25))}
.cl-cta__title{font:800 clamp(2rem,1rem + 3cqi,3.7rem)/1.02 var(--f-display);letter-spacing:-.04em;color:var(--navy);text-wrap:balance;max-width:16em}
.cl-cta__body{font-size:var(--t-lede);line-height:1.6;color:var(--body);margin:18px 0 28px;max-width:50ch}
.cl-root[lang="ar"] .cl-cta__title{letter-spacing:0;font-weight:700;line-height:1.3;font-size:clamp(1.8rem,.9rem + 2.6cqi,3.2rem)}
.cl-cta__shape{position:absolute;border-radius:50%;box-shadow:var(--blob);pointer-events:none}
.cl-cta__shape--a{width:70px;height:70px;background:var(--coral);inset-block-end:-26px;inset-inline-end:clamp(40px,22%,300px)}
.cl-cta__shape--b{width:26px;height:26px;background:#fff;inset-block-end:30px;inset-inline-end:calc(clamp(40px,22%,300px) + 84px)}
@container cl (max-width:640px){
  .cl-cta__shape--a{width:56px;height:56px;inset-inline-end:22px;inset-block-end:-20px}
  .cl-cta__shape--b{inset-inline-end:92px;inset-block-end:-8px}
}
@container cl (min-width:860px){
  .cl-cta{grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr);align-items:center;column-gap:32px;margin-top:40px}
  .cl-cta__art{order:2;margin:-120px 0 -40px}
  .cl-cta__art img{width:min(100%,380px)}
}

/* ---------- 13. Contact ---------- */
.cl-contact{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
.cl-info{display:grid;gap:16px;min-width:0}
.cl-card{background:var(--bg-2);border-radius:var(--r-lg);padding:clamp(20px,2.6cqi,30px);box-shadow:var(--sh-1);min-width:0}
.cl-card__title{display:flex;align-items:center;gap:12px;font:700 19px/1.25 var(--f-display);letter-spacing:-.01em;color:var(--ink);margin-bottom:16px}
.cl-root[lang="ar"] .cl-card__title,.cl-root[lang="ar"] .cl-card__sub{letter-spacing:0}
.cl-card__chip{flex:none;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;box-shadow:var(--blob)}
.cl-card__chip .cl-i{width:19px;height:19px}
.cl-card__chip--sun{background:var(--sun);color:var(--navy)}
.cl-card__chip--sky{background:var(--sky);color:var(--navy)}
.cl-card__chip--coral{background:var(--coral);color:#fff;border-radius:50%}
.cl-nums{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cl-num{display:flex;align-items:center;gap:6px;min-width:0;background:var(--bg-3);border-radius:var(--pill);padding:6px}
.cl-num__wa,.cl-num__tel{flex:1;display:flex;align-items:center;gap:12px;min-width:0;min-height:56px;padding-inline:4px 14px;border-radius:var(--pill);text-decoration:none;color:var(--ink);transition:background-color .2s}
.cl-num__ico{flex:none;width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:var(--clay)}
/* the call-only line: a sunny chip with a handset instead of the navy chat bubble, and the whole pill is the call link */
.cl-num__ico--call{background:var(--sun);color:var(--navy)}
.cl-num__txt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.cl-num__kind{font-size:13px;font-weight:500;color:var(--muted)}
.cl-num__val{font:700 clamp(16px,15px + .3cqi,19px)/1.25 var(--f-display);color:var(--ink)}
.cl-num__call{flex:none;width:52px;height:52px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:var(--clay-soft);transition:background-color .2s,color .2s,transform .25s var(--bounce)}
.cl-num__call:active,.cl-num__wa:active,.cl-num__tel:active{transform:scale(.98)}
.cl-addr{font-style:normal;color:var(--body);line-height:1.65;display:flex;flex-direction:column}
.cl-chiplink{display:inline-flex;align-items:center;gap:9px;min-height:46px;margin-top:16px;padding-inline:16px 18px;border-radius:var(--pill);background:var(--bg-3);color:var(--ink);font-weight:700;font-size:15px;text-decoration:none;transition:background-color .2s,transform .25s var(--bounce)}
.cl-chiplink:active{transform:scale(.97)}
.cl-links{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.cl-link{display:inline-flex;align-items:center;gap:10px;min-height:46px;max-width:100%;padding-inline:10px;margin-inline:-10px;border-radius:14px;color:var(--ink);font-weight:500;text-decoration:none;transition:background-color .2s}
.cl-link .cl-i{color:var(--muted)}
.cl-card__sub{font:700 15px/1.3 var(--f-display);color:var(--ink);margin:18px 0 6px;padding-top:18px;border-top:2px dashed var(--line)}
@media (hover:hover){
  .cl-num__wa:hover,.cl-num__tel:hover{background:var(--sky-soft)}
  .cl-num__call:hover{background:var(--navy);color:#fff}
  .cl-chiplink:hover{background:var(--sky-soft)}
  .cl-link:hover{background:var(--bg-3);text-decoration:underline;text-underline-offset:3px}
}
@container cl (max-width:379px){
  .cl-num{gap:4px;padding:5px}
  .cl-num__wa,.cl-num__tel{gap:8px;padding-inline:2px 8px}
  .cl-num__ico{width:40px;height:40px}
  .cl-num__ico .cl-i{width:18px;height:18px}
  .cl-num__val{font-size:15px}
  .cl-num__call{width:46px;height:46px}
}
/* form */
.cl-formcard{position:relative;background:var(--bg-2);border-radius:var(--r-xl);padding:clamp(20px,3.6cqi,48px);box-shadow:var(--sh-1);min-width:0}
.cl-form__title{font:800 clamp(1.55rem,1.1rem + 1.1cqi,2.15rem)/1.1 var(--f-display);letter-spacing:-.03em;color:var(--ink);margin-bottom:24px}
.cl-root[lang="ar"] .cl-form__title{letter-spacing:0;font-weight:700;line-height:1.35}
.cl-form__grid{display:grid;gap:18px 16px;grid-template-columns:minmax(0,1fr)}
.cl-field{display:flex;flex-direction:column;gap:8px;min-width:0}
.cl-field__label{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-weight:700;font-size:15px;color:var(--ink)}
.cl-field__req{font-weight:500;font-size:12.5px;color:var(--muted)}
.cl-input{width:100%;min-height:56px;padding:14px 18px;border-radius:18px;border:2px solid transparent;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--edge);font:500 16px/1.4 var(--f-body);color:var(--body);transition:border-color .15s,box-shadow .15s,background-color .15s;appearance:none;-webkit-appearance:none}
.cl-input::placeholder{color:#7A809E}
textarea.cl-input{min-height:148px;resize:vertical;line-height:1.55}
.cl-select{position:relative}
.cl-select .cl-input{padding-inline-end:52px;cursor:pointer}
.cl-select__chev{position:absolute;inset-block:0;inset-inline-end:16px;margin-block:auto;width:22px;height:22px;color:var(--ink);pointer-events:none}
.cl-input:focus{outline:none;border-color:var(--navy);background:#fff;box-shadow:0 0 0 4px rgb(55 61 116 / .2)}
.cl-input[aria-invalid="true"]{border-color:var(--err);background:var(--err-bg);box-shadow:none}
.cl-input[aria-invalid="true"]:focus{box-shadow:0 0 0 4px rgb(180 35 24 / .2)}
.cl-select.is-flash .cl-input{animation:cl-flash 1.4s var(--out)}
.cl-field__err{display:flex;align-items:flex-start;gap:7px;color:var(--err);font-size:14px;font-weight:500;line-height:1.45}
.cl-field__err .cl-i{width:17px;height:17px;margin-top:1px}
.cl-form__foot{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:26px}
.cl-form__foot .cl-btn{min-width:220px}
@media (hover:hover){ .cl-input:hover:not(:focus){background:var(--bg-3)} .cl-input[aria-invalid="true"]:hover:not(:focus){background:#FFEAE8} }
.cl-success{display:flex;flex-direction:column;align-items:flex-start;gap:18px;padding:12px 0 4px;animation:cl-rise .35s var(--out) both}
.cl-success__again{margin-top:22px;animation:cl-rise .35s var(--out) .1s both}
.cl-success__ico{width:76px;height:76px;border-radius:50%;background:var(--sky);color:var(--navy);display:grid;place-items:center;box-shadow:var(--blob);animation:cl-pop .6s var(--bounce) .1s both}
.cl-success__ico .cl-i{width:36px;height:36px;stroke-width:2.6}
.cl-success__msg{font:700 clamp(1.3rem,1.05rem + .7cqi,1.7rem)/1.3 var(--f-display);letter-spacing:-.02em;color:var(--ink);max-width:24em}
.cl-root[lang="ar"] .cl-success__msg{letter-spacing:0;line-height:1.55}
@container cl (min-width:641px){
  .cl-form__grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cl-field--full{grid-column:1 / -1}
}
@container cl (min-width:960px){
  .cl-contact{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:stretch}
  /* the form card runs the full height of the info column; the message box takes up the difference */
  .cl-formcard{display:flex;flex-direction:column}
  .cl-form{flex:1;display:flex;flex-direction:column}
  .cl-form__grid{flex:1;grid-template-rows:auto auto minmax(0,1fr)}
  .cl-field--full .cl-input{flex:1}
}
@container cl (max-width:640px){
  .cl-form__foot .cl-btn{width:100%}
}

/* ---------- 14. Footer ---------- */
/* bottom reserve: the floating WhatsApp button (58 px + 16-18 px inset) rests below the navy panel, never on it */
.cl-footer{padding:clamp(64px,8.5cqi,120px) 0 92px}
.cl-foot{background:var(--navy);color:#fff;border-radius:var(--r-xl);padding:clamp(28px,4.6cqi,64px) clamp(22px,4cqi,60px) 26px;--ring:#FFC845;position:relative;overflow:hidden;isolation:isolate}
.cl-foot__grid{display:grid;gap:30px;grid-template-columns:minmax(0,1fr)}
.cl-foot__brand .cl-brand{margin-inline-start:-6px}
.cl-foot__line{color:rgb(255 255 255 / .8);margin-top:18px;max-width:30ch;font-size:15.5px}
.cl-foot__h{font:700 12.5px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--sun);margin-bottom:10px}
.cl-root[lang="ar"] .cl-foot__h{letter-spacing:0;text-transform:none;font-size:14.5px;font-weight:500}
.cl-foot__list{list-style:none;margin:0;padding:0;display:grid;gap:0}
.cl-foot__a{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding-inline:12px;margin-inline:-12px;border-radius:var(--pill);color:#fff;text-decoration:none;font-size:15.5px;transition:background-color .2s}
.cl-foot__a .cl-i{width:18px;height:18px;color:rgb(255 255 255 / .75)}
.cl-foot__num{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;min-width:0}
.cl-foot__tag{display:inline-flex;align-items:center;min-height:22px;padding-inline:9px;border-radius:var(--pill);background:rgb(255 255 255 / .12);color:rgb(255 255 255 / .88);font-size:12.5px;font-weight:500;line-height:1.2;white-space:nowrap}
.cl-foot__bottom{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 24px;margin-top:40px;padding-top:22px;border-top:1px solid rgb(255 255 255 / .16);color:rgb(255 255 255 / .74);font-size:14px}
.cl-foot__blob{position:absolute;z-index:-1;width:120px;height:120px;border-radius:50%;background:var(--coral);inset-block-start:-66px;inset-inline-end:-44px;box-shadow:var(--blob)}
@media (hover:hover){
  .cl-foot__a:hover{background:var(--navy-3)}
  .cl-foot .cl-brand:hover{background:var(--navy-3)}
}
@container cl (max-width:639px){
  .cl-foot__blob{width:96px;height:96px;inset-block-start:-54px;inset-inline-end:-40px}
}
/* the footer mark scales with the column it sits in (emblem = 2.9x the name size) */
@container cl (max-width:639px){
  .cl-brand--lg{--fn:clamp(15px,4.9cqi,22px)}
}
@container cl (min-width:640px){
  .cl-foot__grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container cl (min-width:640px) and (max-width:1023px){
  .cl-brand--lg{--fn:clamp(15px,2.4cqi,22px)}
}
@container cl (min-width:1024px){
  .cl-foot__grid{grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,.9fr);gap:40px}
  .cl-brand--lg{--fn:clamp(15px,1.55cqi,22px)}
}

/* ---------- 15. Overlays (outside the container; width classes come from JS) ---------- */
.cl-sheet{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;background:var(--bg);color:var(--body);overflow-y:auto;overscroll-behavior:contain;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);animation:cl-sheet-in .22s var(--out) both}
.cl-sheet__head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px;padding:10px 14px 10px 22px;background:var(--bg)}
.cl-root[dir="rtl"] .cl-sheet__head{padding:10px 22px 10px 14px}
.cl-sheet__title{font:800 24px/1.1 var(--f-display);letter-spacing:-.02em;color:var(--ink)}
.cl-root[lang="ar"] .cl-sheet__title{letter-spacing:0;font-weight:700}
.cl-x{flex:none;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background-color .2s,transform .25s var(--bounce)}
.cl-x:active{transform:scale(.94)}
.cl-sheet__body{width:100%;max-width:640px;margin-inline:auto;padding:6px 16px 28px;display:flex;flex-direction:column;gap:10px}
.cl-mrow{display:flex;align-items:center;gap:14px;min-height:68px;padding-block:8px;padding-inline:8px 18px;border-radius:26px;background:#fff;color:var(--ink);font:700 19px/1.2 var(--f-display);letter-spacing:-.01em;text-decoration:none;box-shadow:var(--sh-1);transition:background-color .2s,transform .25s var(--bounce)}
.cl-mrow:active{transform:scale(.98)}
.cl-root[lang="ar"] .cl-mrow{letter-spacing:0;font-weight:500}
.cl-mrow__chip{flex:none;width:50px;height:50px;border-radius:18px;display:grid;place-items:center;box-shadow:var(--blob)}
.cl-mrow__chip .cl-i{width:22px;height:22px}
.cl-mrow:nth-child(1) .cl-mrow__chip{background:var(--sky);color:var(--navy)}
.cl-mrow:nth-child(2) .cl-mrow__chip{background:var(--sun);color:var(--navy)}
.cl-mrow:nth-child(3) .cl-mrow__chip{background:var(--coral);color:#fff;border-radius:50%}
.cl-mrow:nth-child(4) .cl-mrow__chip{background:var(--navy);color:#fff;border-radius:50%}
.cl-mrow__go{margin-inline-start:auto;color:var(--muted)}
.cl-sheet__list{display:flex;flex-direction:column;gap:10px}
.cl-sheet__cta{margin-top:10px}
.cl-sheet__foot{display:flex;justify-content:center;margin-top:8px}
.cl-sheet > .cl-sheet__body{flex:1}
.cl-sheet__pebs{position:relative;display:block;width:200px;height:110px;margin:auto auto 0;flex:none}
.cl-sheet__peb{position:absolute;display:block;border-radius:50%;box-shadow:var(--blob);animation:cl-pop .7s var(--bounce) both}
.cl-sheet__peb--coral{width:62px;height:62px;background:var(--coral);inset-inline-start:18px;top:30px;animation-delay:.12s}
.cl-sheet__peb--sun{width:84px;height:32px;border-radius:var(--pill);background:var(--sun);inset-inline-start:92px;top:62px;rotate:-16deg;animation-delay:.2s}
.cl-sheet__peb--ring{width:34px;height:34px;background:transparent;border:9px solid var(--navy);inset-inline-end:16px;top:14px;box-shadow:0 10px 18px -10px rgb(16 20 40 / .4);animation-delay:.28s}
.cl-sheet__peb--sky{width:22px;height:22px;background:var(--sky);inset-inline-start:100px;top:16px;animation-delay:.36s}
.cl-wa__badge{display:none}
.cl-wa--sheet .cl-wa__badge{display:grid;place-items:center;width:84px;height:84px;margin:8px 0 6px;border-radius:28px;background:var(--sun);color:var(--navy);box-shadow:var(--blob);rotate:-6deg}
.cl-wa--sheet .cl-wa__badge .cl-i{width:40px;height:40px}
@media (hover:hover){
  .cl-x:hover{background:var(--bg-3)}
  .cl-mrow:hover{background:var(--bg-3)}
}
/* dock + WhatsApp */
.cl-dock{position:sticky;bottom:0;height:0;z-index:60}
.cl-fab{position:absolute;inset-block-end:calc(18px + env(safe-area-inset-bottom));inset-inline-end:18px;display:inline-flex;align-items:center;gap:10px;height:58px;padding-inline:16px 24px;border:0;border-radius:var(--pill);background:var(--navy);color:#fff;font:700 16px/1 var(--f-body);cursor:pointer;box-shadow:inset 0 -4px 0 rgb(0 0 0 / .25),inset 0 2px 0 rgb(255 255 255 / .14),0 16px 30px -12px rgb(16 20 40 / .6);transition:background-color .2s,transform .3s var(--bounce)}
.cl-fab .cl-i{width:26px;height:26px}
.cl-fab:active{transform:translateY(2px) scale(.97)}
.cl-fab.is-narrow{width:58px;padding:0;justify-content:center;inset-inline-end:16px;inset-block-end:calc(16px + env(safe-area-inset-bottom))}
.cl-fab.is-narrow .cl-fab__label{display:none}
.cl-scrim{position:fixed;inset:0;z-index:1;margin:0;padding:0;border:0;background:rgb(0 0 0 / .45);cursor:pointer;animation:cl-fade .2s var(--out) both}
.cl-wa{z-index:2;background:#fff;color:var(--body)}
.cl-wa--pop{position:absolute;inset-block-end:calc(18px + 58px + 14px + env(safe-area-inset-bottom));inset-inline-end:18px;width:392px;max-width:calc(100vw - 36px);padding:22px;border-radius:30px;box-shadow:0 30px 60px -24px rgb(16 20 40 / .5);animation:cl-pop-in .22s var(--out) both;max-height:calc(100vh - 102px - env(safe-area-inset-bottom));max-height:calc(100dvh - 102px - env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain}
.cl-wa--sheet{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);animation:cl-sheet-in .22s var(--out) both}
.cl-wa__head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.cl-wa--sheet .cl-wa__head{position:sticky;top:0;align-items:center;min-height:68px;padding:10px 14px 10px 22px;background:var(--bg)}
.cl-root[dir="rtl"] .cl-wa--sheet .cl-wa__head{padding:10px 22px 10px 14px}
.cl-wa__title{font:800 22px/1.15 var(--f-display);letter-spacing:-.02em;color:var(--ink)}
.cl-wa--pop .cl-wa__title{padding-top:6px}
.cl-root[lang="ar"] .cl-wa__title{letter-spacing:0;font-weight:700;line-height:1.4}
.cl-wa__body{display:flex;flex-direction:column;gap:12px}
.cl-wa--sheet .cl-wa__body{width:100%;max-width:640px;margin-inline:auto;padding:4px 16px 28px}
.cl-wa__sub{color:var(--muted);font-size:15.5px;margin:6px 0 6px}
.cl-wa__list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cl-warow{display:flex;align-items:center;gap:14px;min-height:72px;padding-block:10px;padding-inline:10px 20px;border-radius:var(--pill);background:var(--bg-3);color:var(--ink);text-decoration:none;transition:background-color .2s,transform .25s var(--bounce)}
.cl-wa--sheet .cl-warow{background:#fff;box-shadow:var(--sh-1)}
.cl-warow:active{transform:scale(.98)}
.cl-warow__ico{flex:none;width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:var(--clay)}
.cl-warow__ico .cl-i{width:26px;height:26px}
.cl-warow__num{font:700 20px/1.2 var(--f-display);color:var(--ink)}
.cl-warow__go{margin-inline-start:auto;color:var(--muted)}
@media (hover:hover){
  .cl-fab:hover{background:var(--navy-2)}
  .cl-warow:hover{background:var(--sky-soft)}
  .cl-wa--sheet .cl-warow:hover{background:var(--bg-3)}
}

/* ---------- 16. Motion ---------- */
@keyframes cl-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes cl-float{0%{translate:0 22px}55%{translate:0 -9px}80%{translate:0 3px}100%{translate:0 0}}
@keyframes cl-pop{0%{scale:.55}60%{scale:1.1}100%{scale:1}}
@keyframes cl-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes cl-sheet-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes cl-pop-in{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes cl-fade{from{opacity:0}to{opacity:1}}
@keyframes cl-flash{0%,100%{box-shadow:inset 0 0 0 1.5px var(--edge)}25%,60%{box-shadow:0 0 0 5px rgb(255 200 69 / .9)}}
@media (prefers-reduced-motion: reduce){
  .cl-root *,.cl-root *::before,.cl-root *::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .cl-dot.is-active .cl-dot__fill{animation:none!important;transform:none}
}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<div class="cl-root {{rootCls}}" id="top" lang="{{lang}}" dir="{{dir}}">
<a class="cl-skip" href="#main">{{t.nav.skip}}</a>
<div class="cl-shell" id="cl-shell">

<header class="cl-header">
  <div class="cl-wrap cl-bar">
    <a class="cl-brand" href="#top" aria-label="{{brandLabel}}">
      <img class="cl-brand__mark" src="../img/emblem.svg" alt="" width="55" height="46" decoding="async">
      <span class="cl-brand__words">
        <span class="cl-brand__name" lang="en">FREIGHT NET SARL</span>
        <span class="cl-brand__tag" lang="en">SEA . AIR . LAND</span>
      </span>
    </a>
    <nav class="cl-nav" aria-label="{{x.navLabel}}">
      <a class="cl-nav__a" href="#top">{{t.nav.home}}</a>
      <a class="cl-nav__a" href="#services">{{t.nav.services}}</a>
      <a class="cl-nav__a" href="#about">{{t.nav.about}}</a>
      <a class="cl-nav__a" href="#contact">{{t.nav.contact}}</a>
    </nav>
    <div class="cl-bar__end">
      <button class="cl-lang" type="button" onClick="{{toggleLang}}">
        <svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
        <span class="cl-sr">{{t.nav.langLabel}}: </span><span class="cl-lang__txt cl-lang__full" lang="{{otherLang}}">{{t.nav.lang}}</span><span class="cl-lang__txt cl-lang__short" lang="{{otherLang}}" aria-hidden="true">{{langShort}}</span>
      </button>
      <a class="cl-btn cl-btn--primary cl-bar__cta" href="#contact">{{t.nav.quote}}<svg class="cl-i cl-flip cl-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
      <button class="cl-menu-btn" id="cl-menu-btn" type="button" onClick="{{openMenu}}" aria-haspopup="dialog" aria-expanded="{{menuExpanded}}" aria-label="{{t.nav.menu}}">
        <svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16"></path><path d="M4 16h10"></path></svg>
        <span class="cl-menu-btn__txt">{{t.nav.menu}}</span>
      </button>
    </div>
  </div>
</header>

<main id="main" tabIndex="-1">

<section class="cl-hero cl-wrap" aria-roledescription="carousel" aria-label="{{x.heroLabel}}" onPointerEnter="{{heroEnter}}" onPointerLeave="{{heroLeave}}" onFocus="{{heroFocus}}" onBlur="{{heroBlur}}">
  <h1 class="cl-sr">{{h1}}</h1>
  <div class="cl-hero__panel {{panelCls}}" onPointerDown="{{swipeDown}}" onPointerMove="{{swipeMove}}" onPointerUp="{{swipeUp}}" onPointerCancel="{{swipeCancel}}" onLostPointerCapture="{{swipeLost}}" onDragStart="{{noDrag}}">
    <div class="cl-hero__copy" aria-live="{{heroLive}}">
      <sc-for list="{{slides}}" as="s" hint-placeholder-count="2">
        <div class="cl-slide {{s.cls}}" role="group" aria-roledescription="slide" aria-label="{{s.label}}" aria-hidden="{{s.ariaHidden}}">
          <p class="cl-chip">{{s.eyebrow}}</p>
          <h2 class="cl-hero__title">{{s.title}}</h2>
          <p class="cl-hero__body">{{s.body}}</p>
        </div>
      </sc-for>
    </div>
    <div class="cl-hero__art">
      <span class="cl-hero__orbit" aria-hidden="true"></span>
      <span class="cl-hero__halo" aria-hidden="true"></span>
      <span class="cl-peb cl-peb--coral" aria-hidden="true"></span>
      <span class="cl-peb cl-peb--ring" aria-hidden="true"></span>
      <span class="cl-peb cl-peb--dot" aria-hidden="true"></span>
      <div class="cl-hero__float">
        <img class="cl-hero__img {{slides.0.cls}}" src="../img/s3-hero.webp" alt="{{slides.0.alt}}" aria-hidden="{{slides.0.ariaHidden}}" width="800" height="800" decoding="async">
        <img class="cl-hero__img cl-hero__img--ship {{slides.1.cls}}" src="../img/s3-ocean.webp" alt="{{slides.1.alt}}" aria-hidden="{{slides.1.ariaHidden}}" width="800" height="800" decoding="async">
      </div>
      <span class="cl-peb cl-peb--sun" aria-hidden="true"></span>
      <div class="cl-dots" onAnimationEnd="{{fillDone}}">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="2">
          <button class="cl-dot {{d.cls}}" type="button" onClick="{{d.go}}" aria-label="{{d.label}}" aria-current="{{d.current}}"><span class="cl-dot__pill" aria-hidden="true"><span class="cl-dot__fill"></span></span></button>
        </sc-for>
      </div>
    </div>
    <div class="cl-hero__actions">
      <div class="cl-hero__ctas">
        <a class="cl-btn" href="#contact" onClick="{{heroLink}}">{{t.hero.ctaQuote}}<svg class="cl-i cl-flip cl-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
        <button class="cl-btn cl-btn--light" type="button" onClick="{{openWaHero}}" aria-haspopup="dialog" aria-expanded="{{waExpHero}}">
          <svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path><g transform="translate(7.4 6.9) scale(.42)" stroke-width="4.6"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></g></svg>
          {{t.hero.ctaWhatsapp}}
        </button>
      </div>
    </div>
  </div>
</section>

<ul class="cl-facts cl-wrap">
  <li class="cl-fact cl-fact--0">
    <span class="cl-fact__chip"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="3"></rect><path d="M3 10h18"></path><path d="m9 16 2 2 4-4"></path></svg></span>
    <span class="cl-fact__txt"><span class="cl-fact__value">{{t.facts.0.value}}</span><span class="cl-fact__label">{{t.facts.0.label}}</span></span>
  </li>
  <li class="cl-fact cl-fact--1">
    <span class="cl-fact__chip"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"></path><path d="m9 12 2 2 4-4"></path></svg></span>
    <span class="cl-fact__txt"><span class="cl-fact__value">{{t.facts.1.value}}</span><span class="cl-fact__label">{{t.facts.1.label}}</span></span>
  </li>
  <li class="cl-fact cl-fact--2">
    <span class="cl-fact__chip"><svg class="cl-i cl-flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="3"></circle><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path><circle cx="18" cy="5" r="3"></circle></svg></span>
    <span class="cl-fact__txt"><span class="cl-fact__value">{{t.facts.2.value}}</span><span class="cl-fact__label">{{t.facts.2.label}}</span></span>
  </li>
</ul>

<section class="cl-sec" id="services" tabIndex="-1" aria-labelledby="cl-h-services">
  <div class="cl-wrap">
    <div class="cl-head cl-head--split">
      <p class="cl-eyebrow">{{t.services.eyebrow}}</p>
      <h2 class="cl-h2" id="cl-h-services">{{t.services.title}}</h2>
      <p class="cl-lede">{{t.services.lede}}</p>
    </div>
    <ul class="cl-bento">
      <sc-for list="{{services}}" as="s" hint-placeholder-count="7">
        <li class="cl-svc {{s.cls}}">
          <div class="cl-svc__front">
            <div class="cl-svc__art"><img src="{{s.img}}" alt="{{s.alt}}" width="800" height="800" loading="lazy" decoding="async"></div>
            <div class="cl-svc__text">
              <h3 class="cl-svc__title">{{s.title}}</h3>
              <p class="cl-svc__short">{{s.short}}</p>
            </div>
          </div>
          <div class="cl-svc__back" id="{{s.panelId}}">
            <div class="cl-svc__bhead">
              <img class="cl-svc__mini" src="{{s.img}}" alt="" width="800" height="800" loading="lazy" decoding="async">
              <h4 class="cl-svc__dtitle">{{s.detailTitle}}</h4>
            </div>
            <p class="cl-svc__detail">{{s.detail}}</p>
            <a class="cl-btn cl-btn--sm" href="#contact" onClick="{{s.quote}}">{{t.services.cta}}<svg class="cl-i cl-flip cl-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
          </div>
          <button class="cl-svc__toggle" type="button" onClick="{{s.toggle}}" aria-expanded="{{s.expanded}}" aria-controls="{{s.panelId}}" aria-label="{{s.title}}">
            <span class="cl-svc__ico"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span>
          </button>
        </li>
      </sc-for>
    </ul>
  </div>
</section>

<section class="cl-sec" aria-labelledby="cl-h-ocean">
  <div class="cl-wrap">
    <div class="cl-head">
      <p class="cl-eyebrow cl-eyebrow--sky">{{t.ocean.eyebrow}}</p>
      <h2 class="cl-h2" id="cl-h-ocean">{{t.ocean.title}}</h2>
    </div>
    <div class="cl-ocean">
      <div class="cl-load">
        <fieldset class="cl-seg {{segCls}}">
          <legend class="cl-sr">{{t.ocean.eyebrow}}</legend>
          <span class="cl-seg__thumb" aria-hidden="true"></span>
          <label class="cl-seg__opt">
            <input class="cl-seg__in" type="radio" name="cl-load" value="fcl" checked="{{isFcl}}" onChange="{{pickFcl}}">
            <span class="cl-seg__face"><span class="cl-seg__tag">{{t.ocean.fcl.tag}}</span><span class="cl-seg__name">{{t.ocean.fcl.name}}</span></span>
          </label>
          <label class="cl-seg__opt">
            <input class="cl-seg__in" type="radio" name="cl-load" value="lcl" checked="{{isLcl}}" onChange="{{pickLcl}}">
            <span class="cl-seg__face"><span class="cl-seg__tag">{{t.ocean.lcl.tag}}</span><span class="cl-seg__name">{{t.ocean.lcl.name}}</span></span>
          </label>
        </fieldset>
        <div class="cl-load__stage {{segCls}}">
          <div class="cl-load__art">
            <span class="cl-load__plate" aria-hidden="true"></span>
            <img class="cl-load__img {{fclCls}}" src="../img/s3-fcl.webp" alt="{{x.alt.fcl}}" aria-hidden="{{fclHidden}}" width="800" height="800" loading="lazy" decoding="async">
            <img class="cl-load__img {{lclCls}}" src="../img/s3-lcl.webp" alt="{{x.alt.lcl}}" aria-hidden="{{lclHidden}}" width="800" height="800" loading="lazy" decoding="async">
          </div>
          <div class="cl-load__copy" aria-live="polite">
            <div class="cl-load__txt cl-load__txt--fcl {{fclCls}}">
              <span class="cl-load__tag">{{t.ocean.fcl.tag}}</span>
              <h3 class="cl-load__name">{{t.ocean.fcl.name}}</h3>
              <p class="cl-load__body">{{t.ocean.fcl.body}}</p>
            </div>
            <div class="cl-load__txt cl-load__txt--lcl {{lclCls}}">
              <span class="cl-load__tag">{{t.ocean.lcl.tag}}</span>
              <h3 class="cl-load__name">{{t.ocean.lcl.name}}</h3>
              <p class="cl-load__body">{{t.ocean.lcl.body}}</p>
            </div>
          </div>
        </div>
      </div>
      <div class="cl-dcard">
        <span class="cl-dcard__blob" aria-hidden="true"></span>
        <span class="cl-dcard__blob2" aria-hidden="true"></span>
        <span class="cl-dcard__ico"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 1 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"></path><path d="M21 16v2a4 4 0 0 1-4 4h-5"></path></svg></span>
        <h3 class="cl-dcard__title">{{t.ocean.contactTitle}}</h3>
        <p class="cl-dcard__body">{{t.ocean.contactBody}}</p>
        <span class="cl-dcard__push" aria-hidden="true"></span>
        <button class="cl-btn cl-btn--sun cl-btn--sm" type="button" onClick="{{openWaCard}}" aria-haspopup="dialog" aria-expanded="{{waExpCard}}">
          <svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path><g transform="translate(7.4 6.9) scale(.42)" stroke-width="4.6"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></g></svg>
          {{t.hero.ctaWhatsapp}}
        </button>
      </div>
    </div>
  </div>
</section>

<section class="cl-sec" aria-labelledby="cl-h-values">
  <div class="cl-wrap">
    <div class="cl-head">
      <p class="cl-eyebrow cl-eyebrow--sun">{{t.values.eyebrow}}</p>
      <h2 class="cl-h2" id="cl-h-values">{{t.values.title}}</h2>
    </div>
    <ul class="cl-values">
      <li class="cl-value cl-value--0">
        <span class="cl-value__chip"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17 2 2a1 1 0 1 0 3-3"></path><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"></path><path d="m21 3 1 11h-2"></path><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"></path><path d="M3 4h8"></path></svg></span>
        <h3 class="cl-value__title">{{t.values.items.0.title}}</h3>
        <p class="cl-value__body">{{t.values.items.0.body}}</p>
      </li>
      <li class="cl-value cl-value--1">
        <span class="cl-value__chip"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"></path></svg></span>
        <h3 class="cl-value__title">{{t.values.items.1.title}}</h3>

<section class="cl-sec" id="about" tabIndex="-1" aria-labelledby="cl-h-about">

</section>

<section class="cl-sec" id="contact" tabIndex="-1" aria-labelledby="cl-h-contact">
  <div class="cl-wrap">
    <div class="cl-head">
      <p class="cl-eyebrow">{{t.contactSection.eyebrow}}</p>
      <h2 class="cl-h2" id="cl-h-contact">{{t.contactSection.title}}</h2>
      <p class="cl-lede">{{t.contactSection.lede}}</p>
    </div>
    <div class="cl-contact">
      <div class="cl-info">
        <div class="cl-card">
          <h3 class="cl-card__title"><span class="cl-card__chip cl-card__chip--sky"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></span>{{t.contactSection.phoneTitle}}</h3>
          <ul class="cl-nums">
            <sc-for list="{{numbers}}" as="n" hint-placeholder-count="2">
              <li class="cl-num">
                <a class="cl-num__wa" href="{{n.wa}}" target="_blank" rel="noopener">
                  <span class="cl-num__ico"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path><g transform="translate(7.4 6.9) scale(.42)" stroke-width="4.6"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></g></svg></span>
                  <span class="cl-num__txt"><span class="cl-num__kind">{{t.whatsapp.button}}</span><span class="cl-num__val cl-pin" dir="ltr">{{n.display}}</span></span>
                  <span class="cl-sr"> ({{x.newTab}})</span>
                </a>
                <a class="cl-num__call" href="{{n.tel}}" aria-label="{{n.callLabel}}"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></a>
              </li>
            </sc-for>
            <sc-for list="{{phones}}" as="p" hint-placeholder-count="1">
              <li class="cl-num cl-num--call">
                <a class="cl-num__tel" href="{{p.tel}}">
                  <span class="cl-num__ico cl-num__ico--call"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></span>
                  <span class="cl-num__txt"><span class="cl-num__kind">{{x.callOnly}}</span><span class="cl-num__val cl-pin" dir="ltr">{{p.display}}</span></span>
                </a>
              </li>
            </sc-for>
          </ul>
        </div>
        <div class="cl-card">
          <h3 class="cl-card__title"><span class="cl-card__chip cl-card__chip--coral"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span>{{t.contactSection.officeTitle}}</h3>
          <address class="cl-addr">
            <sc-for list="{{t.contactSection.address}}" as="line" hint-placeholder-count="3"><span>{{line}}</span></sc-for>
          </address>
          <a class="cl-chiplink" href="{{c.mapsUrl}}" target="_blank" rel="noopener">{{t.contactSection.maps}}<span class="cl-sr"> ({{x.newTab}})</span><svg class="cl-i cl-flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a>
        </div>
        <div class="cl-card">
          <h3 class="cl-card__title"><span class="cl-card__chip cl-card__chip--sun"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="3"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></span>{{t.contactSection.emailTitle}}</h3>
          <ul class="cl-links">
            <sc-for list="{{c.emails}}" as="em" hint-placeholder-count="2">
              <li><a class="cl-link" href="mailto:{{em}}"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="3"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg><span class="cl-pin cl-anywhere" dir="ltr">{{em}}</span></a></li>
            </sc-for>
          </ul>
          <h3 class="cl-card__sub">{{t.footer.follow}}</h3>
          <a class="cl-link" href="{{insta.url}}" target="_blank" rel="noopener"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><path d="M17.5 6.5h.01"></path></svg><span class="cl-sr">{{x.instagram}} </span><span class="cl-pin" dir="ltr">{{insta.handle}}</span><span class="cl-sr"> ({{x.newTab}})</span></a>
        </div>
      </div>

      <div class="cl-formcard">
        <h3 class="cl-form__title" id="cl-h-form">{{F.title}}</h3>
        <sc-if value="{{showForm}}" hint-placeholder-val="{{ true }}">
          <form class="cl-form" noValidate onSubmit="{{onSubmit}}" aria-labelledby="cl-h-form">
            <div class="cl-form__grid">
              <div class="cl-field">
                <label class="cl-field__label" for="cl-f-name"><span>{{F.name}}</span><span class="cl-field__req">{{F.required}}</span></label>
                <input class="cl-input" id="cl-f-name" name="name" type="text" autocomplete="name" value="{{form.name}}" onChange="{{onName}}" aria-invalid="{{fe.name.invalid}}" aria-describedby="{{fe.name.desc}}" aria-required="true">
                <sc-if value="{{fe.name.has}}" hint-placeholder-val="{{ false }}"><p class="cl-field__err" id="cl-e-name"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg><span>{{fe.name.msg}}</span></p></sc-if>
              </div>
              <div class="cl-field">
                <label class="cl-field__label" for="cl-f-email"><span>{{F.email}}</span><span class="cl-field__req">{{F.required}}</span></label>
                <input class="cl-input" id="cl-f-email" name="email" type="email" autocomplete="email" inputmode="email" dir="ltr" value="{{form.email}}" onChange="{{onEmail}}" aria-invalid="{{fe.email.invalid}}" aria-describedby="{{fe.email.desc}}" aria-required="true">
                <sc-if value="{{fe.email.has}}" hint-placeholder-val="{{ false }}"><p class="cl-field__err" id="cl-e-email"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg><span>{{fe.email.msg}}</span></p></sc-if>
              </div>
              <div class="cl-field">
                <label class="cl-field__label" for="cl-f-phone"><span>{{F.phone}}</span><span class="cl-field__req">{{F.required}}</span></label>
                <input class="cl-input" id="cl-f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" dir="ltr" value="{{form.phone}}" onChange="{{onPhone}}" aria-invalid="{{fe.phone.invalid}}" aria-describedby="{{fe.phone.desc}}" aria-required="true">
                <sc-if value="{{fe.phone.has}}" hint-placeholder-val="{{ false }}"><p class="cl-field__err" id="cl-e-phone"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg><span>{{fe.phone.msg}}</span></p></sc-if>
              </div>
              <div class="cl-field">
                <label class="cl-field__label" for="cl-f-service"><span>{{F.service}}</span><span class="cl-field__req">{{F.required}}</span></label>
                <div class="cl-select {{flashCls}}">
                  <select class="cl-input" id="cl-f-service" name="service" value="{{form.service}}" onChange="{{onService}}" aria-invalid="{{fe.service.invalid}}" aria-describedby="{{fe.service.desc}}" aria-required="true">
                    <option value="" label="{{F.servicePlaceholder}}">{{F.servicePlaceholder}}</option>
                    <option value="ocean" label="{{svc.ocean}}">{{svc.ocean}}</option>
                    <option value="air" label="{{svc.air}}">{{svc.air}}</option>
                    <option value="land" label="{{svc.land}}">{{svc.land}}</option>
                    <option value="customs" label="{{svc.customs}}">{{svc.customs}}</option>
                    <option value="warehousing" label="{{svc.warehousing}}">{{svc.warehousing}}</option>
                    <option value="packaging" label="{{svc.packaging}}">{{svc.packaging}}</option>
                    <option value="buyship" label="{{svc.buyship}}">{{svc.buyship}}</option>
                  </select>
                  <svg class="cl-select__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
                </div>
                <sc-if value="{{fe.service.has}}" hint-placeholder-val="{{ false }}"><p class="cl-field__err" id="cl-e-service"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg><span>{{fe.service.msg}}</span></p></sc-if>
              </div>
              <div class="cl-field cl-field--full">
                <label class="cl-field__label" for="cl-f-message"><span>{{F.message}}</span><span class="cl-field__req">{{F.required}}</span></label>
                <textarea class="cl-input" id="cl-f-message" name="message" rows="5" value="{{form.message}}" onChange="{{onMessage}}" aria-invalid="{{fe.message.invalid}}" aria-describedby="{{fe.message.desc}}" aria-required="true"></textarea>
                <sc-if value="{{fe.message.has}}" hint-placeholder-val="{{ false }}"><p class="cl-field__err" id="cl-e-message"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg><span>{{fe.message.msg}}</span></p></sc-if>
              </div>
            </div>
            <div class="cl-form__foot">
              <button class="cl-btn" type="submit" disabled="{{sending}}">{{submitLabel}}<svg class="cl-i cl-flip cl-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"></path><path d="m21.854 2.147-10.94 10.939"></path></svg></button>
            </div>
          </form>
        </sc-if>
        <div class="cl-form__status" role="status" aria-live="polite">
          <sc-if value="{{success}}" hint-placeholder-val="{{ false }}">
            <div class="cl-success" id="cl-success" tabIndex="-1">
              <span class="cl-success__ico"><svg class="cl-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
              <p class="cl-success__msg">{{F.success}}</p>
            </div>
          </sc-if>
        </div>
        <sc-if value="{{success}}" hint-placeholder-val="{{ false }}">
          <button class="cl-btn cl-btn--light cl-success__again" type="button" onClick="{{sendAnother}}">{{x.sendAnother}}</button>
        </sc-if>
      </div>
    </div>
  </div>
</section>

</main>
