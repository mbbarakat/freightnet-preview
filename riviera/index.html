html:has(.rv-root){scroll-behavior:smooth}

/* ---------- 1. Tokens ---------- */
.rv-root{
  --bg:#FFFFFF; --bg-2:#F3F5F9; --bg-3:#E7EBF2;
  --navy:#373D74; --navy-deep:#262B57; --ink:#1F2448; --muted:#545A78;
  --sea:#DCEBF3; --sea-2:#CBE0EC; --crimson:#A2303C; --crimson-2:#86242F;
  --line:#D6DCE6; --line-2:#7C82A0; --on-navy:#C9CDE4;
  --f-serif:'Instrument Serif','Times New Roman',serif;
  --f-sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'Instrument Serif','Times New Roman',serif;
  --f-brand:'Montserrat','Arial Black',sans-serif;
  --ds:1; --w-disp:400; --lh-disp:1.02; --lh-hero:.96; --track-disp:-.015em;
  --lh-body:1.6; --gutter:clamp(16px, 4.45cqi, 64px); --gap:clamp(16px, 2.2cqi, 32px);
  --sec:clamp(72px, 9cqi, 136px); --hdr:76px;
  /* lane kept free for the floating WhatsApp button: 16px inset + 153px labelled button + 8px gap */
  --fab-room:177px;
  --ease:cubic-bezier(.22,.61,.24,1);
  container-type:inline-size; container-name:rv;
  position:relative; overflow-x:clip; min-width:0;
  background:var(--bg); color:var(--ink);
  font-family:var(--f-sans); font-size:17px; line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
.rv-root:lang(ar){
  --f-serif:'Amiri','Times New Roman',serif;
  --f-sans:'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --ds:.88; --w-disp:700; --lh-disp:1.42; --lh-hero:1.24; --track-disp:0;
  --lh-body:1.8;
}
:where(.rv-root) *,:where(.rv-root) *::before,:where(.rv-root) *::after{box-sizing:border-box}
:where(.rv-root) img{display:block; max-width:100%}
:where(.rv-root) svg{flex:none}
:where(.rv-root) a{color:inherit}
:where(.rv-root) :where(button,input,select,textarea){font:inherit; color:inherit}
:where(.rv-root) :where(button,a,input,select,textarea){touch-action:manipulation}
:where(.rv-root) :focus{outline:none}
:where(.rv-root) :focus-visible{outline:2px solid var(--navy); outline-offset:3px}
:where(.rv-root) :where(p,h1,h2,h3,h4,figure,ul,blockquote,address){margin:0}
:where(.rv-root) ul{padding:0; list-style:none}
.rv-vh{position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
.rv-pin{unicode-bidi:plaintext; white-space:nowrap}
.rv-wrapany{overflow-wrap:anywhere}

.rv-ic{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.rv-ic-sm{width:16px; height:16px}
[dir="rtl"] .rv-flip{transform:scaleX(-1)}
.rv-wrap{width:100%; max-width:calc(1312px + 2 * var(--gutter)); margin-inline:auto; padding-inline:var(--gutter)}

/* ---------- 2. Type scale ---------- */
.rv-eyebrow{font:600 12px/1.3 var(--f-sans); letter-spacing:.17em; text-transform:uppercase; color:var(--navy)}
.rv-root:lang(ar) .rv-eyebrow{font-size:14px; letter-spacing:0; text-transform:none; font-weight:600}
.rv-snum{font:italic 400 22px/1 var(--f-num); color:var(--navy); letter-spacing:0}
.rv-h2{font-family:var(--f-serif); font-weight:var(--w-disp); font-size:calc(clamp(38px, 5.2cqi, 78px) * var(--ds)); line-height:var(--lh-disp); letter-spacing:var(--track-disp); color:var(--navy); text-wrap:balance}
.rv-it{font-style:italic}
.rv-root:lang(ar) .rv-it{font-style:normal; font-weight:400}
.rv-lede{font-size:clamp(18px, 1.5cqi, 21px); line-height:1.55; color:var(--muted); max-width:36ch; text-wrap:pretty}
.rv-root:lang(ar) .rv-lede{line-height:1.8}
.rv-body{color:var(--ink); text-wrap:pretty}

/* section head */
.rv-shead{display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); column-gap:var(--gap); row-gap:22px; padding-block-start:22px; border-block-start:1px solid var(--line); margin-block-end:clamp(40px, 5.5cqi, 80px)}
.rv-shead-tag{grid-column:1 / -1; display:flex; align-items:baseline; gap:18px}
.rv-shead .rv-h2{grid-column:1 / span 8; min-width:0}
.rv-shead .rv-lede{grid-column:9 / span 4; align-self:end; min-width:0}
.rv-shead-solo .rv-h2{grid-column:1 / span 10}

/* buttons */
.rv-btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:48px; padding:0 22px; border:1px solid transparent; border-radius:0; font:500 15.5px/1.2 var(--f-sans); letter-spacing:.01em; text-decoration:none; cursor:pointer; white-space:nowrap; transition:background-color .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease), transform .12s ease}
.rv-root:lang(ar) .rv-btn{font-size:15.5px; letter-spacing:0; font-weight:500}
.rv-btn:active{transform:scale(.98)}
.rv-btn .rv-arrow{transition:transform .35s var(--ease)}
.rv-btn:hover .rv-arrow{transform:translateX(4px)}
[dir="rtl"] .rv-btn:hover .rv-arrow{transform:scaleX(-1) translateX(4px)}
.rv-btn-primary{background:var(--crimson); color:#fff}
.rv-btn-primary:hover{background:var(--crimson-2)}
.rv-btn-primary:focus-visible{outline-color:var(--navy)}
.rv-btn-line{background:transparent; color:var(--navy); border-color:var(--navy)}
.rv-btn-line:hover{background:var(--bg-2)}
.rv-btn-ghost{background:#fff; color:var(--navy); border-color:var(--line-2)}
.rv-btn-ghost:hover{background:var(--bg-2); border-color:var(--navy)}
.rv-btn-light{background:#fff; color:var(--navy-deep)}
.rv-btn-light:hover{background:var(--sea)}
.rv-btn-light:focus-visible{outline-color:#fff}
.rv-link{display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 10px; margin-inline-start:-10px; color:var(--navy); font-weight:600; font-size:15.5px; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:5px; text-decoration-color:var(--line-2); transition:background-color .25s var(--ease), text-decoration-color .25s}
.rv-link:hover{background:var(--bg-2); text-decoration-color:var(--navy)}
.rv-link .rv-arrow{transition:transform .35s var(--ease)}
.rv-link:hover .rv-arrow{transform:translateX(3px)}
[dir="rtl"] .rv-link:hover .rv-arrow{transform:scaleX(-1) translateX(3px)}

/* ---------- 3. Skip + header ---------- */
.rv-skip{position:absolute; inset-inline-start:16px; top:12px; z-index:200; background:var(--navy); color:#fff; padding:12px 18px; font-weight:600; text-decoration:none; transform:translateY(calc(-100% - 40px)); transition:transform .2s var(--ease)}
.rv-skip:focus,.rv-skip:focus-visible{transform:none; outline:2px solid #fff; outline-offset:0; box-shadow:0 0 0 4px var(--navy)}
.rv-header{position:sticky; top:0; z-index:50; background:var(--bg); border-block-end:1px solid var(--line)}
.rv-header-in{display:flex; align-items:center; gap:20px; height:var(--hdr)}
/* brand mark: the client's emblem at the inline-start, wordmark beside it (emblem ~2.8x the name size,
   gap ~0.2x the emblem, as in brand/logo-horizontal.svg); the emblem is never mirrored */
.rv-brand{--mark-h:48px; --mark-gap:11px; display:inline-flex; align-items:center; justify-content:flex-start; gap:var(--mark-gap); min-height:44px; padding:6px 8px; margin-inline-start:-8px; text-decoration:none; flex:none; transition:background-color .25s}
.rv-brand:hover{background:var(--bg-2)}
.rv-brand-mark{display:block; flex:none; width:auto; height:var(--mark-h); aspect-ratio:351 / 323; max-width:none}
.rv-brand-words{display:flex; flex-direction:column; align-items:center; gap:5px; min-width:0; padding-block-start:1px}
.rv-brand-name{font:800 17px/1 var(--f-brand); letter-spacing:.02em; color:var(--navy); white-space:nowrap}
.rv-brand-tag{font:700 9.5px/1 var(--f-brand); letter-spacing:.18em; color:var(--crimson); white-space:nowrap; padding-inline-start:.18em}
.rv-nav{display:flex; align-items:center; gap:2px; margin-inline:auto}
.rv-nav-link{display:inline-flex; align-items:center; min-height:44px; padding:0 15px; font-size:15.5px; font-weight:500; color:var(--ink); text-decoration:none; transition:background-color .25s var(--ease)}
.rv-nav-link:hover{background:var(--bg-2)}
.rv-tools{display:flex; align-items:center; gap:10px; flex:none}
.rv-langbtn{display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 14px; background:var(--bg); border:1px solid var(--line); color:var(--navy); cursor:pointer; transition:background-color .25s, border-color .25s}
.rv-langbtn:hover{background:var(--bg-2); border-color:var(--line-2)}
.rv-langbtn:active{transform:scale(.98)}
.rv-langbtn-txt{font-size:15.5px; font-weight:500; line-height:1}
.rv-langbtn-txt:lang(ar){font-family:'Noto Sans Arabic',sans-serif; font-size:16px}
.rv-langbtn-txt:lang(en){font-family:'Instrument Sans',sans-serif}
.rv-menubtn{display:none; align-items:center; justify-content:center; gap:10px; min-height:44px; min-width:44px; padding:0 12px; background:var(--bg); border:1px solid var(--line); color:var(--navy); cursor:pointer; font-weight:500; transition:background-color .25s}
.rv-menubtn:hover{background:var(--bg-2)}
.rv-menubtn:active{transform:scale(.98)}

/* ---------- 4. Hero ---------- */
.rv-main{display:block}
.rv-main:focus{outline:none}
.rv-hero{position:relative; background:var(--sea)}
/* The hero is a gallery. The stage holds four bands: the images (.rv-gal), the headline (.rv-copies), the
   pagination bar and the text panel (.rv-panels). Wider than 640 px the images fill the hero behind the headline
   and the panel, with the bar underneath. Phones stack them: headline, image, pagination, panel.
   A sideways drag anywhere on the stage moves the images with the finger (vertical page scroll and pinch zoom
   stay with the browser); headline and panel change with a short fade when the slide changes. */
.rv-stage{position:relative; isolation:isolate; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto auto; touch-action:pan-y pinch-zoom}
.rv-stage :where(a, img){-webkit-user-drag:none}
.rv-stage.is-dragging{cursor:grabbing; -webkit-user-select:none; user-select:none}
/* Wider than 640 px both slides share one composition. Slide 1's picture (the client's scene, 1672 x 941) covers
   the hero; the eyebrow and the headline sit at the top of the inline start, over the open sky, and the white panel
   stands at the foot of the first screen. Slide 2 keeps the same type, panel and pagination and only swaps the
   picture side for the arch. The scene's subjects, as fractions of the picture: the plane from 16.5% down (its nose)
   and from 64.3% across; the ship from 30.2% across (its bow), its masts from 42% down, its containers from 48.9%
   (left of the front mast, 37.4% across, there is only sky above them), its keel 76% down; the truck from 67.6%
   across, its wheels 86.1% down; the sea line 71.8% down, the low sun 19% across. cqi is the page width everywhere
   in the hero.
   --gal-h  the picture's height: the window height left under the header and the bar (so the pagination is on the
            first screen too), within 600-860 px (41cqi above ~2100 px), never less than the plane and the truck need
            with 10 + 8 px to spare (39.1cqi: 69.6% of the picture at the page width)
   --fsb    where the first screen ends, from the hero's top: the panel stands on it
   --ih, --iw, --ix  the picture's size when it covers the hero, and its offset at the inline start (only a picture
            wider than the page is cropped there, so the plane's tail stays 16 px inside)
   --panel-h  the panel: its top padding, the intro (--lines at --plh), the buttons on the bar's middle line
   --keel-y the top of what stands under the ship (the panel); the keel keeps 12 px above it
   --py     how far the picture rises (its top's offset, 0 or less). --py-lo and --py-hi bound it: the picture covers
            the hero, the plane's nose stays 10 px under the header (closer only when that keeps the truck's wheels in
            view), the truck's wheels 8 px over the picture's foot, the keel over the panel. Within them it sits as
            low as it may, so the headline has room above the ship, but no lower than the full-size headline needs
            (--py-head; the keel then keeps 24 px). Where they cannot all hold (windows over 2.6 : 1 under the
            header), the keel comes first: the picture rises until up to 40 px of the plane's nose hide under the
            header, and the window's foot crops the truck's wheels
   --hf     the headline size: its caps, then the room above the ship (over the masts, or down to the containers when
            the last line ends before the front mast), and the last line ends 16 px before the plane. Per language, in
            headline sizes: --hk the height under the eyebrow (two lines and the last one's descent), --hw the widest
            line; --heb is the eyebrow's box and 8 px.
   Short windows (section 15) give the bar's place to the picture and set the count and the dots by the panel. */
.rv-stage{
  --bar-h:72px; --panel-w:600px; --lines:2; --plh:1.55; --btn-h:48px;
  --wrap0:max(var(--gutter), (100cqi - 1312px) / 2);
  --gal-h:max(39.1cqi + 18px, min(clamp(600px, 58cqi, max(860px, 41cqi)), 100svh - var(--hdr) - var(--bar-h)));
  --fsb:min(var(--gal-h) + var(--bar-h), 100svh - var(--hdr));
  --ih:max(56.28cqi, var(--gal-h)); --iw:calc(1.7768 * var(--ih));
  --ix:clamp(100cqi - var(--iw), 100cqi - 16px - .951 * var(--iw), 0px);
  --pad:clamp(20px, min(2.4cqi, 3.4svh), 34px); --fb:clamp(17px, 1.35cqi, 19px);
  --panel-h:calc(var(--pad) + var(--lines) * var(--plh) * var(--fb) + 28px + var(--btn-h));
  --keel-y:calc(var(--fsb) - var(--panel-h));
  --tp:clamp(28px, min(5.4cqi, 9svh - 28px), 88px); --tm:clamp(14px, min(2cqi, 2.4svh), 28px);
  --hcap:min(6.9cqi, 10.8svh, 100px); --hlo:48px; --hhi:100px; --hk:2.09; --heb:24px; --hw:6.46;
  --py-cover:calc(var(--gal-h) - var(--ih));
  --py-plane:calc(10px - .165 * var(--ih));
  --py-truck:calc(var(--gal-h) - 8px - .861 * var(--ih));
  --py-keel:calc(var(--keel-y) - 12px - .76 * var(--ih));
  --py-head:calc(var(--hcap) * var(--hk) + var(--tp) + var(--tm) + var(--heb) - .42 * var(--ih));
  --py-hi:min(0px, var(--py-truck), var(--py-keel));
  --py-lo:max(var(--py-cover), min(var(--py-plane), max(var(--py-plane) - 10px, var(--py-hi))));
  --py:max(var(--py-cover), var(--py-plane) - 50px, min(var(--py-keel), max(var(--py-lo), min(var(--py-hi), max(var(--py-keel) - 12px, var(--py-head))))));
  --hf-masts:calc((var(--py) + .42 * var(--ih) - var(--tp) - var(--tm) - var(--heb)) / var(--hk));
  --hf-boxes:calc((var(--py) + .489 * var(--ih) - var(--tp) - var(--tm) - var(--heb)) / var(--hk));
  --hf-mast:calc((var(--ix) + .374 * var(--iw) - 12px - var(--wrap0)) / var(--hw));
  --hf-plane:calc((var(--ix) + .643 * var(--iw) - 16px - var(--wrap0)) / var(--hw));
  --hf:clamp(var(--hlo), min(var(--hcap), max(var(--hf-masts), min(var(--hf-boxes), var(--hf-mast))), var(--hf-plane)), var(--hhi));
}
.rv-root:lang(ar) .rv-stage{--plh:1.7; --hcap:min(5.6cqi, 9.2svh, 86px); --hlo:42px; --hhi:86px; --hk:2.73; --heb:26px; --hw:7.4}
.rv-gal{grid-row:1 / 4; grid-column:1; position:relative; z-index:0; overflow:hidden; min-height:var(--gal-h)}
.rv-copies{grid-row:1; grid-column:1; z-index:1; display:grid}
.rv-panels{grid-row:3; grid-column:1; z-index:1; display:grid}
.rv-hero-bar{grid-row:4; grid-column:1}
/* image frames share one place: the current one shows; while a drag or a slide runs, the neighbour waits one
   width to the right (.is-r) or left (.is-l) and the leaving one goes out the other way. --rv-dx is the
   finger's offset, set by the script during a drag only. */
.rv-gal-item{position:absolute; inset:0; overflow:hidden; visibility:hidden}
.rv-gal-item.is-cur,.rv-gal-item.is-nb,.rv-gal-item.is-out{visibility:visible}
.rv-gal-item.is-cur{transform:translateX(var(--rv-dx, 0px))}
.rv-gal.is-r .rv-gal-item.is-nb{transform:translateX(calc(100% + var(--rv-dx, 0px)))}
.rv-gal.is-l .rv-gal-item.is-nb{transform:translateX(calc(-100% + var(--rv-dx, 0px)))}
.rv-gal.is-r .rv-gal-item.is-out{transform:translateX(-100%)}
.rv-gal.is-l .rv-gal-item.is-out{transform:translateX(100%)}
.rv-gal.is-moving .rv-gal-item{transition:transform .3s cubic-bezier(.22,.61,.36,1)}
/* headline and panel of both slides share one grid cell (the band keeps the taller one's height, so nothing
   below moves); the current one fades in */
.rv-slide-copy,.rv-slide-foot{grid-area:1 / 1; opacity:0; visibility:hidden; transition:opacity .2s ease, visibility 0s linear .2s}
.rv-slide-copy.is-active,.rv-slide-foot.is-active{opacity:1; visibility:visible; transition:opacity .3s ease .08s, visibility 0s linear 0s}
.rv-slide-media{position:absolute; inset:0; overflow:hidden}
.rv-kb{position:absolute; inset:0; transform:scale(1.06); transition:transform 8s cubic-bezier(.2,.6,.2,1)}
.rv-gal-item.is-cur .rv-kb{transform:scale(1)}
[dir="rtl"] .rv-mirror{transform:scaleX(-1)}
.rv-slide-copy{position:relative; padding-block-start:var(--tp); padding-inline-end:calc(min(38%, 520px) + var(--gutter) + 40px)}
.rv-slide-eyebrow{display:flex; align-items:center; gap:14px}
.rv-slide-eyebrow::before{content:''; width:44px; height:1px; background:currentColor; flex:none}
.rv-hero-title{margin-block-start:var(--tm); font-family:var(--f-serif); font-weight:var(--w-disp); font-size:var(--hf); line-height:var(--lh-hero); letter-spacing:var(--track-disp); color:var(--navy); text-wrap:balance}
.rv-ht-line{display:block}
.rv-ht-accent{font-style:italic; padding-inline-start:.55em}
.rv-copy-b .rv-ht-accent{padding-inline-start:0}
/* slide 2's lead always breaks after "logistics" (three lines, like the Arabic), whatever the headline size */
.rv-copy-b .rv-hero-title{max-inline-size:6.6em}
.rv-root:lang(ar) .rv-ht-accent{font-style:normal; font-weight:400; padding-inline-start:0}
/* Arabic: lead and accent flow together and balance over two or three lines (11em keeps slide 1's on two) */
.rv-root:lang(ar) .rv-hero-title{max-inline-size:11em}
.rv-root:lang(ar) .rv-ht-line{display:inline}
/* slide 1's picture is a size container, so the clamp()s keep it covering the hero's real box */
.rv-media-photo{container-type:size; background:var(--sea)}
.rv-media-photo img{width:100%; height:100%; object-fit:cover; object-position:clamp(100cqw - 1.7768 * max(56.28cqw, 100cqh), 100cqw - 16px - 1.69 * max(56.28cqw, 100cqh), 0px) clamp(100cqh - max(56.28cqw, 100cqh), var(--py), 0px)}
.rv-media-photo .rv-kb{transform-origin:30% 76%}
[dir="rtl"] .rv-media-photo .rv-kb{transform-origin:70% 76%}
/* sea haze behind the eyebrow and the headline: slide 2's sea tint over the sky, so the navy serif keeps the same
   pale ground across a swipe. It thins out over the ship's masts and is gone before the plane. It belongs to the
   gallery, not to the moving frame, so it stays under the headline while a finger drags either picture; it fades
   out while slide 2 rests. */
.rv-stage{--to-end:to right; --start:left}
[dir="rtl"] .rv-stage{--to-end:to left; --start:right}
.rv-gal::after{content:''; position:absolute; inset:0; z-index:1; pointer-events:none; transition:opacity .3s ease; --hz-in:min(var(--wrap0) + 6.5 * var(--hf) + 40px, var(--ix) + .643 * var(--iw) - 200px); --hz-out:min(var(--wrap0) + 6.5 * var(--hf) + 320px, var(--ix) + .643 * var(--iw) - 10px); background:linear-gradient(to bottom, color-mix(in srgb, var(--sea) 82%, transparent) 0, color-mix(in srgb, var(--sea) 70%, transparent) calc(var(--py) + .3 * var(--ih)), transparent calc(var(--py) + .489 * var(--ih) + 20px)); -webkit-mask-image:linear-gradient(var(--to-end), #000 var(--hz-in), transparent var(--hz-out)); mask-image:linear-gradient(var(--to-end), #000 var(--hz-in), transparent var(--hz-out))}
.rv-stage:not(.is-dragging) .rv-gal:not(.is-moving):not(:has(> .rv-gal-a.is-cur))::after{opacity:0}
/* the panel stands on the first screen's foot: its buttons share the bar's middle line with the count and the
   dots, which follow it. The panel row lets clicks through to the bar; the panel takes them. Both slides' panels
   fill the shared cell, so a longer intro on one slide never moves the panel's top on a swipe. */
.rv-panels{margin-block-end:calc(var(--gal-h) - var(--fsb)); pointer-events:none}
.rv-slide-foot{position:relative; display:flex; padding-block-start:28px}
.rv-panel{display:flex; flex-direction:column; width:min(100%, var(--panel-w)); min-height:var(--panel-h); padding:var(--pad) var(--pad) 12px; background:#fff; position:relative; pointer-events:auto}
.rv-panel-body{font-size:var(--fb); line-height:var(--plh); color:var(--ink); text-wrap:pretty}
.rv-actions{display:flex; flex-wrap:wrap; gap:12px; margin-block-start:auto; padding-block-start:16px}
/* slide 2: the arch on slide 1's horizon, in slide 1's colours drawn flat. The upper sky is the sea tint (the
   headline's ground on both slides); towards the photo's sea line it warms to a sunset peach, a hairline marks the
   horizon, and the sea below is a deeper blue; the low sun's glow sits where the photo's does */
.rv-media-tint{background:var(--sea)}
.rv-gal-b .rv-media-tint{--hz:calc(var(--py) + .718 * var(--ih)); background:radial-gradient(calc(.3 * var(--iw)) calc(.13 * var(--ih)) at var(--start) calc(var(--ix) + .19 * var(--iw)) top var(--hz), rgb(255 226 196 / .85), rgb(255 226 196 / 0)), linear-gradient(to bottom, var(--sea) 0, var(--sea) calc(var(--hz) - .36 * var(--ih)), #F1E5DD calc(var(--hz) - .14 * var(--ih)), #F8DFC8 calc(var(--hz) - 1px), rgb(55 61 116 / .3) calc(var(--hz) - 1px), rgb(55 61 116 / .3) var(--hz), #B9D3E4 var(--hz), #CDE1ED 100%)}
.rv-arch-wrap{height:100%; display:flex; justify-content:flex-end; align-items:flex-end}
.rv-hero-archbox{position:relative; width:min(38%, 520px); height:88%}
.rv-hero-archbox::before{content:''; position:absolute; inset:-20px -20px 0 -20px; border:1px solid rgba(55,61,116,.32); border-bottom:0; border-radius:999px 999px 0 0}
.rv-hero-arch{position:absolute; inset:0; border-radius:999px 999px 0 0; overflow:hidden; background:var(--bg-3)}
.rv-hero-arch img{width:100%; height:100%; object-fit:cover}
.rv-hero-arch::after{content:''; position:absolute; inset:0; background:linear-gradient(to top, rgb(255 168 104 / .32), rgb(255 168 104 / 0) 60%); mix-blend-mode:soft-light; pointer-events:none}
/* hero bar */
.rv-hero-bar{background:var(--bg); border-block-end:1px solid var(--line)}
.rv-hero-bar-in{display:flex; align-items:center; gap:clamp(14px, 2cqi, 28px); min-height:var(--bar-h)}
/* desktop: count and dots follow the panel, clear of the floating WhatsApp button at the inline end; the caption
   stops before the button's lane (the inner max() subtracts the wrap's side margin on wide screens, where the
   lane is already free) */
.rv-hero-bar-in{padding-inline:calc(var(--gutter) + var(--panel-w) + clamp(24px, 3cqi, 40px)) max(var(--gutter), calc(var(--fab-room) - max(0px, (100cqi - 1312px) / 2 - var(--gutter))))}
.rv-count{display:flex; flex:none; align-items:baseline; gap:6px; font:italic 400 24px/1 var(--f-num); color:var(--navy); direction:ltr; min-width:64px}
.rv-count-sep{color:var(--line-2); font-style:normal}
.rv-count-tot{color:var(--muted)}
/* dots: one 44 px button per slide; the current one is the red bar (the hero's accent marks the current slide),
   the others small grey dots */
.rv-dots{display:flex; flex:none}
.rv-dot{display:inline-grid; place-items:center; width:44px; height:44px; padding:0; background:transparent; border:0; cursor:pointer; transition:background-color .25s}
.rv-dot:active{transform:scale(.96)}
.rv-dot-mark{display:block; width:8px; height:8px; border-radius:999px; background:var(--line-2); transition:background-color .25s}
.rv-dot.is-active .rv-dot-mark{width:26px; background:var(--crimson)}
/* hover only where there is one (no grey square left behind on a phone after a tap) */
@media (hover: hover){
  .rv-dot:hover{background:var(--bg-2)}
  .rv-dot:not(.is-active):hover .rv-dot-mark{background:var(--navy)}
}
.rv-hero-cap{flex:1; min-width:0; display:flex; gap:10px; align-items:baseline; font-size:13.5px; line-height:1.4; color:var(--muted); white-space:nowrap}
.rv-hero-cap > :last-child{overflow:hidden; text-overflow:ellipsis}
.rv-fig{font:italic 400 15px/1 var(--f-num); color:var(--navy); flex:none}

/* ---------- 5. Facts ---------- */
.rv-facts{border-block-end:1px solid var(--line)}
.rv-facts-grid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr))}
/* value and label rows are shared (subgrid), so a value that wraps (Arabic "من الباب إلى الباب" at tablet
   width) keeps the three labels on one line; values sit on a common baseline above them */
.rv-fact{display:grid; grid-template-rows:subgrid; grid-row:span 2; align-content:start; min-width:0; padding-block:clamp(36px, 4cqi, 56px); padding-inline:clamp(20px, 3cqi, 44px); border-inline-start:1px solid var(--line)}
.rv-fact:first-child{border-inline-start:0; padding-inline-start:0}
.rv-fact-val{align-self:end; font-family:var(--f-serif); font-weight:var(--w-disp); font-size:calc(clamp(44px, 5cqi, 72px) * var(--ds)); line-height:1.05; color:var(--navy); letter-spacing:var(--track-disp); text-wrap:balance}
.rv-root:lang(ar) .rv-fact-val{font-size:clamp(34px, 3.7cqi, 54px); line-height:1.35}
.rv-fact-lbl{margin-block-start:14px; font-size:15.5px; line-height:1.5; color:var(--muted); max-width:30ch}

/* ---------- 6. Services ---------- */
.rv-sec{padding-block:var(--sec)}
.rv-services{scroll-margin-top:calc(var(--hdr) + 8px)}
.rv-zig{display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); column-gap:var(--gap); align-items:center; padding-block:clamp(36px, 4.6cqi, 72px)}
.rv-zig + .rv-zig{border-block-start:1px solid var(--line)}
.rv-zig-media{grid-column:1 / span 7; grid-row:1; min-width:0}
.rv-zig-text{grid-column:9 / span 4; grid-row:1; min-width:0}
.rv-zig.is-flip .rv-zig-media{grid-column:6 / span 7}
.rv-zig.is-flip .rv-zig-text{grid-column:1 / span 4}
.rv-frame{position:relative; aspect-ratio:4 / 3; overflow:hidden; background:var(--bg-2)}
/* the hover zoom is on `scale` (with the slow transition); a photo without text may face the other way in Arabic
   (.rv-mirror, on `transform`, no transition), so a language switch flips it at once instead of squashing it */
.rv-frame img{width:100%; height:100%; object-fit:cover; scale:var(--z, 1); transform-origin:var(--zo, 50% 50%); transition:scale 1.4s var(--ease)}
@media (hover: hover) and (pointer: fine){
  .rv-zig-media:hover .rv-frame img{scale:calc(var(--z, 1) * 1.04)}
}
.rv-cap{display:flex; gap:10px; align-items:baseline; margin-block-start:14px; font-size:13.5px; line-height:1.45; color:var(--muted)}
.rv-idx{display:flex; align-items:center; gap:14px; font:italic 400 20px/1 var(--f-num); color:var(--navy)}
.rv-idx-rule{flex:1; max-width:120px; height:1px; background:var(--line)}
.rv-idx-tot{color:var(--muted)}
.rv-zig-title{margin-block-start:22px; font-family:var(--f-serif); font-weight:var(--w-disp); font-size:calc(clamp(40px, 4.4cqi, 64px) * var(--ds)); line-height:var(--lh-disp); letter-spacing:var(--track-disp); color:var(--navy)}
.rv-zig-short{margin-block-start:16px; font-size:clamp(18px, 1.45cqi, 20px); line-height:1.5; color:var(--ink); text-wrap:pretty}
.rv-zig-dt{margin-block-start:26px; padding-block-start:22px; border-block-start:1px solid var(--line); font-family:var(--f-serif); font-style:italic; font-weight:400; font-size:calc(24px * var(--ds)); line-height:1.25; color:var(--navy)}
.rv-root:lang(ar) .rv-zig-dt{font-style:normal; font-weight:700; line-height:1.6}
.rv-zig-detail{margin-block-start:10px; color:var(--muted); text-wrap:pretty}
.rv-zig-text .rv-btn{margin-block-start:28px}

/* arcade of service cards: 4 arches in a row (2 x 2 below 1000), rows shared through subgrid so
   titles, texts and toggles line up; the hover/open surface is a grid item that bleeds 12px past the
   content, so the content itself sits on the section grid */
.rv-arcade{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); column-gap:clamp(24px, 2.2cqi, 32px); row-gap:clamp(44px, 5cqi, 64px); margin-block-start:clamp(24px, 3cqi, 48px); padding-block-start:clamp(40px, 4.6cqi, 72px); border-block-start:1px solid var(--line)}
.rv-card{position:relative; isolation:isolate; min-width:0; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:subgrid; grid-row:span 4; row-gap:0}
.rv-card::before{content:''; grid-row:1 / 4; grid-column:1; margin:-12px -12px -4px; z-index:-1; background:transparent; transition:background-color .35s var(--ease)}
.rv-card.is-open::before{grid-row:1 / 5; background:var(--bg-2)}
@media (hover: hover) and (pointer: fine){
  .rv-card:hover::before{background:var(--bg-2)}
  .rv-card.is-open:hover::before{background:var(--bg-3)}
  .rv-card:hover .rv-card-arch img{transform:scale(1.05)}
  .rv-card:hover .rv-card-glyph{transform:scale(1.04)}
}
.rv-card-arch{grid-row:1; grid-column:1; position:relative; aspect-ratio:4 / 5; border-radius:999px 999px 0 0; overflow:hidden; background:var(--sea); isolation:isolate}
.rv-card-arch img{width:100%; height:100%; object-fit:cover; transition:transform 1.4s var(--ease)}
.rv-card-arch.is-plate{background:var(--navy)}
.rv-card-glyph{position:absolute; inset:0; display:grid; place-items:center; padding-block-start:14%; font:italic 400 clamp(120px, 14cqi, 200px)/1 'Instrument Serif',serif; color:#fff; transition:transform 1.4s var(--ease)}
.rv-root:lang(ar) .rv-card-glyph{font-family:'Amiri',serif; font-style:normal; font-weight:400; font-size:clamp(104px, 12cqi, 176px); padding-block-start:0; padding-block-end:4%}
.rv-card-glyph-ring{position:absolute; inset:11% 11% 0; border:1px solid rgba(255,255,255,.34); border-bottom:0; border-radius:999px 999px 0 0}
.rv-card-glyph-ring::after{content:''; position:absolute; inset:7% 7% 0; border:1px solid rgba(255,255,255,.16); border-bottom:0; border-radius:999px 999px 0 0}
.rv-card-body{grid-row:2; grid-column:1; padding-block:20px 0}
.rv-card-num{font:italic 400 17px/1 var(--f-num); color:var(--muted)}
.rv-card-title{margin-block-start:10px; font-family:var(--f-serif); font-weight:var(--w-disp); font-size:calc(clamp(28px, 2.3cqi, 34px) * var(--ds)); line-height:1.1; color:var(--navy); text-wrap:balance}
.rv-root:lang(ar) .rv-card-title{line-height:1.45}
.rv-card-short{margin-block-start:10px; font-size:15.5px; line-height:1.55; color:var(--muted); text-wrap:pretty}
.rv-card-toggle{grid-row:3; grid-column:1; align-self:stretch; display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; min-height:52px; margin-block-start:16px; padding:12px 0; background:transparent; border:0; border-block-start:1px solid var(--line); color:var(--navy); font-size:15px; font-weight:600; line-height:1.35; text-align:start; cursor:pointer}
.rv-card-toggle::after{content:''; position:absolute; inset:0; z-index:1}
.rv-card-toggle:focus-visible{outline:none}
.rv-card-toggle:focus-visible::after{outline:2px solid var(--navy); outline-offset:2px}
.rv-card:active{transform:scale(.995)}
.rv-pm{position:relative; display:inline-grid; place-items:center; width:32px; height:32px; border:1px solid var(--line-2); border-radius:50%; flex:none; transition:background-color .25s, border-color .25s}
.rv-card:hover .rv-pm{border-color:var(--navy)}
.rv-pm-v{transition:transform .35s var(--ease); transform-origin:center; transform-box:fill-box}
[aria-expanded="true"] .rv-pm{background:var(--navy); border-color:var(--navy); color:#fff}
[aria-expanded="true"] .rv-pm-v{transform:scaleY(0)}
.rv-card-detail{grid-row:4; grid-column:1; position:relative; z-index:2; padding-block:4px 16px; animation:rv-rise .45s var(--ease) both}
.rv-card-detail[hidden]{display:none}
.rv-card-detail p{font-size:15.5px; line-height:1.6; color:var(--ink)}
.rv-card-detail .rv-link{margin-block-start:10px}
.rv-card .rv-link:hover{background:var(--bg-3); text-decoration-color:var(--navy)}

/* ---------- 7. Ocean options ---------- */
.rv-ocean{background:var(--sea); padding-block:var(--sec)}
.rv-ocean .rv-shead{border-block-start-color:rgba(55,61,116,.22)}
.rv-compare{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); column-gap:clamp(20px, 3.4cqi, 56px)}
.rv-opt{min-width:0; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:subgrid; grid-row:span 3; row-gap:0; align-content:start}
.rv-plate{background:#fff; aspect-ratio:16 / 8; display:grid; place-items:center; padding:clamp(18px, 3cqi, 44px)}
.rv-diagram{width:100%; height:auto; max-width:440px; overflow:visible}
.rv-opt-head{display:flex; flex-direction:column; align-items:flex-start; gap:14px; margin-block-start:28px}
.rv-opt-tag{display:inline-flex; align-items:center; height:28px; padding:0 10px; border:1px solid var(--navy); font:600 12px/1 'Instrument Sans',sans-serif; letter-spacing:.16em; color:var(--navy)}
.rv-opt-name{font-family:var(--f-serif); font-weight:var(--w-disp); font-size:calc(clamp(32px, 3.4cqi, 48px) * var(--ds)); line-height:var(--lh-disp); color:var(--navy); letter-spacing:var(--track-disp)}
.rv-opt-body{margin-block-start:16px; color:var(--ink); max-width:46ch; text-wrap:pretty}
.rv-or{position:relative; grid-row:span 3; align-self:stretch; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-block-start:clamp(70px, 9cqi, 130px)}
.rv-or::before{content:''; position:absolute; inset-block:0; width:1px; background:rgba(55,61,116,.25)}
.rv-or-dot{position:relative; display:grid; place-items:center; width:64px; height:64px; border-radius:50%; background:var(--sea); border:1px solid var(--navy); font:italic 400 26px/1 var(--f-serif); color:var(--navy)}
.rv-root:lang(ar) .rv-or-dot{font-style:normal; font-size:24px; padding-block-end:6px}
.rv-dedicated{display:grid; grid-template-columns:auto minmax(0, 1fr) minmax(0, 1.5fr); align-items:center; column-gap:clamp(20px, 3cqi, 48px); row-gap:12px; margin-block-start:clamp(48px, 5cqi, 80px); padding:clamp(24px, 3cqi, 40px); background:#fff}
.rv-ded-ic{display:grid; place-items:center; width:64px; height:64px; border-radius:999px 999px 0 0; background:var(--sea); color:var(--navy)}
.rv-ded-ic .rv-ic{width:26px; height:26px}
.rv-ded-title{font-family:var(--f-serif); font-weight:var(--w-disp); font-size:calc(clamp(28px, 2.6cqi, 38px) * var(--ds)); line-height:1.15; color:var(--navy)}
.rv-root:lang(ar) .rv-ded-title{line-height:1.5}
.rv-ded-body{color:var(--ink); text-wrap:pretty}

/* ---------- 8. Values ---------- */
.rv-values-grid{display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); column-gap:var(--gap)}
.rv-values-head{grid-column:1 / span 5; align-self:start; position:sticky; top:calc(var(--hdr) + 32px); padding-block-start:22px; border-block-start:1px solid var(--line)}
.rv-values-head .rv-h2{margin-block-start:22px}
.rv-vlist{grid-column:7 / span 6; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); border-block-start:1px solid var(--line)}
.rv-value{min-width:0; padding-block:clamp(28px, 3.2cqi, 48px) clamp(32px, 3.6cqi, 56px); border-block-end:1px solid var(--line)}
.rv-value:nth-child(odd){padding-inline-end:clamp(20px, 3cqi, 44px); border-inline-end:1px solid var(--line)}
.rv-value:nth-child(even){padding-inline-start:clamp(20px, 3cqi, 44px)}
.rv-vnum{display:block; font:italic 400 clamp(64px, 7cqi, 104px)/.9 var(--f-num); color:var(--navy); letter-spacing:-.02em}
.rv-vtitle{margin-block-start:22px; font-family:var(--f-serif); font-weight:var(--w-disp); font-size:calc(clamp(28px, 2.6cqi, 38px) * var(--ds)); line-height:1.1; color:var(--navy)}
.rv-root:lang(ar) .rv-vtitle{line-height:1.5}
.rv-vbody{margin-block-start:12px; color:var(--muted); text-wrap:pretty}

/* ---------- 9. About ---------- */
.rv-about{background:var(--bg-2); padding-block:var(--sec); scroll-margin-top:var(--hdr)}
.rv-about .rv-shead{border-block-start-color:var(--line)}
.rv-about-grid{display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); column-gap:var(--gap)}
.rv-about-grid .rv-shead{grid-column:1 / span 4; display:block; margin:0}
.rv-about-grid .rv-shead .rv-h2{margin-block-start:22px}
.rv-about-text{grid-column:6 / span 7; padding-block-start:22px; border-block-start:1px solid var(--line); font-size:clamp(19px, 1.6cqi, 23px); line-height:1.6; color:var(--ink); text-wrap:pretty}
.rv-root:lang(ar) .rv-about-text{line-height:1.9}
.rv-about-text::first-letter{float:inline-start; font-family:'Instrument Serif',serif; font-size:4.6em; line-height:.82; padding-block-start:.06em; margin-inline-end:.1em; color:var(--navy)}
.rv-root:lang(ar) .rv-about-text::first-letter{float:none; font:inherit; font-size:1em; line-height:inherit; padding:0; margin:0; color:inherit}
.rv-root .rv-quote{margin:clamp(56px, 7cqi, 112px) 0 0; display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); column-gap:var(--gap); padding-block:clamp(40px, 5cqi, 72px); border-block:1px solid var(--line-2)}
.rv-quote-label{grid-column:1 / span 3; display:flex; flex-direction:column; gap:20px}
.rv-quote-mark{width:56px; height:56px; color:var(--navy)}
.rv-quote-text{grid-column:4 / span 9; font-family:var(--f-serif); font-style:italic; font-weight:400; font-size:calc(clamp(26px, 3cqi, 44px) * var(--ds)); line-height:1.24; color:var(--navy); letter-spacing:-.005em; text-wrap:pretty}
.rv-root:lang(ar) .rv-quote-text{font-style:normal; font-weight:400; line-height:1.75; letter-spacing:0}

/* ---------- 10. CTA band ---------- */
.rv-cta{position:relative; overflow:hidden; background:var(--navy-deep); color:#fff; padding-block:clamp(80px, 9cqi, 140px)}
.rv-cta-in{position:relative; z-index:1}
.rv-cta-title{font-family:var(--f-serif); font-weight:var(--w-disp); font-size:calc(clamp(40px, 6cqi, 92px) * var(--ds)); line-height:var(--lh-disp); letter-spacing:var(--track-disp); color:#fff; max-width:20ch; text-wrap:balance}
.rv-root:lang(ar) .rv-cta-title{max-width:18ch}
.rv-cta-title .rv-it{display:block}
.rv-cta-row{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:flex-start; gap:28px clamp(32px, 4cqi, 64px); margin-block-start:clamp(28px, 3cqi, 44px)}
.rv-cta-body{font-size:clamp(18px, 1.45cqi, 20px); line-height:1.6; color:var(--on-navy); max-width:44ch}
.rv-root:lang(ar) .rv-cta-body{line-height:1.85}
.rv-cta-art{position:absolute; inset-block:0; inset-inline-end:0; width:min(46%, 640px); z-index:0; pointer-events:none; color:rgba(255,255,255,.13)}
.rv-cta-art svg{position:absolute; inset-inline-end:clamp(-120px, -4cqi, -20px); bottom:-2px; height:112%; width:auto}
[dir="rtl"] .rv-cta-art svg{transform:scaleX(-1)}

/* ---------- 11. Contact ---------- */
.rv-contact{padding-block:var(--sec); scroll-margin-top:var(--hdr)}
.rv-contact-grid{display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); column-gap:var(--gap); align-items:start}
/* the arch keeps 4:5 at least and grows with the details column, so no empty column is left under it */
.rv-root .rv-c-photo{grid-column:1 / span 5; grid-row:1; margin:0; align-self:stretch; display:flex; flex-direction:column}
.rv-c-arch{flex:1 0 auto; position:relative; aspect-ratio:4 / 5; border-radius:999px 999px 0 0; overflow:hidden; background:var(--sea)}
.rv-c-arch img{width:100%; height:100%; object-fit:cover; object-position:34% 50%}
.rv-c-main{grid-column:7 / span 6; min-width:0}
.rv-c-main .rv-shead{grid-template-columns:minmax(0,1fr); margin-block-end:40px}
.rv-c-main .rv-shead .rv-h2,.rv-c-main .rv-shead .rv-lede{grid-column:1 / -1}
.rv-c-main .rv-lede{max-width:44ch}
.rv-details{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:0 var(--gap); border-block-start:1px solid var(--line)}

/* ---------- 12. Footer ---------- */
.rv-footer{background:var(--bg-2); padding-block:clamp(56px, 6cqi, 88px) 96px; border-block-start:1px solid var(--line)}

/* ---------- 13. WhatsApp dock + chooser ---------- */
.rv-dock{position:sticky; bottom:0; height:0; z-index:60}

.rv-fab:hover{background:var(--navy-deep)}
.rv-fab:active{transform:scale(.97)}
.rv-fab:focus-visible{outline:2px solid #fff; outline-offset:2px; box-shadow:0 0 0 6px var(--navy), 0 10px 30px rgba(16,20,44,.22)}

.rv-wa{position:absolute; z-index:2; bottom:calc(84px + env(safe-area-inset-bottom, 0px)); inset-inline-end:16px; width:min(380px, calc(100cqi - 32px)); background:var(--bg); border:1px solid var(--line); box-shadow:0 24px 60px rgba(16,20,44,.25); animation:rv-rise .22s var(--ease) both}

.rv-wa-sub{margin-block-start:8px; font-size:15px; line-height:1.5; color:var(--muted)}
.rv-x{display:inline-grid; place-items:center; width:44px; height:44px; padding:0; flex:none; background:var(--bg); border:1px solid var(--line); color:var(--navy); cursor:pointer; transition:background-color .25s}

.rv-x:active{transform:scale(.96)}

.rv-wa-row:hover{background:var(--bg-2)}
.rv-wa-li + .rv-wa-li{border-block-start:1px solid var(--line)}
/* phone sheet only: a quiet sign-off at the foot, so the full-screen sheet ends on purpose */
.rv-wa-foot{display:none}

.rv-wa-row:hover .rv-arrow{transform:translateX(3px)}
[dir="rtl"] .rv-wa-row:hover .rv-arrow{transform:scaleX(-1) translateX(3px)}

/* ---------- 14. Menu sheet ---------- */
.rv-sheet{position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; background:var(--bg); overflow-y:auto; overscroll-behavior:contain; padding-block-end:env(safe-area-inset-bottom, 0px); animation:rv-rise .22s var(--ease) both}

.rv-sheet-foot .rv-btn{width:100%}
.rv-sheet-phones{display:flex; flex-wrap:wrap; gap:6px 20px; font-size:15px; color:var(--muted)}
.rv-sheet-phones a{display:inline-flex; align-items:center; min-height:44px; color:var(--navy); text-decoration:none; padding:0 6px; margin-inline-start:-6px}
.rv-sheet-phones a:hover{background:var(--bg-2)}

/* the layer boxes take focus (tabindex -1) when plain text inside them is clicked, so Escape keeps working */
.rv-sheet:focus-visible,.rv-wa:focus-visible{outline:none}

/* short display paragraphs and small headings (2 to 4 lines): balanced, so no line ends on one or two words */
.rv-zig-dt,.rv-fact-lbl,.rv-panel-body,.rv-vbody,.rv-opt-body,.rv-ded-body,.rv-cta-body{text-wrap:balance}

@keyframes rv-rise{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
@keyframes rv-fade{from{opacity:0} to{opacity:1}}

/* ---------- 15. Container queries ---------- */
@container rv (max-width: 1240px){
  .rv-hero-archbox{width:min(35%, 520px)}
  .rv-slide-copy{padding-inline-end:calc(35% + 24px)}
  /* the panel stays clear of slide 2's arch and keeps the intro on two lines */
  .rv-stage{--panel-w:560px}
}
/* Short windows (1366 x 657, 1536 x 730, 1920 x 860). The picture needs the hero's whole height for the plane, the
   ship and the truck, so the bar under it cannot be on the first screen too, or the panel cannot stand under the
   ship. Then the picture fills the first screen, the bar gives up its caption and its full width and stands on the
   picture by the panel's foot, and the floating WhatsApp button shows its icon only (it stands on the picture, clear
   of the truck). Beyond 2.55 : 1 under the header no cover picture holds the whole scene: the hero grows to the
   scene's height and the window's foot crops the truck's wheels. The thresholds are the window heights under which
   the panel (as in .rv-stage, with the Arabic line height) or the bar would not fit; 100vw counts a classic
   scrollbar, so they err towards this layout. */
@media (max-height: calc(33.5vw + 174px + clamp(20px, min(2.4vw, 3.4vh), 34px) + 3.4 * clamp(17px, 1.35vw, 19px))), (max-height: calc(39.17vw + 166px)){
  @container rv (min-width: 1024px){
    .rv-stage{--bar-h:0px; --gal-h:max(100svh - var(--hdr), 39.17cqi); --pad:20px; --fb:16px}
    .rv-hero-bar{grid-row:3; align-self:end; justify-self:start; z-index:1; margin-block-end:calc(var(--gal-h) - var(--fsb)); border:0}
    .rv-hero-bar-in{max-width:none; margin:0}
    .rv-hero-cap{display:none}
    .rv-fab{padding:0; width:56px}
    .rv-fab-txt{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
    /* slide 2's arch keeps out of the button's lane */
    .rv-arch-wrap{padding-inline-end:calc(var(--gutter) + max(0px, 108px - var(--wrap0)))}
  }
  /* up to 1700 px wide the panel is a column beside the ship's bow (32 px clear of it) and under both headlines,
     its buttons stacked. The bar becomes a white ledge running on from the column's foot to just past the dots,
     under the ship's keel; its middle line is the lower button's */
  @container rv (min-width: 1024px) and (max-width: 1700px){
    .rv-stage{--panel-w:clamp(250px, var(--ix) + .302 * var(--iw) - 32px - var(--wrap0), 360px); --ledge:64px; --keel-y:calc(var(--fsb) - var(--ledge))}
    .rv-panel{min-height:0; padding-block-end:calc(var(--ledge) / 2 - var(--btn-h) / 2)}
    .rv-actions{flex-direction:column; align-items:stretch; gap:8px; padding-block-start:14px}
    .rv-slide-foot{padding-block-start:12px}
    .rv-hero-bar{margin-inline-start:var(--wrap0)}
    .rv-hero-bar-in{min-height:var(--ledge); padding-block:0; padding-inline:calc(var(--panel-w) + 28px) 28px}
  }
  /* wider, a column there would be too narrow: the panel lies under the keel, as wide as the intro's one line and
     clear of the truck, and the count and the dots close the buttons' row inside it; slide 2's arch narrows to stay
     clear of it */
  @container rv (min-width: 1701px){
    .rv-stage{--plh:1.5; --panel-w:min(940px, var(--ix) + .676 * var(--iw) - 24px - var(--wrap0)); --panel-h:calc(38px + var(--plh) * var(--fb) + var(--btn-h)); --keel-y:calc(var(--fsb) - var(--panel-h))}
    .rv-root:lang(ar) .rv-stage{--plh:1.6}
    .rv-panel{min-height:0; padding:16px 22px 12px}
    .rv-actions{padding-block-start:10px}
    .rv-hero-bar{z-index:2; width:var(--panel-w); margin-inline-start:var(--wrap0); background:transparent; pointer-events:none}
    .rv-hero-bar-in{justify-content:flex-end; min-height:calc(var(--btn-h) + 12px); padding-block:0 12px; padding-inline:22px}
    .rv-dots{pointer-events:auto}
    .rv-hero-archbox{width:min(38%, 520px, 100% - var(--panel-w) - 32px)}
  }
}
/* wider still and shorter (over 2.5 : 1 under the header) the intro gives way, so the buttons' row alone lies under
   the keel; screen readers still read it */
@media (max-height: calc(33.5vw + 210px)){
  @container rv (min-width: 1701px){
    .rv-stage{--panel-h:calc(24px + var(--btn-h))}
    .rv-panel{padding-block-start:12px}
    .rv-panel-body{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
    .rv-actions{padding-block-start:0}
  }
}
@container rv (max-width: 1199px){
  /* values: below 1200 the heading sits above the 2 x 2 grid, so the title keeps its two-line shape */
  .rv-values-head{grid-column:1 / -1; position:static; margin-block-end:32px}
  .rv-vlist{grid-column:1 / -1}
}
@container rv (max-width: 1399px){
  /* the bar between the panel and the WhatsApp button's lane is too short for the caption (it is aria-hidden) */
  .rv-hero-cap{display:none}
}
@container rv (max-width: 1023px){

  .rv-fab-txt{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
  .rv-header .rv-brand{--mark-h:44px; --mark-gap:10px}

  .rv-menubtn{display:inline-flex}
  .rv-brand{margin-inline-end:auto}
  .rv-shead .rv-h2{grid-column:1 / -1}
  .rv-shead .rv-lede{grid-column:1 / span 9}
  .rv-zig{row-gap:28px}
  .rv-zig-media,.rv-zig.is-flip .rv-zig-media{grid-column:1 / span 7}
  .rv-zig-text,.rv-zig.is-flip .rv-zig-text{grid-column:8 / span 5}
  .rv-zig.is-flip .rv-zig-media{grid-column:6 / span 7}
  .rv-zig.is-flip .rv-zig-text{grid-column:1 / span 5}
  .rv-values-head{grid-column:1 / -1; position:static; margin-block-end:32px}
  .rv-vlist{grid-column:1 / -1}
  .rv-about-text{grid-column:1 / -1}
  .rv-quote-label{grid-column:1 / -1; flex-direction:row; align-items:center; margin-block-end:24px}
  .rv-quote-mark{width:40px; height:40px}
  .rv-quote-text{grid-column:1 / -1}
  .rv-cta-art{opacity:.5}
  /* contact: arch photo beside the heading, details as a 2 x 2 grid underneath, then the form */
  .rv-c-main{display:contents}
  .rv-root .rv-c-photo{grid-column:1 / span 5; grid-row:1}
  .rv-c-main .rv-shead{grid-column:6 / span 7; grid-row:1; align-self:center; margin-block-end:0}
  .rv-details{grid-column:1 / -1; grid-row:2; margin-block-start:clamp(40px, 5.4cqi, 56px)}
  .rv-formcard{grid-row:3; display:block}
  .rv-form-aside{flex-direction:row; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px 24px}
  .rv-formcard .rv-form-title{max-width:none}
  .rv-formbody .rv-form,.rv-formbody .rv-success{margin-block-start:26px}
  .rv-about-grid .rv-shead{grid-column:1 / -1; margin-block-end:32px}
  .rv-about-text{border-block-start:0; padding-block-start:0}
  .rv-foot-top .rv-brand{grid-column:1 / -1; margin-block-end:28px}
  .rv-foot-line{grid-column:1 / -1}
  .rv-fcol-addr{grid-column:1 / span 6}
  .rv-fcol-nav{grid-column:7 / span 6}
  .rv-fcol-phone{grid-column:1 / span 6}
  .rv-fcol-social{grid-column:7 / span 6}
  .rv-dedicated{grid-template-columns:auto minmax(0,1fr)}
  .rv-ded-body{grid-column:2}
}
@container rv (min-width: 641px) and (max-width: 1023px){
  /* tablets keep the composition. The hero does not follow the window height (a portrait tablet has room to spare,
     a phone on its side scrolls): it is a little taller than the picture at the page width, so the picture is
     cropped at the start. The panel takes three lines of intro, keeps both buttons on one row and stays clear of
     the truck; the headline keeps the tablet sizes as far as the room above the ship and before the plane allows;
     the arch keeps its shape */
  .rv-stage{--gal-h:min(600px, 50cqi + 136px); --fsb:calc(var(--gal-h) + var(--bar-h)); --lines:3; --pad:20px; --fb:17px; --pw:460px; --panel-w:min(var(--pw), var(--ix) + .676 * var(--iw) - 16px - var(--wrap0)); --hcap:9cqi; --hlo:44px; --hhi:92px}
  .rv-root:lang(ar) .rv-stage{--hcap:7.6cqi; --hlo:36px; --hhi:78px}
  .rv-hero-archbox{height:auto; aspect-ratio:5 / 8; max-height:88%}
}
@container rv (min-width: 744px) and (max-width: 1023px){
  /* slide 2's arch, with its 20 px frame, keeps 24 px clear of the panel beside it */
  .rv-hero-archbox{width:min(35%, 520px, 100% - var(--panel-w) - 44px)}
}
@container rv (min-width: 641px) and (max-width: 743px){
  /* small tablets and phones on their side: left of the truck there is no room for the panel with its buttons on
     one row, so the panel moves under the bar, onto the sea tint; the picture still covers the headline's band */
  .rv-gal{grid-row:1 / 3}
  .rv-hero-bar{grid-row:3}
  .rv-panels{grid-row:4; margin-block-end:0}
  .rv-stage{--keel-y:9999px; --pw:440px; --panel-w:var(--pw); --pad:24px}
  .rv-hero-bar-in{padding-inline-start:var(--gutter)}
  .rv-slide-foot{padding-block:24px 40px}
  .rv-panel{min-height:0; padding:var(--pad)}
  .rv-actions{padding-block-start:24px}
}
/* landscape tablets shorter than the hero (900 x 600): the floating button stands on the picture, so the picture
   moves towards the inline start until the truck's tail is 84 px from the edge, clear of the button */
@media (max-height: calc(140px + min(600px, 50vw + 136px))){
  @container rv (min-width: 744px) and (max-width: 1023px){
    .rv-stage{--ix:clamp(100cqi - var(--iw), min(100cqi - 16px - .951 * var(--iw), 100cqi - 84px - .918 * var(--iw)), 0px)}
    .rv-media-photo img{object-position:clamp(100cqw - 1.7768 * max(56.28cqw, 100cqh), min(100cqw - 16px - 1.69 * max(56.28cqw, 100cqh), 100cqw - 84px - 1.6311 * max(56.28cqw, 100cqh)), 0px) clamp(100cqh - max(56.28cqw, 100cqh), var(--py), 0px)}
  }
}
@container rv (max-width: 999px){
  .rv-arcade{grid-template-columns:repeat(2, minmax(0,1fr))}
  .rv-card-arch{aspect-ratio:1 / 1}
}
@container rv (max-width: 860px){
  .rv-zig,.rv-zig.is-flip{grid-template-columns:minmax(0,1fr)}
  .rv-zig-media,.rv-zig.is-flip .rv-zig-media{grid-column:1; grid-row:1}
  .rv-zig-text,.rv-zig.is-flip .rv-zig-text{grid-column:1; grid-row:2; max-width:620px}
  .rv-stage{--pw:440px}
}
@container rv (max-width: 640px){
  .rv-root{--hdr:64px; font-size:16.5px}
  .rv-root > *{--hdr:64px}
  .rv-header-in{gap:10px}
  .rv-brand-name{font-size:15px}
  .rv-brand-tag{font-size:8.5px}
  /* compact mark: name, emblem (2.6x the name) and gap scale together with the frame, so the header
     row always fits (about 37 px emblem at 390, 39 px from 410 up, 30 px at 320) */
  .rv-header .rv-brand,.rv-sheet-head .rv-brand{font-size:clamp(11.5px, calc(5.8cqi - 8.3px), 15px); --mark-h:2.6em; --mark-gap:.6em}
  .rv-header .rv-brand-name,.rv-sheet-head .rv-brand-name{font-size:1em}
  .rv-brand-words{gap:4px}
  .rv-foot-top .rv-brand{--mark-h:54px; --mark-gap:12px}
  .rv-foot-top .rv-brand-name{font-size:17px}
  .rv-foot-top .rv-brand-tag{font-size:9.5px}
  .rv-h-cta{display:none}
  .rv-langbtn{padding:0 12px}
  .rv-langbtn .rv-ic{display:none}
  /* hero: stacked. Headline on the sea tint, the image, the pagination right under it, then the text and the
     buttons. Both headlines share one band (the taller one sets it): each sits at the foot of the band, right above
     the image, so a shorter one leaves its spare room under the header, not a gap before the image */
  .rv-stage{display:flex; flex-direction:column; --tm:18px}
  .rv-root:lang(ar) .rv-stage{--plh:1.8}
  .rv-copies{order:1}
  .rv-slide-copy{display:flex; flex-direction:column; justify-content:flex-end; padding-block:36px 24px; padding-inline-end:var(--gutter)}
  /* the image band: two thirds of the column plus 20 px (slide 2's arch and the buttons on a phone's first screen
     depend on it); slide 1's picture fills it edge to edge, cropped at the inline start (sea), so the plane keeps
     its wingtip */
  .rv-gal{order:2; min-height:0; height:calc((100cqi - 2 * var(--gutter)) * .6634 + 20px)}
  .rv-media-photo img{object-position:88% 60%}
  .rv-gal::after{display:none}
  .rv-gal-b .rv-media-tint{background:var(--sea)}
  .rv-hero-bar{order:3; background:transparent; border-block-end:0}
  .rv-panels{order:4; margin-block-end:0}
  .rv-slide-foot{align-items:flex-end; padding-block:0 32px}
  .rv-hero-title{font-size:calc(clamp(44px, 13.4cqi, 64px) * var(--ds))}
  .rv-root:lang(ar) .rv-hero-title{font-size:clamp(37px, 11.2cqi, 54px); max-inline-size:none}
  .rv-copy-b .rv-hero-title{max-inline-size:none}
  /* Arabic lines are taller (Amiri): a little less room around the headline keeps the band as tall as the English
     one, so the buttons reach the first screen at 360 x 780 and the picture ends above the floating button at 320 */
  .rv-root:lang(ar) .rv-slide-copy{padding-block:28px 18px}
  .rv-ht-accent{padding-inline-start:0}
  .rv-arch-wrap{justify-content:center}
  .rv-hero-archbox{width:auto; height:calc(100% - 24px); aspect-ratio:4 / 5; margin-block-start:24px}
  .rv-hero-archbox::before{inset:-14px -14px 0 -14px}
  .rv-panel{display:block; width:100%; min-height:0; padding:4px 0 0; background:transparent}
  .rv-actions{flex-direction:column; align-items:stretch; margin-block-start:24px; padding-block-start:0}
  .rv-actions .rv-btn{width:100%}
  /* the hero buttons often land at the foot of the first screen: keep them out of the floating button's lane */
  .rv-actions{padding-inline-end:max(0px, calc(var(--fab-room) - var(--gutter)))}
  .rv-hero-bar-in{min-height:64px; gap:10px; padding-inline-start:var(--gutter)}
  .rv-hero-cap{display:none}
  .rv-count{min-width:0; font-size:20px}
  .rv-facts-grid{grid-template-columns:minmax(0,1fr)}
  .rv-fact{padding-inline:0; padding-block:22px 24px; border-inline-start:0; border-block-start:1px solid var(--line)}
  .rv-fact-val{font-size:calc(42px * var(--ds))}
  .rv-root:lang(ar) .rv-fact-val{font-size:38px}
  .rv-fact-lbl{margin-block-start:8px}
  .rv-fact:first-child{border-block-start:0}
  .rv-shead{grid-template-columns:minmax(0,1fr); row-gap:18px}
  .rv-shead .rv-h2,.rv-shead .rv-lede,.rv-shead-solo .rv-h2{grid-column:1}
  .rv-zig-title{margin-block-start:16px}
  /* service cards become a list: thumbnail arch beside the title */
  .rv-arcade{grid-template-columns:minmax(0,1fr); column-gap:0; row-gap:0; padding-block-start:8px}
  .rv-card{--thumb:96px; grid-template-columns:var(--thumb) minmax(0,1fr); grid-template-rows:none; grid-row:auto; column-gap:20px; padding-block:22px 4px; border-block-end:1px solid var(--line)}
  .rv-card::before{display:none}
  .rv-card-arch{grid-row:1; grid-column:1; width:var(--thumb); aspect-ratio:4 / 5; align-self:start}
  .rv-card-body{grid-row:1; grid-column:2; padding-block:4px 0}
  .rv-card-title{font-size:calc(28px * var(--ds)); margin-block-start:6px}
  .rv-card-toggle{grid-row:2; grid-column:1 / -1}
  .rv-card-detail{grid-row:3; grid-column:1 / -1}
  .rv-card-glyph{font-size:70px; padding-block-start:18%}
  .rv-root:lang(ar) .rv-card-glyph{font-size:60px}
  .rv-card-short{font-size:15px}
  .rv-compare{grid-template-columns:minmax(0,1fr)}
  .rv-opt{display:block; grid-row:auto}
  .rv-or{grid-row:auto; flex-direction:row; justify-content:center; padding-block:28px}
  .rv-or::before{inset-block:auto; inset-inline:0; top:50%; width:auto; height:1px}
  .rv-or-dot{width:56px; height:56px; font-size:22px}
  .rv-dedicated{grid-template-columns:minmax(0,1fr); padding:24px}
  .rv-ded-body{grid-column:1}
  .rv-vlist{grid-template-columns:minmax(0,1fr)}
  .rv-value:nth-child(odd),.rv-value:nth-child(even){padding-inline:0; border-inline-end:0}
  .rv-value{display:grid; grid-template-columns:72px minmax(0,1fr); column-gap:16px; align-items:start}
  .rv-vnum{font-size:60px; grid-row:1 / span 2}
  .rv-vtitle{margin-block-start:4px}
  .rv-quote{grid-template-columns:minmax(0,1fr)}
  .rv-about-text{text-wrap:wrap}
  .rv-about-text::first-letter{font-size:3.6em}
  .rv-cta-art{width:80%; opacity:.4}
  .rv-cta-row{flex-direction:column; align-items:flex-start}
  .rv-cta-row .rv-btn{width:100%}
  .rv-contact-grid{grid-template-columns:minmax(0,1fr)}
  .rv-c-main .rv-shead{grid-column:1; grid-row:1; align-self:auto; margin-block-end:40px}
  .rv-root .rv-c-photo{grid-column:1; grid-row:2; width:100%; margin-block:8px 36px}
  .rv-details{grid-column:1; grid-row:3; grid-template-columns:minmax(0,1fr); margin-block-start:0}
  .rv-formcard{grid-row:4}
  .rv-form-foot .rv-btn{width:100%}
  .rv-success{grid-template-columns:minmax(0,1fr)}
  .rv-success .rv-btn{grid-column:1; width:100%}
  .rv-foot-grid{grid-template-columns:repeat(2, minmax(0,1fr)); column-gap:16px}
  .rv-fcol-addr{grid-column:1 / -1}
  .rv-fcol-nav{grid-column:1; grid-row:2 / span 2}
  .rv-fcol-phone{grid-column:2; grid-row:2}
  .rv-fcol-social{grid-column:2; grid-row:3}
  .rv-foot-top{grid-template-columns:minmax(0,1fr)}
  /* chooser becomes a full-screen sheet */
  .rv-scrim{display:none}
  .rv-wa{position:fixed; inset:0; width:auto; bottom:0; border:0; box-shadow:none; display:flex; flex-direction:column; overflow-y:auto; padding-block-end:env(safe-area-inset-bottom, 0px)}
  .rv-wa-head{min-height:64px; padding:12px var(--gutter) 18px; padding-block-start:max(12px, env(safe-area-inset-top, 0px))}
  [dir="rtl"] .rv-wa-head{padding:12px var(--gutter) 18px}
  .rv-wa-list{padding:12px var(--gutter)}
  .rv-wa-row{min-height:76px; padding:12px 8px}
  .rv-wa-title{font-size:calc(34px * var(--ds))}
  .rv-wa-list{border-block-end:1px solid var(--line); margin-inline:var(--gutter); padding-inline:0}
  .rv-wa-foot{display:block; margin-block-start:auto; padding:24px var(--gutter) 28px; font:italic 400 19px/1.2 'Instrument Serif',serif; color:var(--navy)}
  .rv-root:lang(ar) .rv-wa-foot{font-family:'Amiri',serif; font-style:normal; font-size:20px; line-height:1.6}
}
@container rv (max-width: 520px){
  /* one field per row on phones: labels ("Phone number" + "Required") and the select placeholder fit */
  .rv-form{grid-template-columns:minmax(0,1fr); row-gap:18px}
}
@container rv (max-width: 479px){
  .rv-menubtn-txt{display:none}
  .rv-menubtn{padding:0}
}
@container rv (max-width: 399px){
  .rv-header .rv-brand-tag,.rv-sheet-head .rv-brand-tag{font-size:8px}
  .rv-langbtn{padding:0 10px}
  .rv-sheet-title{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
  .rv-phone-acts{width:100%}
  .rv-phone-acts .rv-chip{flex:1; justify-content:center}
}
@container rv (max-width: 379px){
  .rv-fcol-nav,.rv-fcol-phone,.rv-fcol-social{grid-column:1 / -1; grid-row:auto}
  .rv-fcol-nav .rv-flinks{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); column-gap:16px}
}
@container rv (max-width: 359px){
  .rv-header .rv-brand-tag,.rv-sheet-head .rv-brand-tag{display:none}
  .rv-header-in{gap:6px}
  .rv-tools{gap:6px}
  .rv-header .rv-brand{padding-inline-end:4px}
  .rv-langbtn{padding:0 6px; min-width:44px; justify-content:center}
  .rv-langbtn-txt,.rv-langbtn-txt:lang(ar){font-size:14px}
}

/* ---------- 16. Reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  .rv-root *,.rv-root *::before,.rv-root *::after{animation-duration:1ms!important; animation-iteration-count:1!important; transition-duration:1ms!important; transition-delay:0ms!important}
  .rv-kb,.rv-gal-item.is-cur .rv-kb{transform:none}
}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<div class="rv-root {{rootCls}}" id="top" lang="{{lang}}" dir="{{dir}}" ref="{{setRoot}}">
<a class="rv-skip" href="#rv-main">{{t.nav.skip}}</a>

<header class="rv-header">
  <div class="rv-wrap rv-header-in">
    <a class="rv-brand" href="#top" aria-label="{{brandLabel}}">
      <img class="rv-brand-mark" src="../img/emblem.svg" alt="" width="52" height="48" decoding="async" />
      <span class="rv-brand-words"><span class="rv-brand-name" dir="ltr">FREIGHT NET SARL</span><span class="rv-brand-tag" dir="ltr">SEA . AIR . LAND</span></span>
    </a>
    <nav class="rv-nav" aria-label="{{x.mainNav}}">
      <sc-for list="{{navItems}}" as="n" hint-placeholder-count="4"><a class="rv-nav-link" href="{{n.href}}">{{n.label}}</a></sc-for>
    </nav>
    <div class="rv-tools">
      <button type="button" class="rv-langbtn" onClick="{{toggleLang}}">
        <svg class="rv-ic rv-ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
        <span class="rv-langbtn-txt" lang="{{langBtnLang}}">{{t.nav.lang}}</span><span class="rv-vh">{{t.nav.langLabel}}</span>
      </button>
      <a class="rv-btn rv-btn-primary rv-h-cta" href="#rv-quote">{{t.nav.quote}}</a>
      <button type="button" class="rv-menubtn" aria-haspopup="dialog" aria-expanded="{{menuExp}}" aria-label="{{t.nav.menu}}" onClick="{{openMenu}}">
        <svg class="rv-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16"></path><path d="M4 15h16"></path></svg>
        <span class="rv-menubtn-txt" aria-hidden="true">{{t.nav.menu}}</span>
      </button>
    </div>
  </div>
</header>

<main class="rv-main" id="rv-main" tabIndex="-1">

<section class="rv-hero" aria-roledescription="carousel" aria-label="{{x.carousel}}" onPointerEnter="{{heroEnter}}" onPointerLeave="{{heroLeave}}" onFocus="{{heroFocus}}" onBlur="{{heroBlur}}">
  <h1 class="rv-vh">{{h1}}</h1>
  <div class="rv-stage {{stageCls}}" ref="{{setStage}}" onPointerDown="{{dragStart}}" onPointerMove="{{dragMove}}" onPointerUp="{{dragEnd}}" onPointerCancel="{{dragCancel}}" onLostPointerCapture="{{dragLost}}" onDragStart="{{noNativeDrag}}" onClickCapture="{{dragClick}}">
    <div class="rv-gal {{framesCls}}">
      <div class="rv-gal-item rv-gal-a {{fA.cls}}" aria-hidden="{{fA.hidden}}">
        <div class="rv-slide-media rv-media-photo">
          <div class="rv-kb"><img class="rv-mirror" src="../img/s2-hero-nologo.webp" width="1672" height="941" alt="{{x.alt.hero}}" /></div>
        </div>
      </div>
      <div class="rv-gal-item rv-gal-b {{fB.cls}}" aria-hidden="{{fB.hidden}}">
        <div class="rv-slide-media rv-media-tint">
          <div class="rv-wrap rv-arch-wrap">
            <div class="rv-hero-archbox">
              <div class="rv-hero-arch"><div class="rv-kb"><img src="../img/s2-port.webp" width="1200" height="1200" alt="{{x.alt.port}}" /></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="rv-copies" aria-live="{{live}}">
      <div class="rv-wrap rv-slide-copy rv-copy-a {{sA.cls}}" role="group" aria-roledescription="slide" aria-label="{{sA.label}}" aria-hidden="{{sA.hidden}}">
        <p class="rv-eyebrow rv-slide-eyebrow">{{sA.eyebrow}}</p>
        <h2 class="rv-hero-title"><span class="rv-ht-line">{{sA.lead}}</span><span class="rv-ht-line rv-ht-accent">{{sA.accent}}</span></h2>
      </div>
      <div class="rv-wrap rv-slide-copy rv-copy-b {{sB.cls}}" role="group" aria-roledescription="slide" aria-label="{{sB.label}}" aria-hidden="{{sB.hidden}}">
        <p class="rv-eyebrow rv-slide-eyebrow">{{sB.eyebrow}}</p>
        <h2 class="rv-hero-title"><span class="rv-ht-line">{{sB.lead}}</span><span class="rv-ht-line rv-ht-accent">{{sB.accent}}</span></h2>
      </div>
    </div>
    <div class="rv-hero-bar">
      <div class="rv-wrap rv-hero-bar-in">
        <p class="rv-count" aria-hidden="true"><span>{{countCur}}</span><span class="rv-count-sep">/</span><span class="rv-count-tot">{{countTot}}</span></p>
        <div class="rv-dots">
          <sc-for list="{{dots}}" as="d" hint-placeholder-count="2"><button type="button" class="rv-dot {{d.cls}}" aria-label="{{d.label}}" aria-current="{{d.current}}" onClick="{{d.go}}"><span class="rv-dot-mark"></span></button></sc-for>
        </div>
        <p class="rv-hero-cap" aria-hidden="true"><span class="rv-fig">{{x.fig}} {{countCur}}</span><span>{{heroCap}}</span></p>
      </div>
    </div>
    <div class="rv-panels">
      <div class="rv-wrap rv-slide-foot {{sA.cls}}" aria-hidden="{{sA.hidden}}">
        <div class="rv-panel">
          <p class="rv-panel-body">{{sA.body}}</p>
          <div class="rv-actions">
            <a class="rv-btn rv-btn-primary" href="#rv-quote">{{t.hero.ctaQuote}}<svg class="rv-ic rv-ic-sm rv-arrow rv-flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
            <button type="button" class="rv-btn rv-btn-ghost" aria-haspopup="dialog" onClick="{{openWa}}"><svg class="rv-ic rv-ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>{{t.hero.ctaWhatsapp}}</button>
          </div>
        </div>
      </div>
      <div class="rv-wrap rv-slide-foot {{sB.cls}}" aria-hidden="{{sB.hidden}}">
        <div class="rv-panel">
          <p class="rv-panel-body">{{sB.body}}</p>
          <div class="rv-actions">
            <a class="rv-btn rv-btn-primary" href="#rv-quote">{{t.hero.ctaQuote}}<svg class="rv-ic rv-ic-sm rv-arrow rv-flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
            <button type="button" class="rv-btn rv-btn-ghost" aria-haspopup="dialog" onClick="{{openWa}}"><svg class="rv-ic rv-ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>{{t.hero.ctaWhatsapp}}</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="rv-facts" aria-label="{{x.factsLabel}}">
  <div class="rv-wrap">
    <ul class="rv-facts-grid">
      <sc-for list="{{t.facts}}" as="f" hint-placeholder-count="3">
        <li class="rv-fact"><p class="rv-fact-val">{{f.value}}</p><p class="rv-fact-lbl">{{f.label}}</p></li>
      </sc-for>
    </ul>
  </div>
</section>

<section class="rv-sec rv-services" id="services" aria-labelledby="rv-services-h">
  <div class="rv-wrap">
    <header class="rv-shead">
      <p class="rv-shead-tag"><span class="rv-snum" dir="ltr">(01)</span><span class="rv-eyebrow">{{t.services.eyebrow}}</span></p>
      <h2 class="rv-h2" id="rv-services-h">{{hServices.lead}}<span class="rv-it">{{hServices.accent}}</span></h2>
      <p class="rv-lede">{{t.services.lede}}</p>
    </header>

    <sc-for list="{{zig}}" as="z" hint-placeholder-count="4">
      <article class="rv-zig {{z.cls}}" aria-labelledby="{{z.hid}}">

       without a second, competing scroll */
    this.setState((s) => {
      const form = Object.assign({}, s.form, { service: id });
      const errors = Object.assign({}, s.errors); delete errors.service;
      return { form, errors, sent: false };
    }, () => {
      /* wait for the link's own fragment navigation, which moves focus to the (unfocusable) target and so to <body> */
      clearTimeout(this.pickT);
      this.pickT = setTimeout(() => {
        const el = document.getElementById('rv-f-service');
        if (el) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
      }, 0);
    });
  }

  renderVals() {
    const lang = this.lang();
    const t = COPY[lang] || COPY.en;
    const x = EXTRA[lang] || EXTRA.en;
    const c = COPY.contact || {};
    const s = this.state;
    const holding = this.holding();
    const slides = (t.hero && t.hero.slides) || [];
    const nSlides = Math.max(1, slides.length);

    /* image frames: the current one, the waiting neighbour (drag, pre, snap) or the leaving one (go) */
    const frame = (i) => {
      let cls = '';
      if (i === s.slide) cls = 'is-cur';
      else if (i === s.nb && (s.phase === 'drag' || s.phase === 'pre' || s.phase === 'snap')) cls = 'is-nb';
      else if (i === s.out && s.phase === 'go') cls = 'is-out';
      return { cls, hidden: i === s.slide ? 'false' : 'true' };
    };
    const mkSlide = (i) => {
      const sl = slides[i] || {};
      const sp = rvSplit(sl.title);
      const on = s.slide === i;
      return { eyebrow: sl.eyebrow, body: sl.body, lead: sp.lead, accent: sp.accent, cls: on ? 'is-active' : '', hidden: on ? 'false' : 'true', label: (i + 1) + ' / ' + nSlides };
    };

    const navItems = [
      { id: 'top', label: t.nav.home },
      { id: 'services', label: t.nav.services },
      { id: 'about', label: t.nav.about },
      { id: 'contact', label: t.nav.contact }
    ].map((n, i) => Object.assign({}, n, {
      href: '#' + n.id, num: rvPad(i + 1),
      sheetGo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.closeLayer({ __rv: true, then: () => this.scrollToId(n.id) }); }
    }));

    /* services in the copy's order, numbered from it (01 / 08); RV_SVC_MEDIA sends each to the image rows or the
       arcade */
    const items = ((t.services && t.services.items) || []).map((it, i) => ({ it, n: i + 1, m: RV_SVC_MEDIA[it.id] || { img: null } }));
    const total = items.length;
    const zig = items.filter((e) => e.m.row && e.m.img).map((e, i) => {
      const it = e.it; const m = e.m;
      return Object.assign({}, it, {
        num: rvPad(e.n), fig: rvPad(nSlides + i + 1), cls: i % 2 ? 'is-flip' : '', hid: 'rv-svc-' + it.id,
        img: m.img, w: m.w, h: m.h, imgCls: m.imgCls || '', pos: m.pos || '50% 50%',
        alt: (x.alt && x.alt[it.id]) || '', cap: (x.cap && x.cap[it.id]) || it.title,
        pick: () => this.pick(it.id)
      });
    });
    const arc = items.filter((e) => !(e.m.row && e.m.img)).map((e) => {
      const it = e.it; const m = e.m.img ? e.m : null;
      const open = s.openCard === it.id;
      return Object.assign({}, it, {
        num: rvPad(e.n), hid: 'rv-svc-' + it.id, pid: 'rv-svc-d-' + it.id,
        hasImg: !!m, noImg: !m, archCls: m ? '' : 'is-plate', img: m ? m.img : '', w: m ? m.w : 1, h: m ? m.h : 1, pos: m ? m.pos : '50% 50%',
        alt: (x.alt && x.alt[it.id]) || '',
        cls: open ? 'is-open' : '', expanded: open ? 'true' : 'false', closed: !open,
        toggle: () => this.setState((st) => ({ openCard: st.openCard === it.id ? null : it.id })),
        pick: () => this.pick(it.id)
      });
    });

    const phones = ((c.whatsapp) || []).map((p) => ({
      display: p.display, wa: p.wa, tel: 'tel:' + p.e164,
      waLabel: (t.whatsapp ? t.whatsapp.button : 'WhatsApp') + ' ' + p.display,
      callLabel: x.callPrefix + ' ' + p.display,
      waGo: () => { this.closeLayer(); }
    }));
    /* call-only numbers (no WhatsApp): contact group, footer and menu sheet; never the WhatsApp chooser */
    const callOnly = (c.phones || []).filter((p) => p && p.display).map((p) => ({
      display: p.display,
      tel: p.tel || ('tel:' + String(p.e164 || p.display).replace(/[^\d+]/g, '')),
      callLabel: x.callPrefix + ' ' + p.display
    }));
    const emails = (c.emails || []).map((m) => ({ addr: m, href: 'mailto:' + m }));
    /* social accounts in the copy's order (Instagram, TikTok); the icon follows the network's name */
    const social = (c.social || []).filter((so) => so && so.url && so.handle).map((so) => {
      const key = String(so.name || '').toLowerCase();
      return { url: so.url, handle: so.handle, label: (x.networks && x.networks[key]) || so.name || '', isInsta: key === 'instagram', isTiktok: key === 'tiktok' };
    });

    const f = (t.contactSection && t.contactSection.form) || {};
    const err = {}; const inv = {}; const desc = {};
    RV_FIELDS.forEach((k) => {
      const ek = s.errors[k];
      err[k] = ek ? (f[ek] || '') : '';
      inv[k] = ek ? 'true' : 'false';
      desc[k] = ek ? 'rv-e-' + k : undefined;
    });

    const values = ((t.values && t.values.items) || []).map((v, i) => Object.assign({}, v, { num: rvPad(i + 1) }));
    const rootCls = s.locked ? 'is-locked' : '';

    return {
      lang, dir: lang === 'ar' ? 'rtl' : 'ltr', t, x, c, rootCls,
      setRoot: this.setRoot, setMenuEl: this.setMenuEl, setWaEl: this.setWaEl,
      setMenuClose: this.setMenuClose, setWaClose: this.setWaClose, setSentEl: this.setSentEl,
      brandLabel: 'Freight Net SARL, ' + t.nav.home,
      langBtnLang: lang === 'ar' ? 'en' : 'ar',
      toggleLang: () => this.setLang(lang === 'ar' ? 'en' : 'ar'),
      navItems, brandSheetGo: navItems[0].sheetGo,
      menuOpen: s.menuOpen, waOpen: s.waOpen,
      menuExp: s.menuOpen ? 'true' : 'false', waExp: s.waOpen ? 'true' : 'false',
      openMenu: (e) => this.openLayer('menuOpen', e),
      openWa: (e) => this.openLayer('waOpen', e),
      closeLayer: this.closeLayer, layerKey: this.layerKey,
      sheetQuote: (e) => { if (e && e.preventDefault) e.preventDefault(); this.closeLayer({ __rv: true, then: () => this.scrollToId('rv-quote') }); },
      h1: (t.legal || 'Freight Net SARL') + ' · ' + (t.tagline || ''),
      sA: mkSlide(0), sB: mkSlide(1),
      live: holding ? 'polite' : 'off',
      /* aria-current only on the current dot (undefined leaves the attribute out) */
      dots: slides.map((sl, i) => ({ cls: s.slide === i ? 'is-active' : '', current: s.slide === i ? 'true' : undefined, label: t.hero.goTo + ' ' + (i + 1), go: () => this.goTo(i, true) })),
      countCur: rvPad(s.slide + 1), countTot: rvPad(nSlides),
      heroCap: s.slide === 0 ? x.cap.hero : x.cap.port,
      stageCls: s.phase === 'drag' ? 'is-dragging' : '', setStage: this.setStage,
      framesCls: (s.side < 0 ? 'is-l' : 'is-r') + (s.moving ? ' is-moving' : ''), fA: frame(0), fB: frame(1),
      dragStart: this.dragStart, dragMove: this.dragMove, dragEnd: this.dragEnd, dragCancel: this.dragCancel, dragLost: this.dragLost,
      dragClick: this.dragClick, noNativeDrag: this.noNativeDrag,
      heroEnter: this.heroEnter, heroLeave: this.heroLeave, heroFocus: this.heroFocus, heroBlur: this.heroBlur,
      hServices: rvSplit(t.services.title), hOcean: rvSplit(t.ocean.title), hValues: rvSplit(t.values.title),
      hAbout: rvSplit(t.about.title), hForm: rvSplit(f.title), hCta: rvSplit(t.cta.title), hContact: rvSplit(t.contactSection.title),
      zig, arc, svcTotal: rvPad(total), glyph: lang === 'ar' ? 'و' : '&',
      values, phones, callOnly, emails, social, figContact: rvPad(nSlides + zig.length + 1),
      f, form: s.form, on: this.on, err, inv, desc, submit: this.submit,
      sent: s.sent, notSent: !s.sent, sending: s.sending ? 'true' : 'false',
      submitLabel: s.sending ? f.sending : f.submit,
      another: () => this.setState({ sent: false }, () => { const el = document.getElementById('rv-f-name'); if (el) el.focus(); }),
      svcOptions: items.map((e) => ({ value: e.it.id, label: e.it.title }))
    };
  }
}
return Component;
});
</script>
</body>
</html>
