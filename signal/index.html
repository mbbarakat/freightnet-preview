          </div>
        </div>
        <div class="sg-bill__cell">
          <h3 class="sg-bill__label">{{t.footer.follow}}</h3>
          <div class="sg-mails">
            <sc-for list="{{social}}" as="so" hint-placeholder-count="2"><a class="sg-mail" href="{{so.url}}" target="_blank" rel="noopener noreferrer" aria-label="{{so.label}}"><sc-if value="{{so.isInsta}}" hint-placeholder-val="{{ true }}"><svg class="sg-ico sg-ico--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="20" x="2" y="2" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><path d="M17.5 6.5h.01"></path></svg></sc-if><sc-if value="{{so.isTiktok}}" hint-placeholder-val="{{ false }}"><svg class="sg-ico sg-ico--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path transform="translate(-1.44 -1.44) scale(1.12)" d="M21 7.917v4.034a9.948 9.948 0 0 1-5-1.951v4.5a6.5 6.5 0 1 1-8-6.326v4.326a2.5 2.5 0 1 0 4 2v-11.5h4.083a6.005 6.005 0 0 0 4.917 4.917z"></path></svg></sc-if><sc-if value="{{so.isOther}}" hint-placeholder-val="{{ false }}"><svg class="sg-ico sg-ico--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></sc-if><span dir="ltr" class="sg-pin">{{so.handle}}</span></a></sc-for>

        </div>

          <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}"><span class="sg-success__ico" aria-hidden="true"><svg class="sg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if>

        </div>
        <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
          <form class="sg-form" noValidate="" onSubmit="{{submit}}" aria-labelledby="{{ids.formTitle}}">

              <div class="sg-field">
                <label class="sg-label" for="{{ids.name}}"><span>{{f.name}}</span><span class="sg-req" aria-hidden="true">{{f.required}}</span></label>

                <sc-if value="{{err.name}}" hint-placeholder-val="{{ false }}"><p class="sg-err" id="{{ids.nameErr}}"><svg class="sg-ico sg-ico--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg><span>{{err.name}}</span></p></sc-if>
              </div>
              <div class="sg-field">
                <label class="sg-label" for="{{ids.email}}"><span>{{f.email}}</span><span class="sg-req" aria-hidden="true">{{f.required}}</span></label>
                <input class="sg-input" id="{{ids.email}}" name="email" type="email" autoComplete="email" inputMode="email" dir="ltr" value="{{form.email}}" onChange="{{onEmail}}" aria-required="true" aria-invalid="{{inv.email}}" aria-describedby="{{desc.email}}" ref="{{refEmail}}"/>
                <sc-if value="{{err.email}}" hint-placeholder-val="{{ false }}"><p class="sg-err" id="{{ids.emailErr}}"><svg class="sg-ico sg-ico--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg><span>{{err.email}}</span></p></sc-if>
              </div>
              <div class="sg-field">
                <label class="sg-label" for="{{ids.phone}}"><span>{{f.phone}}</span><span class="sg-req" aria-hidden="true">{{f.required}}</span></label>
                <input class="sg-input" id="{{ids.phone}}" name="phone" type="tel" autoComplete="tel" inputMode="tel" dir="ltr" value="{{form.phone}}" onChange="{{onPhone}}" aria-required="true" aria-invalid="{{inv.phone}}" aria-describedby="{{desc.phone}}" ref="{{refPhone}}"/>
                <sc-if value="{{err.phone}}" hint-placeholder-val="{{ false }}"><p class="sg-err" id="{{ids.phoneErr}}"><svg class="sg-ico sg-ico--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg><span>{{err.phone}}</span></p></sc-if>
              </div>
              <div class="sg-field">
                <label class="sg-label" for="{{ids.service}}"><span>{{f.service}}</span><span class="sg-req" aria-hidden="true">{{f.required}}</span></label>
                <div class="sg-selectbox">
                  <select class="sg-input {{selectCls}}" id="{{ids.service}}" name="service" value="{{form.service}}" onChange="{{onService}}" aria-required="true" aria-invalid="{{inv.service}}" aria-describedby="{{desc.service}}" ref="{{refService}}">
                    <option value="">{{f.servicePlaceholder}}</option>
                    <sc-for list="{{serviceOptions}}" as="o" hint-placeholder-count="8"><option value="{{o.id}}">{{o.title}}</option></sc-for>
                  </select>
                  <svg class="sg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
                </div>
                <sc-if value="{{err.service}}" hint-placeholder-val="{{ false }}"><p class="sg-err" id="{{ids.serviceErr}}"><svg class="sg-ico sg-ico--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg><span>{{err.service}}</span></p></sc-if>
              </div>
              <div class="sg-field sg-field--full">
                <label class="sg-label" for="{{ids.message}}"><span>{{f.message}}</span><span class="sg-req" aria-hidden="true">{{f.required}}</span></label>
                <textarea class="sg-input" id="{{ids.message}}" name="message" rows="5" value="{{form.message}}" onChange="{{onMessage}}" aria-required="true" aria-invalid="{{inv.message}}" aria-describedby="{{desc.message}}" ref="{{refMessage}}"></textarea>
                <sc-if value="{{err.message}}" hint-placeholder-val="{{ false }}"><p class="sg-err" id="{{ids.messageErr}}"><svg class="sg-ico sg-ico--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg><span>{{err.message}}</span></p></sc-if>
              </div>
            </div>
            <div class="sg-form__foot">
              <button type="submit" class="sg-btn sg-btn--red" disabled="{{sending}}"><span>{{submitLabel}}</span><svg class="sg-ico sg-ico--go sg-flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button>
            </div>
          </form>
        </sc-if>
      </div>
    </div>
  </div>
</section>
</main>

      el.style.setProperty('--sg-dx', Math.max(-32, Math.min(32, dx / 8)).toFixed(1) + 'px');
      el.style.setProperty('--sg-do', (1 - k * 0.7).toFixed(3));
    } catch (_) {}
  }
  // let go. The copy springs back on a short drag; when the slide changes it snaps home at once (its transitions are still off) as the new copy comes in.
  // The photos: --sg-x goes, so the current photo transitions to 0 from where the finger left it, in the same style change as the class change that follows
  unfollow(snap) {
    const el = this.els.top;
    if (!el) return;
    try {
      el.style.removeProperty('--sg-dx');
      el.style.removeProperty('--sg-do');
      if (snap) { const st = el.querySelector('.sg-hero__stack'); if (st) { const cs = window.getComputedStyle(st); void cs.transform; void cs.opacity; } }
      el.style.removeProperty('--sg-x');
    } catch (_) {}
  }
  clearSelection() {
    try { const sel = window.getSelection && window.getSelection(); if (sel && sel.rangeCount && !sel.isCollapsed) sel.removeAllRanges(); } catch (_) {}
  }

  /* ---------- scrolling to sections ---------- */
  scrollEl(el, block) {
    if (!el) return;
    const b = block || 'start';
    const top0 = el.getBoundingClientRect().top;
    try { el.scrollIntoView({ behavior: this.reduced ? 'auto' : 'smooth', block: b }); } catch (e) { try { el.scrollIntoView(true); } catch (_) {} }
    if (!this.reduced) {
      // if smooth scrolling did not start (throttled or unsupported), jump instead
      this.later(() => {
        const r = el.getBoundingClientRect();
        const off = b === 'start' ? Math.abs(r.top) > 90 : (r.top < 0 || r.bottom > window.innerHeight);
        if (Math.abs(r.top - top0) < 2 && off) { try { el.scrollIntoView({ block: b }); } catch (_) {} }
      }, 420);
    }
  }
  goTo(key, e) {
    if (e && e.preventDefault) e.preventDefault();
    const run = () => {
      if (key === 'top') {
        // Home: scroll the whole page to its very top (strip and header included), focus the main landmark
        const r = this.els.root;
        if (r) this.scrollEl(r);
        else { try { window.scrollTo({ top: 0, behavior: this.reduced ? 'auto' : 'smooth' }); } catch (_) {} }
        const m = this.els.main || document.getElementById('sg-main');
        if (m) { try { m.focus({ preventScroll: true }); } catch (_) {} }
        return;
      }
      const el = this.els[key] || document.getElementById('sg-' + key);
      if (!el) return;
      this.scrollEl(el);
      const target = el.querySelector('h2[tabindex]') || el;
      try { target.focus({ preventScroll: true }); } catch (_) {}
    };
    if (this.state.menuOpen) this.closeLayer('menu', { then: run, restoreFocus: false });
    else if (this.state.waOpen) this.closeLayer('wa', { then: run, restoreFocus: false });
    else run();
  }
  quote(id, e) {
    if (e && e.preventDefault) e.preventDefault();
    this.setState(s => {
      const errors = Object.assign({}, s.errors); delete errors.service;
      return { form: Object.assign({}, s.form, { service: id }), errors, sent: false, sending: false };
    }, () => this.goTo('contact'));
  }

  /* ---------- layers: menu sheet + WhatsApp chooser ---------- */
  lockScroll(on) {
    try {
      const de = document.documentElement;
      if (on) {
        if (this.prevOverflow === undefined) {
          this.prevOverflow = de.style.overflow || '';
          this.prevGutter = de.style.scrollbarGutter || '';
          // keep the classic scrollbar's width reserved so the page behind the layer does not jump
          if (window.innerWidth - de.clientWidth > 0) de.style.scrollbarGutter = 'stable';
        }
        de.style.overflow = 'hidden';
      } else if (this.prevOverflow !== undefined) {
        de.style.overflow = this.prevOverflow; de.style.scrollbarGutter = this.prevGutter || '';
        this.prevOverflow = undefined; this.prevGutter = undefined;
      }
    } catch (e) {}
  }
  openLayer(name, opener) {
    const key = name + 'Open';
    if (this.state[key]) return;
    // one layer at a time
    const other = name === 'menu' ? 'wa' : 'menu';
    if (this.state[other + 'Open']) this.closeLayer(other, { restoreFocus: false, silent: true });
    // the entry under the layer must not jump back to the scroll position saved when the layer opened (a section scroll may still be running then); pushState copies the mode to the sentinel
    if (!this.layers.length) { try { if ('scrollRestoration' in window.history) { if (this.prevRestore === undefined) this.prevRestore = window.history.scrollRestoration; window.history.scrollRestoration = 'manual'; } } catch (e) {} }
    let pushed = false;
    try {
      const st = window.history.state && typeof window.history.state === 'object' ? window.history.state : {};
      window.history.pushState(Object.assign({}, st, { __fnBack: this.layers.length + 1 }), '');
      pushed = true;
    } catch (e) { pushed = false; }
    this.layers.push({ name, opener: opener || null, pushed });
    this.lockScroll(true);
    this.setState({ [key]: true }, () => {
      const el = name === 'menu' ? this.els.menuClose : this.els.waClose;
      if (el) { try { el.focus({ preventScroll: true }); } catch (_) { try { el.focus(); } catch (__) {} } }
    });
  }
  closeLayer(name, opts) {
    const o = opts || {};
    let idx = -1;
    for (let i = this.layers.length - 1; i >= 0; i--) if (this.layers[i].name === name) { idx = i; break; }
    if (idx < 0) { if (this.state[name + 'Open']) this.setState({ [name + 'Open']: false }); if (o.then) o.then(); return; }
    const layer = this.layers.splice(idx, 1)[0];
    if (!this.layers.length) this.lockScroll(false);
    this.setState({ [name + 'Open']: false }, () => {
      if (o.restoreFocus !== false) {
        const op = layer.opener || (name === 'menu' ? this.els.menuBtn : this.els.fab);
        if (op && op.isConnected !== false && op.focus) { try { op.focus({ preventScroll: true }); } catch (_) {} }
      }
    });
    let sentinel = false;
    if (!o.fromPop && layer.pushed) {
      try { sentinel = !!(window.history.state && window.history.state.__fnBack != null); } catch (e) { sentinel = false; }
    }
    if (sentinel) {
      this.ignorePop += 1;
      this.pendingNav = o.then || null;
      Promise.resolve().then(() => {
        try { window.history.go(-1); } catch (e) { this.ignorePop = Math.max(0, this.ignorePop - 1); this.runPending(); }
      });
      clearTimeout(this.navTimer);
      this.navTimer = setTimeout(() => this.runPending(), 450);
    } else {
      if (!this.layers.length) this.restoreScrollMode();
      if (o.then) this.later(o.then, 30);
    }
  }
  restoreScrollMode() {
    if (this.prevRestore === undefined) return;
    try { window.history.scrollRestoration = this.prevRestore; } catch (e) {}
    this.prevRestore = undefined;
  }
  runPending() {
    clearTimeout(this.navTimer);
    const f = this.pendingNav; this.pendingNav = null;
    if (f) f();
  }
  handlePop() {
    if (this.ignorePop > 0) {
      this.ignorePop -= 1;
      if (!this.layers.length) this.restoreScrollMode();
      if (this.pendingNav) this.later(() => this.runPending(), 16);
      return;
    }
    const top = this.layers[this.layers.length - 1];
    if (top) { this.closeLayer(top.name, { fromPop: true }); return; }
    this.restoreScrollMode();
    // an ordinary entry with no layer open (e.g. the one under a sentinel left by a reload with a layer open) still holds 'manual': give it back 'auto'
    try { const hs = window.history.state; if (!(hs && hs.__fnBack != null) && window.history.scrollRestoration === 'manual') window.history.scrollRestoration = 'auto'; } catch (e) {}
  }
  layerKey(name, e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault(); e.stopPropagation();
      this.closeLayer(name, {});
      return;
    }
    if (e.key === 'Tab') {
      const box = e.currentTarget;
      const list = Array.prototype.slice.call(box.querySelectorAll('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])'))
        .filter(el => el.getClientRects().length > 0);
      if (!list.length) return;
      const first = list[0], last = list[list.length - 1];
      const act = document.activeElement;
      // the layer itself takes focus when plain text in it is clicked (tabIndex -1, so Escape still reaches it): Shift+Tab from there wraps to the last control
      if (e.shiftKey && (act === first || act === box || !box.contains(act))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (act === last || !box.contains(act))) { e.preventDefault(); first.focus(); }
    }
  }

  /* ---------- form ---------- */
  validate(form) {
    const err = {};
    if (!String(form.name || '').trim()) err.name = 1;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(form.email || '').trim())) err.email = 1;
    if (String(form.phone || '').replace(/\D/g, '').length < 6) err.phone = 1;
    if (!form.service) err.service = 1;
    if (!String(form.message || '').trim()) err.message = 1;
    return err;
  }
  handleSubmit(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (this.state.sending) return;
    const err = this.validate(this.state.form);
    const order = ['name', 'email', 'phone', 'service', 'message'];
    const first = order.find(k => err[k]);
    if (first) {
      this.setState({ errors: err }, () => {
        const el = this.els['f_' + first];
        if (el) { try { el.focus(); } catch (_) {} }
      });
      return;
    }
    this.setState({ errors: {}, sending: true });
    this.later(() => {
      this.setState({ sending: false, sent: true }, () => {
        // the success box is much shorter than the form: bring it into view first (on a phone it would sit above the screen)
        const el = this.els.success;
        if (el) {
          this.scrollEl(el, 'center');
          try { el.focus({ preventScroll: true }); } catch (_) {}
        }
      });
    }, 900);
  }

  /* ---------- render values ---------- */
  renderVals() {
    const s = this.state;
    const lang = this.lang();
    const t = sgMerge(COPY.en, COPY[lang] || {});
    const x = EXTRA[lang] || EXTRA.en;
    const C = COPY.contact || {};
    const uid = this.uid;
    const c = t.contactSection || {};
    const f = c.form || {};
    const hero = t.hero || {};
    const slidesCopy = hero.slides || [];
    const nSlides = Math.min(SG_SLIDES.length, slidesCopy.length) || SG_SLIDES.length;
    const animCls = s.anim % 2 ? 'sg-anim-b' : 'sg-anim-a';
    const stopped = !!(s.held || s.reduced);

    // a title clearly longer (by more than a tenth) than the shortest slide title is "long" and set smaller (CSS .is-long), so its block stays within
    // slide 1's height; a title about as long as the shortest keeps the full size, and with it the same lines and height
    const titleLen = sc => String((sc && sc.title) || '').length;
    const shortestTitle = Math.min.apply(null, slidesCopy.slice(0, nSlides).map(titleLen).filter(n => n > 0).concat([Infinity]));
    const slides = SG_SLIDES.slice(0, nSlides).map((d, i) => {
      const sc = slidesCopy[i] || {};
      const on = i === s.slide;
      return {
        img: d.img, pos: d.pos, alt: (x.alt && x.alt[d.alt]) || '',
        eyebrow: sc.eyebrow || '', title: sc.title || '', body: sc.body || '',
        cls: (on ? 'is-active' : '') + (titleLen(sc) > shortestTitle * 1.1 ? ' is-long' : ''), mediaCls: on ? 'is-active' : (i === s.settle ? 'is-settling' : ''),
        ariaHidden: on ? undefined : 'true',
        label: (i + 1) + ' / ' + nSlides,
        dotCls: on ? 'is-active' : '', fillCls: on && !stopped ? animCls : '',
        current: on ? 'true' : undefined,
        no: sgPad(i + 1),
        goLabel: (hero.goTo || 'Go to slide') + ' ' + (i + 1),
        go: () => this.pickSlide(i, i < this.state.slide ? -1 : 1)
      };
    });
    const heroCls = [s.anim ? 'has-moved' : '', s.inSide < 0 ? 'is-in-l' : '', s.outSide > 0 ? 'is-out-r' : '', s.dragging ? 'is-dragging' : ''].join(' ');

    const navDefs = [
      { key: 'top', label: (t.nav || {}).home, href: '#sg-top' },
      { key: 'services', label: (t.nav || {}).services, href: '#sg-services' },
      { key: 'about', label: (t.nav || {}).about, href: '#sg-about' },
      { key: 'contact', label: (t.nav || {}).contact, href: '#sg-contact' }
    ];
    const nav = navDefs.map(n => Object.assign({}, n, { go: e => this.goTo(n.key, e) }));

    const items = ((t.services || {}).items || []);
    const nSvc = items.length;
    const services = items.map((it, i) => {
      const open = s.openSvc === i;
      return Object.assign({}, it, {
        code: SG_CODE[it.id] || String(it.id || '').slice(0, 3).toUpperCase(),
        no: sgPad(i + 1) + ' / ' + sgPad(nSvc),
        img: SG_IMG[it.id] || SG_IMG.hero, pos: SG_POS[it.id] || '50% 50%',
        alt: (x.alt && x.alt[it.id]) || '',
        cls: open ? 'is-open' : '',
        expanded: open ? 'true' : 'false', closed: !open,
        btnId: uid + '-svc-b' + i, panelId: uid + '-svc-p' + i,
        toggle: () => this.setState(st => ({ openSvc: st.openSvc === i ? null : i, touched: true })),
        hover: () => { if (this.state.hoverSvc !== i) this.setState({ hoverSvc: i }); },
        quote: e => this.quote(it.id, e)
      });
    });
    const vIdx = s.hoverSvc !== null && s.hoverSvc !== undefined ? s.hoverSvc : (s.openSvc !== null && s.openSvc !== undefined ? s.openSvc : 0);
    const viewer = services.map((sv, i) => ({ img: sv.img, pos: sv.pos, cls: i === vIdx ? 'is-on' : '' }));
    const vNow = services[vIdx] || services[0] || {};

    const facts = (t.facts || []).map(fa => ({ value: fa.value, label: fa.label }));
    const values = ((t.values || {}).items || []).map((v, i) => ({ title: v.title, body: v.body, no: sgPad(i + 1) }));

    const tels = (C.whatsapp || []).map((n, i) => ({
      display: n.display, wa: n.wa, tel: 'tel:' + (n.e164 || String(n.display || '').replace(/[^\d+]/g, '')),
      waLabel: x.waPrefix + ' ' + n.display, callLabel: x.callPrefix + ' ' + n.display,
      pickWa: () => { if (this.state.waOpen) this.later(() => this.closeLayer('wa', { restoreFocus: true }), 60); }
    }));
    // call-only numbers (no WhatsApp): contact list, footer, strip and menu sheet, never the WhatsApp chooser
    const calls = (C.phones || []).filter(n => n && n.display).map(n => ({
      display: n.display, tel: n.tel || ('tel:' + (n.e164 || String(n.display).replace(/[^\d+]/g, ''))),
      callLabel: x.callPrefix + ' ' + n.display
    }));
    const emails = (C.emails || []).map(m => ({ addr: m, href: 'mailto:' + m }));
    // social profiles straight from the copy, in its order (Instagram, then TikTok); the icon follows the network, the name reads "<network> <handle>"
    const social = (C.social || []).filter(so => so && so.url).map(so => {
      const net = String(so.name || '').toLowerCase();
      const name = (x.net && x.net[net]) || so.name || '';
      return { url: so.url, handle: so.handle || name, label: (name + ' ' + (so.handle || '')).trim(),
        isInsta: net === 'instagram', isTiktok: net === 'tiktok', isOther: net !== 'instagram' && net !== 'tiktok' };
    });
    const address = c.address || [];
    // the hero's manifest box reads only from the copy, so a copy update cannot leave it stale
    const heroLabel = [
      { k: c.officeTitle || '', v: address[address.length - 1] || '' },
      { k: x.modes || '', v: t.tagline || '' }
    ].filter(r => r.k && r.v);

    // CTA title split at sentence ends (?, !, ., Arabic ؟) so each sentence gets its own line(s); the text itself is unchanged
    const ctaTitle = String((t.cta || {}).title || '');
    const ctaLines = ctaTitle.replace(/([?!.؟])\s+(?=\S)/g, '$1|~|').split('|~|').filter(Boolean);
    const errs = s.errors || {};
    const errMsg = { name: f.errName, email: f.errEmail, phone: f.errPhone, service: f.errService, message: f.errMessage };
    const err = {}, inv = {}, desc = {};
    ['name', 'email', 'phone', 'service', 'message'].forEach(k => {
      err[k] = errs[k] ? (errMsg[k] || '') : '';
      inv[k] = errs[k] ? 'true' : undefined;
      desc[k] = errs[k] ? uid + '-' + k + '-err' : undefined;
    });
    const ids = {
      svc: uid + '-svc', ocean: uid + '-ocean', values: uid + '-values', about: uid + '-about', cta: uid + '-cta', contact: uid + '-contact',
      formTitle: uid + '-ftitle', name: uid + '-name', email: uid + '-email', phone: uid + '-phone', service: uid + '-service', message: uid + '-message',
      nameErr: uid + '-name-err', emailErr: uid + '-email-err', phoneErr: uid + '-phone-err', serviceErr: uid + '-service-err', messageErr: uid + '-message-err',
      menu: uid + '-menu', menuTitle: uid + '-menu-t', wa: uid + '-wa', waTitle: uid + '-wa-t', waSub: uid + '-wa-s'
    };

    const rootCls = [s.menuOpen ? 'is-menu is-locked' : '', s.waOpen ? 'is-locked' : '', s.touched ? 'sg-touched' : ''].join(' ');

    return {
      t, x, c, f, lang, dir: lang === 'ar' ? 'rtl' : 'ltr', rootCls, ids, uid,
      h1: (t.legal || 'Freight Net SARL') + ' · ' + (t.tagline || ''),
      strip: { place: address[address.length - 1] || '' }, heroLabel,
      langSr: (t.nav || {}).langLabel ? ' (' + t.nav.langLabel + ')' : '',
      nav, slides, heroCls,
      // the slide copy is announced only once a person drives the slides, never while it turns on its own
      heroLive: stopped ? 'polite' : 'off',
      facts, services, viewer, viewerNow: { code: vNow.code || '', no: vNow.no || '', title: vNow.title || '' },
      values, tels, calls, emails, social, ctaLines, address, mapsUrl: C.mapsUrl || '#',
      aboutImg: { src: SG_IMG.land, alt: (x.alt && x.alt.land) || '' },
      serviceOptions: items.map(it => ({ id: it.id, title: it.title })),
      form: s.form, err, inv, desc,
      selectCls: s.form.service ? '' : 'is-empty',
      successCls: s.sent ? 'is-on' : '', statusText: s.sent ? (f.success || '') : '',
      sending: !!s.sending, sent: !!s.sent, notSent: !s.sent,
      submitLabel: s.sending ? f.sending : f.submit,
      menuOpen: !!s.menuOpen, menuExpanded: s.menuOpen ? 'true' : 'false',
      waOpen: !!s.waOpen, waExpanded: s.waOpen ? 'true' : 'false',
      svcLeave: this.svcLeave,
      setRoot: this.setRoot, setMain: this.setMain, setTop: this.setTop, setServices: this.setServices, setAbout: this.setAbout, setContact: this.setContact,
      setMenuBtn: this.setMenuBtn, setMenuClose: this.setMenuClose, setFab: this.setFab, setWaClose: this.setWaClose, setSuccess: this.setSuccess,
      refName: this.refName, refEmail: this.refEmail, refPhone: this.refPhone, refService: this.refService, refMessage: this.refMessage,
      toggleLang: this.toggleLang, goHome: this.goHome, goContact: this.goContact, skip: this.skip,
      onProgEnd: this.onProgEnd,
      swipeDown: this.swipeDown, swipeMove: this.swipeMove, swipeUp: this.swipeUp, swipeCancel: this.swipeCancel, swipeClick: this.swipeClick, swipeNoDrag: this.swipeNoDrag,
      openMenu: this.openMenu, closeMenu: this.closeMenu, openWa: this.openWa, toggleWa: this.toggleWa, fabKey: this.fabKey, closeWa: this.closeWa, menuKey: this.menuKey, waKey: this.waKey,
      onName: this.onName, onEmail: this.onEmail, onPhone: this.onPhone, onService: this.onService, onMessage: this.onMessage,
      submit: this.submit, again: this.again
    };
  }
}
return Component;
});
</script>
