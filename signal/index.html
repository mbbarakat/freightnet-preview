<style>
body{margin:0;background:#0A0D1C}

/* ============ 1. TOKENS ============ */
.sg-root{
  --bg:#0A0D1C; --bg-2:#11152A; --bg-3:#1A1F38;
  --line:#272D4A; --line-2:#3A4166; --field:#626A96;
  --text:#F2F2F5; --soft:#D3D6E2; --muted:#A3A8BD;
  --red:#C7354A; --red-h:#AE2C40; --red-t:#F0687A; --ink:#0A0D1C;
  --navy:#373D74; --crimson:#A2303C;
  --f-display:"Archivo Black","Archivo",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-brand:"Montserrat","Archivo",sans-serif;
  --f-code:"Archivo Black","Archivo",system-ui,sans-serif;
  --f-ar:"Cairo","Archivo",system-ui,sans-serif;
  --gutter:clamp(16px,4.4cqi,64px);
  --maxw:1312px;
  --head-h:76px;
  --sg-dir:1;
  container:sg / inline-size;
  position:relative;
  background:var(--bg); color:var(--text);
  font:400 16px/1.6 var(--f-body);
  overflow-x:clip;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
.sg-root[dir="rtl"]{
  --f-display:"Noto Kufi Arabic","Cairo",system-ui,sans-serif;
  --f-body:"Cairo",system-ui,sans-serif;
  --sg-dir:-1;
  line-height:1.75;
}
:where(.sg-root) *,:where(.sg-root) *::before,:where(.sg-root) *::after{box-sizing:border-box}
:where(.sg-root) :where(img){display:block;max-width:100%}
:where(.sg-root) :where(h1,h2,h3,p,ul,ol,dl,dd,figure){margin:0}
:where(.sg-root) :where(ul,ol){padding:0;list-style:none}
:where(.sg-root) :where(a){color:inherit}
:where(.sg-root) :where(button,input,select,textarea){font:inherit;color:inherit}
:where(.sg-root) :where(button,a,select,input,textarea,label){touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.sg-root :focus-visible{outline:2px solid var(--text);outline-offset:3px}
.sg-root [tabindex="-1"]:focus{outline:none}
.sg-vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.sg-pin{unicode-bidi:plaintext;direction:ltr;overflow-wrap:anywhere}
.sg-ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.sg-ico{width:20px;height:20px;flex:none;display:block}
.sg-ico--sm{width:16px;height:16px}
.sg-root[dir="rtl"] .sg-flip{transform:scaleX(-1)}
.sg-wrap{width:100%;max-width:calc(var(--maxw) + 2 * var(--gutter));margin-inline:auto;padding-inline:var(--gutter)}

/* type scale */
.sg-mono{font-family:var(--f-mono);font-weight:500;font-size:12px;line-height:1.4;letter-spacing:.14em;text-transform:uppercase}
.sg-eyebrow{font-family:var(--f-mono);font-weight:500;font-size:12px;line-height:1.4;letter-spacing:.16em;text-transform:uppercase;color:var(--text)}
.sg-root[dir="rtl"] .sg-eyebrow{font-family:var(--f-ar);font-weight:600;font-size:15px;letter-spacing:0;text-transform:none}
.sg-h2{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,5.6cqi,82px);line-height:.92;letter-spacing:-.018em;text-transform:uppercase;text-wrap:balance}
.sg-root[dir="rtl"] .sg-h2{font-weight:800;font-size:clamp(30px,4.6cqi,66px);line-height:1.32;letter-spacing:0;text-transform:none}
.sg-h3{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,1.9cqi,26px);line-height:1.02;letter-spacing:-.005em;text-transform:uppercase}
.sg-root[dir="rtl"] .sg-h3{font-weight:800;font-size:clamp(19px,1.7cqi,23px);line-height:1.45;letter-spacing:0;text-transform:none}
.sg-lede{font-size:clamp(17px,1.45cqi,20px);line-height:1.55;color:var(--soft);max-width:44ch}
.sg-root[dir="rtl"] .sg-lede{line-height:1.8}
/* Arabic never takes case transforms or tracking */
.sg-root[dir="rtl"] :is(.sg-row__title,.sg-label,.sg-fact__value,.sg-door__name,.sg-strip__in,.sg-footer__h,.sg-mission__label,.sg-manifest__head,.sg-viewer__cap,.sg-bill__label,.sg-hero__label > div,.sg-chip,.sg-sheet__title,.sg-cta__meta,.sg-mono,.sg-success__text,.sg-wa__title,.sg-sheet__label,.sg-nav__link,.sg-menu-btn,.sg-fab,.sg-btn,.sg-top){text-transform:none;letter-spacing:0}

/* corner brackets + crosshair (used sparingly) */
.sg-frame{position:relative}
.sg-frame::after{content:"";position:absolute;inset:-7px;pointer-events:none;--c:var(--red-t);
  background:
    linear-gradient(var(--c),var(--c)) 0 0/14px 1px no-repeat,
    linear-gradient(var(--c),var(--c)) 0 0/1px 14px no-repeat,
    linear-gradient(var(--c),var(--c)) 100% 0/14px 1px no-repeat,
    linear-gradient(var(--c),var(--c)) 100% 0/1px 14px no-repeat,
    linear-gradient(var(--c),var(--c)) 0 100%/14px 1px no-repeat,
    linear-gradient(var(--c),var(--c)) 0 100%/1px 14px no-repeat,
    linear-gradient(var(--c),var(--c)) 100% 100%/14px 1px no-repeat,
    linear-gradient(var(--c),var(--c)) 100% 100%/1px 14px no-repeat}
.sg-plus{position:absolute;width:15px;height:15px;pointer-events:none;--c:rgba(242,242,245,.55);
  background:linear-gradient(var(--c),var(--c)) center/15px 1px no-repeat,linear-gradient(var(--c),var(--c)) center/1px 15px no-repeat}

/* buttons */
.sg-btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 24px;border:1px solid transparent;border-radius:0;
  font:600 14px/1.1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;white-space:nowrap;cursor:pointer;
  transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .12s ease}
.sg-btn:active{transform:scale(.98)}
.sg-btn--red{background:var(--red);color:#fff}
.sg-btn--red:hover{background:var(--red-h)}
.sg-btn--ghost{background:var(--bg);color:var(--text);border-color:#8C92AD}
.sg-btn--ghost:hover{background:var(--bg-3);border-color:var(--text)}
.sg-btn--ink{background:var(--ink);color:#fff}
.sg-btn--ink:hover{background:#262C4D}
.sg-btn .sg-ico{transition:transform .15s ease}
.sg-btn:hover .sg-ico--go{transform:translateX(3px)}
.sg-root[dir="rtl"] .sg-btn:hover .sg-ico--go{transform:scaleX(-1) translateX(3px)}
.sg-root[dir="rtl"] .sg-btn{font-family:var(--f-ar);font-size:15px;font-weight:700;letter-spacing:0;text-transform:none}

/* ============ 2. SKIP + STRIP + HEADER ============ */
.sg-skip{position:absolute;inset-inline-start:12px;top:12px;z-index:200;transform:translateY(-200%);background:var(--text);color:var(--ink);padding:12px 18px;font-weight:700;text-decoration:none}
.sg-skip:focus,.sg-skip:focus-visible{transform:none;outline:2px solid var(--red-t);outline-offset:2px}

.sg-strip{border-bottom:1px solid var(--line);color:var(--muted);background:var(--bg)}
.sg-strip__in{display:flex;align-items:center;gap:18px;min-height:36px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.sg-strip__k{color:var(--red-t)}
.sg-strip__k{display:inline-flex}
.sg-strip__k .sg-ico{width:14px;height:14px}
.sg-strip__sep{width:24px;height:1px;background:var(--line-2)}
.sg-strip__push{flex:1}
.sg-strip__nums{display:flex;gap:18px}
.sg-strip__call{display:inline-flex;align-items:center;gap:10px;padding-inline-start:18px;border-inline-start:1px solid var(--line-2)}
.sg-root[dir="rtl"] .sg-strip__ar{font-family:var(--f-ar);font-size:13px;letter-spacing:0}

.sg-header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.sg-header__in{display:flex;align-items:center;gap:20px;min-height:var(--head-h)}
/* brand lockup: emblem at the inline-start, the two-line wordmark beside it (the emblem is never mirrored; the words stay Latin and lean toward the emblem in both directions) */
.sg-brand{--em:48px;display:inline-flex;align-items:center;gap:calc(var(--em) * .25);min-height:48px;padding:4px 10px;margin-inline-start:-10px;color:#fff;text-decoration:none;flex:none;transition:background-color .15s ease,transform .12s ease}
.sg-brand__emblem{flex:none;display:block;height:var(--em);width:auto;aspect-ratio:351/323;max-width:none}
.sg-brand__words{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:5px;min-width:0;padding-top:1px}
.sg-brand__name,.sg-brand__tag{direction:ltr;unicode-bidi:isolate}
.sg-brand__name{font-family:var(--f-brand);font-weight:800;font-size:17px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.sg-brand__tag{font-family:var(--f-brand);font-weight:700;font-size:9.5px;line-height:1;letter-spacing:.18em;color:var(--red-t);white-space:nowrap}
/* footer lockup: larger, and fluid so it always fits its column (4-up footer from 1024, 2-up below) */
.sg-brand--lg{--em:clamp(60px,5.3cqi,76px);gap:clamp(14px,1.25cqi,18px)}
.sg-brand--lg .sg-brand__words{gap:clamp(6px,.55cqi,8px)}
.sg-brand--lg .sg-brand__name{font-size:clamp(18px,1.6cqi,23px)}
.sg-brand--lg .sg-brand__tag{font-size:clamp(10.5px,.87cqi,12.5px)}
.sg-brand:hover{background:var(--bg-2)}
.sg-brand:active{transform:scale(.98)}
.sg-nav{display:flex;align-items:center;gap:2px;margin-inline-start:auto}
.sg-nav__link{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;text-decoration:none;color:var(--text);
  font:600 13px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;transition:background-color .15s ease,transform .12s ease}
.sg-nav__link:hover{background:var(--bg-2)}
.sg-nav__link:active{transform:scale(.98)}
.sg-root[dir="rtl"] .sg-nav__link{font-family:var(--f-ar);font-size:15px;letter-spacing:0;text-transform:none}
.sg-header__act{display:flex;align-items:center;gap:10px}
.sg-lang{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:44px;padding:0 14px;background:transparent;border:1px solid var(--line-2);cursor:pointer;color:var(--text);transition:background-color .15s ease,border-color .15s ease}
.sg-lang:hover{background:var(--bg-2);border-color:#5A6390}
.sg-lang:active{transform:scale(.98)}
.sg-lang__t{font:600 15px/1 var(--f-body)}
.sg-lang__t:lang(ar){font-family:var(--f-ar);font-weight:700;font-size:16px}
.sg-lang__t:lang(en){font-family:"Archivo",sans-serif;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.sg-header__cta{min-height:44px;padding:0 18px}
.sg-menu-btn{display:none;align-items:center;gap:10px;min-height:44px;min-width:44px;padding:0 14px;background:var(--bg);border:1px solid var(--line-2);color:var(--text);cursor:pointer;
  font:600 13px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;transition:background-color .15s ease}
.sg-menu-btn:hover{background:var(--bg-2)}
.sg-menu-btn:active{transform:scale(.98)}
.sg-root[dir="rtl"] .sg-menu-btn{font-family:var(--f-ar);font-size:15px;letter-spacing:0;text-transform:none}

/* ============ 3. HERO ============ */
/* the whole hero is the swipe surface: sideways drags change the slide, vertical ones still scroll the page (pinch zoom kept) */
.sg-hero{position:relative;isolation:isolate;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;min-height:clamp(620px,56cqi,820px);touch-action:pan-y pinch-zoom}
.sg-hero.is-dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
/* photo gallery. The stage is left-to-right (mirrored with scale in Arabic), so "forward" is always +x here: the next photo waits at +100%, comes in toward 0,
   and the one it replaces leaves toward -100% (on screen that is from the right in English and from the left in Arabic, the way a swipe to "next" goes).
   The logic drives three things: --sg-x (stage px) moves the current photo with the finger, 1:1; --sg-in is the side the neighbour waits on (+1 or -1);
   --sg-out is the side a photo that is leaving or returning settles to. Hidden photos sit on --sg-in with no transition, so they can be placed instantly */
.sg-hero__stage{position:absolute;inset:0;z-index:-3;direction:ltr;overflow:hidden}
.sg-root[dir="rtl"] .sg-hero__stage{scale:-1 1}
.sg-hero{--sg-in:1;--sg-out:-1}
.sg-hero.is-in-l{--sg-in:-1}
.sg-hero.is-out-r{--sg-out:1}
.sg-slide__media{position:absolute;inset:0;visibility:hidden;transform:translateX(calc(var(--sg-in) * 100%))}
.sg-slide__media.is-active,.sg-slide__media.is-settling{visibility:visible;transition:transform .32s cubic-bezier(.22,.61,.36,1)}
.sg-slide__media.is-active{transform:translateX(var(--sg-x,0px))}
.sg-slide__media.is-settling{transform:translateX(calc(var(--sg-out) * 100%))}
.sg-hero.is-dragging .sg-slide__media{visibility:visible;transition:none}
.sg-hero.is-dragging .sg-slide__media:not(.is-active){transform:translateX(calc(var(--sg-x,0px) + var(--sg-in) * 100%))}
.sg-slide__img{width:100%;height:100%;object-fit:cover}
/* slide 2 is a 1200 px photo: on desktop it fills only the photo side (the text side sits under the solid scrim), so it never upscales; its frame still spans the stage, so it slides a full width */
.sg-slide__media--b .sg-slide__img{position:absolute;top:0;left:36%;width:64%;-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,0),#000 24%);mask-image:linear-gradient(90deg,rgba(0,0,0,0),#000 24%)}
.sg-hero__scrim{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(10,13,28,.96) 0%,rgba(10,13,28,.92) 30%,rgba(10,13,28,.8) 46%,rgba(10,13,28,.38) 62%,rgba(10,13,28,.06) 80%,rgba(10,13,28,0) 100%),
    linear-gradient(0deg,rgba(10,13,28,.94) 0%,rgba(10,13,28,.55) 16%,rgba(10,13,28,0) 40%)}
.sg-root[dir="rtl"] .sg-hero__scrim{background:
    linear-gradient(270deg,rgba(10,13,28,.96) 0%,rgba(10,13,28,.92) 30%,rgba(10,13,28,.8) 46%,rgba(10,13,28,.38) 62%,rgba(10,13,28,.06) 80%,rgba(10,13,28,0) 100%),
    linear-gradient(0deg,rgba(10,13,28,.94) 0%,rgba(10,13,28,.55) 16%,rgba(10,13,28,0) 40%)}
.sg-hero__inner{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-top:clamp(64px,7cqi,120px)}
/* during a sideways drag the photo tracks the finger; the copy drifts a little the same way and fades as the next photo comes in (the logic sets --sg-dx and --sg-do),
   and springs back if the drag is let go short. When the slide changes, the new copy comes in from the side its photo came from (--sg-in, made physical with --sg-dir) */
.sg-hero__stack{display:grid;max-width:min(800px,62%);transform:translateX(var(--sg-dx,0px));opacity:var(--sg-do,1);transition:transform .3s cubic-bezier(.2,.7,.2,1),opacity .3s ease}
.sg-hero.is-dragging .sg-hero__stack{transition:none}
.sg-slide{grid-area:1/1;align-self:end;visibility:hidden;min-width:0}
.sg-slide.is-active{visibility:visible}
.sg-slide:not(.is-active) .sg-slide__copy{opacity:0}
.sg-hero.has-moved .sg-slide.is-active .sg-slide__copy > *{animation:sg-copy-in .42s cubic-bezier(.2,.7,.2,1) both}
.sg-hero.has-moved .sg-slide.is-active .sg-slide__copy > :nth-child(2){animation-delay:.05s}
.sg-hero.has-moved .sg-slide.is-active .sg-slide__copy > :nth-child(3){animation-delay:.1s}
.sg-slide__eyebrow{display:flex;align-items:center;gap:12px;color:var(--text);margin-bottom:26px}
.sg-slide__eyebrow::before{content:"";width:10px;height:10px;background:var(--red);flex:none}
.sg-slide__title{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,7.2cqi,108px);line-height:.9;letter-spacing:-.025em;text-transform:uppercase;text-wrap:balance;color:#fff}
.sg-root[dir="rtl"] .sg-slide__title{font-weight:800;font-size:clamp(40px,6.9cqi,104px);line-height:1.22;letter-spacing:0;text-transform:none}
/* a long slide title (clearly longer than the shortest one, see renderVals) is set smaller, sized per breakpoint (here and in section 15) so that, with the
   balanced wrap, it falls into whole phrases with no word left alone at the end, and its block is never taller than slide 1's (as tall wherever the
   width allows): the hero keeps its height, and the buttons their place, on every slide. Slide 1 keeps its own size and lines.
   The lines are fixed by a measure in em (10.6em), set for the current slide 2 title: it is wider than its longest line ("every industry", 9.8em;
   "والخدمات اللوجستية", 10.2em) and narrower than the joins to avoid ("cargo & logistics", 11.5em; "حلول الشحن والخدمات", 11.2em). If that title
   changes, check its lines again.
   English: four lines, "cargo & / logistics / solutions for / every industry", where slide 1 takes three (up to 530 px and from 641 px), at three
   quarters of slide 1's size; three, "cargo & logistics / solutions for / every industry", at 531-640 px, where slide 1 takes two (two thirds of its size).
   Arabic: always three lines, "حلول الشحن / والخدمات اللوجستية / لكل القطاعات", so the noun and its adjective stay on one line; where slide 1
   takes two lines (472-970 px) at two thirds of its size, so the two blocks are the same height */
.sg-slide.is-long .sg-slide__title{font-size:min(5.4cqi,81px);max-width:10.6em}
.sg-root[dir="rtl"] .sg-slide.is-long .sg-slide__title{font-size:clamp(40px,5.3cqi,75px)}
.sg-slide__text{margin-top:26px;max-width:34em;font-size:clamp(17px,1.4cqi,20px);line-height:1.55;color:var(--soft);text-wrap:pretty}
.sg-root[dir="rtl"] .sg-slide__text{line-height:1.85}
.sg-hero__cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
/* slide dots: one numbered tab per slide at the inline start (the floating WhatsApp button keeps to the inline end, so the two never meet).
   Desktop and tablet: on the bar at the foot of the full-bleed photo. Phone: on the photo itself, just above the slide's eyebrow (see the 640 px block).
   Current slide: white number and a red bar. While the slideshow runs, that bar fills over the slide's time (the fill's end is what advances it);
   once stopped (a swipe or a dot press, or reduced motion) it stays full */
.sg-hero__bar{position:relative;display:flex;align-items:center;margin-top:clamp(40px,4.6cqi,72px);padding-block:10px 16px;border-top:1px solid rgba(242,242,245,.2)}
.sg-dots{display:flex;gap:4px;margin-inline-start:-8px}
.sg-dot{display:flex;flex-direction:column;justify-content:center;gap:10px;width:80px;height:48px;padding:0 8px;background:transparent;border:0;color:var(--muted);cursor:pointer;text-align:start;transition:color .15s ease,transform .12s ease}
.sg-dot:active{transform:scale(.97)}
.sg-dot__no{display:block;font-family:var(--f-mono);font-weight:500;font-size:12px;line-height:1;letter-spacing:.16em}
.sg-dot__track{position:relative;display:block;height:3px;background:rgba(242,242,245,.24);overflow:hidden;transition:background-color .15s ease}
.sg-dot__fill{position:absolute;inset:0;background:var(--red);transform:scaleX(0);transform-origin:left center}
.sg-root[dir="rtl"] .sg-dot__fill{transform-origin:right center}
.sg-dot:hover{color:var(--text)}
.sg-dot:hover .sg-dot__track{background:rgba(242,242,245,.5)}
.sg-dot.is-active{color:#fff}
.sg-dot.is-active .sg-dot__track{background:rgba(242,242,245,.4)}
.sg-dot.is-active .sg-dot__fill{transform:none}
.sg-dot.is-active .sg-dot__fill.sg-anim-a{animation:sg-prog-a 7s linear both}
.sg-dot.is-active .sg-dot__fill.sg-anim-b{animation:sg-prog-b 7s linear both}
/* the fill holds (and with it the slideshow) during a drag, while the menu or the WhatsApp chooser is open (no slide change behind them), and while keyboard focus
   is inside the hero (a tap or click, which also leaves focus on a control, does not hold it). :has() gets its own rule, so a browser without it drops only that one */
.sg-hero.is-dragging .sg-dot__fill{animation-play-state:paused!important}
.sg-root.is-locked .sg-dot__fill{animation-play-state:paused!important}
.sg-hero:has(:focus-visible) .sg-dot__fill{animation-play-state:paused!important}
.sg-hero__label{position:absolute;inset-inline-end:var(--gutter);bottom:clamp(120px,10cqi,150px);z-index:1;min-width:250px;max-width:min(380px,30cqi);background:rgba(10,13,28,.92);border:1px solid var(--line-2);padding:16px 18px}
.sg-hero__label > div{display:flex;justify-content:space-between;gap:28px;padding-block:7px;border-bottom:1px dashed var(--line-2);font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.sg-hero__label > div:last-child{border-bottom:0}
.sg-hero__label dt{color:var(--muted);white-space:nowrap}
.sg-hero__label dd{color:#fff;text-align:end}
.sg-root[dir="rtl"] .sg-hero__label > div{font-family:var(--f-ar);font-size:13px;letter-spacing:0}

/* ============ 4. FACTS ============ */
.sg-facts{border-bottom:1px solid var(--line);background:var(--bg)}
.sg-facts__list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.sg-fact{display:flex;flex-direction:column;gap:12px;min-width:0;padding:34px 36px 38px;border-inline-start:1px solid var(--line)}
.sg-fact:first-child{border-inline-start:0;padding-inline-start:0}
.sg-fact__value{font-family:var(--f-display);font-size:clamp(30px,3.5cqi,50px);line-height:.95;letter-spacing:-.015em;text-transform:uppercase;color:#fff;text-wrap:balance}
.sg-root[dir="rtl"] .sg-fact__value{font-weight:800;font-size:clamp(26px,2.9cqi,40px);line-height:1.35;letter-spacing:0}
.sg-fact__label{color:var(--muted);font-size:15px;line-height:1.5;max-width:30ch}

/* ============ 5. SECTIONS COMMON ============ */
.sg-section{padding-block:clamp(72px,9cqi,136px);scroll-margin-top:var(--head-h)}
.sg-sechead{display:flex;align-items:center;gap:16px;min-height:44px;margin-bottom:clamp(28px,3.6cqi,52px);border-top:1px solid var(--line);position:relative}
.sg-sechead .sg-plus{top:-8px;inset-inline-start:-7px;--c:var(--red-t)}
.sg-sechead__no{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--red-t);padding-inline-start:16px;white-space:nowrap}
.sg-intro{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(24px,4cqi,64px);align-items:end;margin-bottom:clamp(40px,5cqi,80px)}
.sg-intro .sg-lede{justify-self:end}
.sg-intro--solo{grid-template-columns:minmax(0,10fr) minmax(0,2fr)}

/* ============ 6. SERVICES (manifest) ============ */
.sg-manifest{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(32px,4.4cqi,72px);align-items:stretch}
.sg-manifest__head{display:grid;grid-template-columns:80px minmax(0,1fr) 92px 44px;gap:20px;padding:0 14px 12px;border-bottom:1px solid var(--line-2);
  font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sg-root[dir="rtl"] .sg-manifest__head{font-family:var(--f-ar);font-size:13px;letter-spacing:0}
.sg-row{border-bottom:1px solid var(--line)}
.sg-row__h{font:inherit}
.sg-row__btn{display:grid;grid-template-columns:80px minmax(0,1fr) 92px 44px;gap:20px;align-items:center;width:100%;min-height:92px;padding:22px 14px;
  background:transparent;border:0;text-align:start;cursor:pointer;color:var(--text);transition:background-color .15s ease,transform .12s ease}
.sg-row__btn:hover{background:var(--bg-2)}
.sg-row__btn:active{transform:scale(.99)}
.sg-row.is-open .sg-row__btn{background:var(--bg-2)}
.sg-row.is-open .sg-row__btn:hover{background:var(--bg-3)}
.sg-row__code{justify-self:start;font-family:var(--f-mono);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--red-t);padding:6px 9px;border:1px solid rgba(240,104,122,.45);direction:ltr;white-space:nowrap}
.sg-row.is-open .sg-row__code{background:var(--red);border-color:var(--red);color:#fff}
.sg-row__main{min-width:0;display:flex;flex-direction:column;gap:8px}
.sg-row__title{font-family:var(--f-display);font-size:clamp(20px,2cqi,28px);line-height:1;letter-spacing:-.01em;text-transform:uppercase}
.sg-root[dir="rtl"] .sg-row__title{font-weight:800;font-size:clamp(19px,1.75cqi,24px);line-height:1.4;letter-spacing:0}
.sg-row__short{font-size:15px;line-height:1.5;color:var(--muted);text-wrap:pretty}
.sg-row__no{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--muted);direction:ltr;justify-self:end;white-space:nowrap}
.sg-row__icon{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line-2);transition:background-color .15s ease,border-color .15s ease}
.sg-row__icon svg{transition:transform .2s ease}
.sg-row__btn:hover .sg-row__icon{border-color:#5A6390}
.sg-row.is-open .sg-row__icon{border-color:var(--text)}
.sg-row.is-open .sg-row__icon svg{transform:rotate(45deg)}
.sg-row__panel{padding:6px 14px 34px;padding-inline-start:calc(14px + 80px + 20px);background:var(--bg-2)}
.sg-root.sg-touched .sg-row__panel:not([hidden]){animation:sg-open .2s ease-out both}
.sg-row__panel[hidden]{display:none}
.sg-row__media{display:none}
.sg-row__dtitle{font-weight:700;font-size:19px;line-height:1.35;color:#fff;margin-bottom:10px}
.sg-row__dtext{color:var(--soft);font-size:16px;line-height:1.65;max-width:58ch;text-wrap:pretty}
.sg-root[dir="rtl"] .sg-row__dtext{line-height:1.85}
.sg-row__cta{margin-top:22px}
.sg-row__cta .sg-btn{min-height:48px}
/* the photo column stretches to the full height of the table, so the photo always sits beside the row that changes it (a sticky panel never moves in a full-height artboard) */
.sg-viewer{display:flex;flex-direction:column;min-width:0}
.sg-viewer__frame{position:relative;flex:1;min-height:clamp(440px,42cqi,620px);background:var(--bg-2)}
.sg-viewer__clip{position:absolute;inset:0;overflow:hidden}
.sg-viewer__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity .35s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.sg-viewer__img.is-on{opacity:1;transform:none}
.sg-viewer__shade{position:absolute;inset:auto 0 0 0;height:48%;background:linear-gradient(0deg,rgba(10,13,28,.92),rgba(10,13,28,0))}
.sg-viewer__code{position:absolute;inset-inline-start:24px;bottom:18px;font-family:var(--f-code);font-size:clamp(64px,8cqi,124px);line-height:.8;letter-spacing:-.03em;color:#fff;unicode-bidi:isolate}
.sg-viewer__cap{display:flex;justify-content:space-between;gap:16px;padding-top:16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sg-viewer__cap b{color:var(--text);font-weight:500}
.sg-root[dir="rtl"] .sg-viewer__cap{font-family:var(--f-ar);font-size:13px;letter-spacing:0}

/* ============ 7. OCEAN: FCL / LCL ============ */
.sg-doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2cqi,28px)}
.sg-door{display:flex;flex-direction:column;min-width:0;background:var(--bg-2);border:1px solid var(--line)}
.sg-door__face{position:relative;aspect-ratio:16/9;overflow:hidden;border-bottom:1px solid var(--line);container-type:inline-size}
/* FCL: a closed container door. The locking bars sit at 7 / 40 / 60 / 93 % so the stencil gets a clear zone between bars 1 and 2 */
.sg-door--fcl .sg-door__face{background-color:var(--crimson);
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 12px,rgba(255,255,255,.10) 12px 14px,rgba(0,0,0,.22) 14px 19px,rgba(0,0,0,0) 19px 30px)}
.sg-door--fcl .sg-door__face::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 9%,rgba(0,0,0,0) 91%,rgba(0,0,0,.4)),
    linear-gradient(90deg,rgba(0,0,0,0) calc(50% - 2px),rgba(0,0,0,.55) calc(50% - 2px),rgba(0,0,0,.55) calc(50% + 1px),rgba(255,255,255,.12) calc(50% + 1px),rgba(255,255,255,.12) calc(50% + 2px),rgba(0,0,0,0) calc(50% + 2px))}
.sg-door__bar{position:absolute;top:7%;bottom:7%;width:7px;background:linear-gradient(90deg,#3a0d14,#d9d4d6 35%,#8c8487 70%,#2a0a10)}
.sg-door__bar::before,.sg-door__bar::after{content:"";position:absolute;inset-inline:-5px;height:9px;background:#2a0a10;border:1px solid rgba(255,255,255,.25)}
.sg-door__bar::before{top:10%}
.sg-door__bar::after{bottom:10%}
.sg-door__bar i{position:absolute;top:58%;inset-inline-start:3px;width:clamp(16px,4.6cqi,30px);height:6px;background:linear-gradient(180deg,#d9d4d6,#6b6366);border-radius:3px}
.sg-door__bar--1{inset-inline-start:7%}.sg-door__bar--2{inset-inline-start:40%}.sg-door__bar--3{inset-inline-start:calc(60% - 7px)}.sg-door__bar--4{inset-inline-start:calc(93% - 7px)}
.sg-door__stencil{position:absolute;z-index:1;top:15%;inset-inline-start:calc(11.4% + 3px);font-family:var(--f-code);font-size:11.8cqi;line-height:.85;letter-spacing:-.02em;color:#fff;unicode-bidi:isolate;text-shadow:0 1px 0 rgba(0,0,0,.25)}
/* LCL: the same container seen from the rear with its doors open: crimson end frame, a dark hold in perspective, mixed parcels on the floor */
.sg-door--lcl .sg-door__face{background:#141936}
.sg-door--lcl .sg-door__stencil{inset-inline-start:calc(6% + 6.5cqi)}
.sg-box{position:absolute;inset:7% 6% 9%;border:solid var(--crimson);border-width:2.4cqi 2.4cqi 2cqi;background:#070A16}
.sg-box::after{content:"";position:absolute;inset:-2.4cqi -2.4cqi -2cqi;pointer-events:none;--k:#2B0B12;
  background:
    linear-gradient(var(--k),var(--k)) 0 0/3.6cqi 3.6cqi no-repeat,
    linear-gradient(var(--k),var(--k)) 100% 0/3.6cqi 3.6cqi no-repeat,
    linear-gradient(var(--k),var(--k)) 0 100%/3.6cqi 3.2cqi no-repeat,
    linear-gradient(var(--k),var(--k)) 100% 100%/3.6cqi 3.2cqi no-repeat}
.sg-box__w{position:absolute;inset:0}
.sg-box__w--top{clip-path:polygon(0 0,100% 0,78% 24%,22% 24%);background:#090C1C}
.sg-box__w--l,.sg-box__w--r{background-color:#10142C;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 7px,rgba(255,255,255,.05) 7px 8px,rgba(0,0,0,.25) 8px 10px)}
.sg-box__w--l{clip-path:polygon(0 0,22% 24%,22% 64%,0 100%)}
.sg-box__w--r{clip-path:polygon(100% 0,78% 24%,78% 64%,100% 100%)}
.sg-box__w--floor{clip-path:polygon(0 100%,100% 100%,78% 64%,22% 64%);background-color:#1D2348;background-image:repeating-linear-gradient(180deg,rgba(255,255,255,0) 0 9px,rgba(255,255,255,.05) 9px 10px)}
.sg-box__w--back{inset:24% 22% 36%;background:#0C1024}
.sg-hold{position:absolute;inset:auto 5% 0;height:56%;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(4,1fr);gap:3px}
.sg-hold span{display:block;border:1px solid rgba(0,0,0,.5);background-color:var(--navy);box-shadow:inset 0 3px 0 rgba(255,255,255,.14),inset 0 -4px 0 rgba(0,0,0,.22);
  background-image:linear-gradient(90deg,rgba(255,255,255,0) 44%,rgba(255,255,255,.16) 44% 56%,rgba(255,255,255,0) 56%)}
.sg-hold span:nth-child(1){grid-column:1/4;grid-row:2/5}
.sg-hold span:nth-child(2){grid-column:1/3;grid-row:1/2;background-color:#5B6390}
.sg-hold span:nth-child(3){grid-column:4/8;grid-row:3/5;background-color:var(--crimson)}
.sg-hold span:nth-child(4){grid-column:4/7;grid-row:2/3;background-color:#2C3262}
.sg-hold span:nth-child(5){grid-column:8/10;grid-row:3/5;background-color:#8C93B8}
.sg-hold span:nth-child(6){grid-column:10/13;grid-row:2/5;background-color:#4A5280}
.sg-hold span:nth-child(7){grid-column:8/10;grid-row:2/3;background-color:#262B57}
.sg-door__body{position:relative;padding:clamp(22px,2.4cqi,34px);display:flex;flex-direction:column;gap:12px;flex:1}
.sg-door__tag{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;color:var(--red-t)}
.sg-door__tag::after{content:"";flex:1;max-width:80px;height:1px;background:var(--line-2)}
.sg-door__name{font-family:var(--f-display);font-size:clamp(24px,2.5cqi,36px);line-height:1;letter-spacing:-.012em;text-transform:uppercase;color:#fff;text-wrap:balance}
.sg-root[dir="rtl"] .sg-door__name{font-weight:800;font-size:clamp(22px,2.2cqi,30px);line-height:1.4;letter-spacing:0}
.sg-door__text{color:var(--soft);max-width:52ch}
.sg-dedicated{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(18px,2.4cqi,32px);align-items:start;margin-top:clamp(16px,2cqi,28px);padding:clamp(22px,2.6cqi,36px);border:1px solid var(--line);background:var(--bg)}
.sg-dedicated__ico{display:grid;place-items:center;width:56px;height:56px;background:var(--red);color:#fff}
.sg-dedicated__ico .sg-ico{width:26px;height:26px}
.sg-dedicated__in{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(12px,3cqi,48px);align-items:baseline}
.sg-dedicated__text{color:var(--soft)}

/* ============ 8. VALUES ============ */
.sg-values{background:var(--bg-2);border-block:1px solid var(--line)}
.sg-values .sg-sechead{border-top-color:var(--line-2)}
.sg-vlist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-2)}
.sg-value{display:flex;flex-direction:column;min-width:0;padding:30px 28px 10px;border-inline-start:1px solid var(--line-2)}
.sg-value:first-child{border-inline-start:0;padding-inline-start:0}
.sg-value__no{display:block;font-family:var(--f-code);font-size:clamp(84px,9.6cqi,150px);line-height:.78;letter-spacing:-.04em;color:var(--red);direction:ltr;margin-bottom:clamp(28px,3cqi,44px);align-self:flex-start}
.sg-value__title{margin-bottom:12px}
.sg-value__body{color:var(--soft);font-size:15.5px}

/* ============ 9. ABOUT ============ */
.sg-about__grid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);grid-template-areas:"title title" "media copy";column-gap:clamp(36px,5cqi,88px);align-items:start}
.sg-about__title{grid-area:title;max-width:14ch;margin-bottom:clamp(36px,4.4cqi,64px)}
.sg-about__media{grid-area:media;position:relative}
.sg-about__clip{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--bg-2)}
.sg-about__clip img{width:100%;height:100%;object-fit:cover;object-position:60% 50%}
.sg-about__copy{grid-area:copy;display:flex;flex-direction:column;gap:clamp(28px,3cqi,44px)}
.sg-about__body{font-size:clamp(18px,1.65cqi,23px);line-height:1.6;color:var(--text);max-width:40em}
.sg-root[dir="rtl"] .sg-about__body{line-height:1.9}
.sg-mission{position:relative;padding:clamp(26px,3cqi,44px);background:var(--bg-2);border:1px solid var(--line)}
.sg-mission__label{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--red-t);margin-bottom:20px}
.sg-mission__label::before{content:"";width:10px;height:10px;background:var(--red)}
.sg-root[dir="rtl"] .sg-mission__label{font-family:var(--f-ar);font-weight:700;font-size:16px;letter-spacing:0}
.sg-mission__text{color:var(--soft);font-size:16.5px;line-height:1.7}
.sg-root[dir="rtl"] .sg-mission__text{line-height:1.9}

/* ============ 10. CTA BAND ============ */
/* signal-crimson band: black display title (3.7:1, large text), white body and meta (5.2:1) */
.sg-cta{position:relative;background:var(--red);color:var(--ink);overflow:hidden}
.sg-cta :focus-visible{outline-color:var(--ink)}
.sg-cta__in{position:relative;display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:clamp(28px,4cqi,72px);align-items:end;padding-block:clamp(72px,8.4cqi,128px)}
.sg-cta__meta{position:absolute;top:22px;inset-inline:var(--gutter);display:flex;justify-content:space-between;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#fff}
.sg-root[dir="rtl"] .sg-cta__meta{font-family:var(--f-ar);font-weight:700;font-size:13px;letter-spacing:0;top:16px}
.sg-cta__title{font-family:var(--f-display);font-size:clamp(34px,5.5cqi,82px);line-height:.92;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance}
/* each sentence of the CTA title starts its own line, so a question never shares a line with the next sentence */
.sg-cta__line{display:block}
.sg-root[dir="rtl"] .sg-cta__title{font-weight:800;font-size:clamp(30px,4.5cqi,66px);line-height:1.32;letter-spacing:0;text-transform:none}
.sg-cta__body{font-size:clamp(17px,1.4cqi,19px);font-weight:500;line-height:1.55;margin-bottom:28px;color:#fff}
.sg-cta__perf{position:absolute;top:54px;inset-inline:0;height:0;border-top:2px dashed rgba(10,13,28,.42);pointer-events:none}
.sg-cta__perf::before,.sg-cta__perf::after{content:"";position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--bg)}
.sg-cta__perf::before{left:-13px}
.sg-cta__perf::after{right:-13px}

/* ============ 11. CONTACT ============ */
.sg-contact__grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,4cqi,64px);align-items:start}
.sg-bill{border:1px solid var(--line)}
.sg-bill__cell{padding:clamp(20px,2.2cqi,28px);border-bottom:1px solid var(--line)}
.sg-bill__cell:last-child{border-bottom:0}
.sg-bill__label{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sg-root[dir="rtl"] .sg-bill__label{font-family:var(--f-ar);font-weight:700;font-size:14px;letter-spacing:0}
.sg-addr{font-style:normal;font-size:17px;line-height:1.55;color:var(--text)}
/* one address line per row; a hanging indent marks a wrapped line (narrow phones) as the same line continuing, not a new one */
.sg-addr span{display:block;text-wrap:pretty;padding-inline-start:1em;text-indent:-1em}
.sg-link{display:inline-flex;align-items:center;gap:10px;min-height:44px;margin-top:10px;padding:0 12px;margin-inline-start:-12px;color:var(--red-t);text-decoration:none;font-weight:600;transition:background-color .15s ease,transform .12s ease}
.sg-link:hover{background:var(--bg-2)}
.sg-link:active,.sg-mail:active,.sg-flink:active,.sg-wa__row:active,.sg-sheet__tel:active,.sg-top:active{transform:scale(.98)}
.sg-link span{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.sg-tels{display:flex;flex-direction:column}
.sg-tel{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:12px;border-top:1px dashed var(--line-2)}
.sg-tel:first-child{border-top:0;padding-top:0}
.sg-tel__num{font-family:var(--f-mono);font-weight:500;font-size:19px;letter-spacing:.02em;color:#fff}
/* call-only row: the "call only" note takes the WhatsApp chip's slot (an invisible copy of that chip, stacked in the same grid cell, sets the width; a longer note widens the cell instead of clipping), so its Call chip lines up with the others and the row wraps exactly like them */
.sg-tel__only{display:inline-grid}
.sg-tel__only > *{grid-area:1/1}
.sg-tel__ghost{visibility:hidden}
.sg-tel__kind{display:flex;align-items:center;justify-content:center;padding:0 6px;border:1px dashed var(--line-2);font-family:var(--f-mono);font-weight:500;font-size:11px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;text-align:center;color:var(--muted);white-space:nowrap}
.sg-root[dir="rtl"] .sg-tel__kind{font-family:var(--f-ar);font-weight:600;font-size:13px;letter-spacing:0;text-transform:none}
.sg-tel__act{display:flex;gap:8px;flex-wrap:wrap}
.sg-chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line-2);background:transparent;color:var(--text);text-decoration:none;
  font:600 13px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;transition:background-color .15s ease,border-color .15s ease}
.sg-chip:hover{background:var(--bg-2);border-color:#5A6390}
.sg-chip:active{transform:scale(.98)}
.sg-chip--wa{border-color:rgba(240,104,122,.55)}
.sg-root[dir="rtl"] .sg-chip{font-family:var(--f-ar);font-size:14px;letter-spacing:0;text-transform:none}
.sg-mails{display:flex;flex-direction:column;gap:2px}
.sg-mail{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;margin-inline-start:-12px;color:var(--text);text-decoration:none;font-size:17px;transition:background-color .15s ease,transform .12s ease;max-width:calc(100% + 12px)}
.sg-mail:hover{background:var(--bg-2)}
.sg-mail .sg-ico{color:var(--red-t)}
.sg-form-wrap{position:relative;background:var(--bg-2);border:1px solid var(--line);padding:clamp(22px,3.2cqi,48px)}
.sg-form__title{margin-bottom:clamp(20px,2.4cqi,32px)}
.sg-form__grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 20px}
.sg-field{display:flex;flex-direction:column;min-width:0}
.sg-field--full{grid-column:1/-1}
.sg-label{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px;font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text)}
.sg-req{font-size:12px;letter-spacing:.1em;color:var(--muted)}
.sg-root[dir="rtl"] .sg-label{font-family:var(--f-ar);font-weight:700;font-size:15px;letter-spacing:0}
.sg-root[dir="rtl"] .sg-req{font-size:12px;letter-spacing:0;font-weight:600}
.sg-input{width:100%;min-height:52px;padding:13px 15px;background:var(--bg);border:1px solid var(--field);border-radius:0;color:var(--text);font:400 16px/1.4 var(--f-body);
  -webkit-appearance:none;appearance:none;transition:border-color .15s ease,box-shadow .15s ease,background-color .15s ease}
.sg-input:hover{border-color:#8C92AD;background:#0D1123}
.sg-input:focus,.sg-input:focus-visible{outline:none;border-color:var(--text);box-shadow:0 0 0 3px rgba(242,242,245,.28)}
.sg-input[aria-invalid="true"]{border-color:var(--red-t)}
.sg-input[aria-invalid="true"]:focus{border-color:var(--red-t);box-shadow:0 0 0 3px rgba(240,104,122,.4)}
.sg-input::placeholder{color:#7A8099}
textarea.sg-input{min-height:148px;resize:vertical}
.sg-selectbox{position:relative}
.sg-selectbox .sg-input{padding-inline-end:46px;cursor:pointer}
.sg-selectbox .sg-ico{position:absolute;top:50%;inset-inline-end:15px;margin-top:-10px;pointer-events:none;color:var(--muted)}
.sg-input.is-empty{color:var(--muted)}
.sg-input option{color:#0A0D1C;background:#fff}
.sg-err{display:flex;align-items:flex-start;gap:8px;margin-top:9px;font-size:14px;line-height:1.45;color:var(--red-t)}
.sg-err .sg-ico{margin-top:1px}
.sg-form__foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-top:28px}
.sg-btn[disabled]{opacity:.7;cursor:progress}
.sg-success{display:flex;flex-direction:column;align-items:flex-start;gap:18px;padding:clamp(8px,1cqi,16px) 0;scroll-margin-block:calc(var(--head-h) + 24px) 24px}
.sg-success:not(.is-on){position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sg-success__ico{display:grid;place-items:center;width:56px;height:56px;background:var(--red);color:#fff}
.sg-success__ico .sg-ico{width:28px;height:28px}
.sg-success__text{font-family:var(--f-display);font-size:clamp(22px,2.3cqi,32px);line-height:1.1;text-transform:uppercase;color:#fff;max-width:22em}
.sg-root[dir="rtl"] .sg-success__text{font-weight:800;line-height:1.5;text-transform:none;font-size:clamp(20px,2cqi,28px)}

/* ============ 12. FOOTER ============ */
.sg-footer{position:relative;border-top:1px solid var(--line);background:var(--bg);padding-top:clamp(56px,6cqi,96px);overflow:hidden}
.sg-footer__grid{display:grid;grid-template-columns:minmax(0,4.4fr) repeat(3,minmax(0,2.6fr));gap:clamp(28px,3.4cqi,56px)}
.sg-footer__brand .sg-brand{margin-bottom:18px}
.sg-footer__line{color:var(--muted);max-width:28ch}
.sg-footer__h{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.sg-root[dir="rtl"] .sg-footer__h{font-family:var(--f-ar);font-weight:700;font-size:14px;letter-spacing:0}
.sg-flinks{display:flex;flex-direction:column;align-items:flex-start}
.sg-flink{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;margin-inline-start:-10px;color:var(--text);text-decoration:none;transition:background-color .15s ease,transform .12s ease;max-width:calc(100% + 10px)}
.sg-flink:hover{background:var(--bg-2)}
.sg-flink .sg-ico{color:var(--red-t)}
.sg-flink--call{flex-wrap:wrap;column-gap:10px;row-gap:0;padding-block:6px}
.sg-flink__kind{font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sg-root[dir="rtl"] .sg-flink__kind{font-family:var(--f-ar);font-weight:600;font-size:12.5px;letter-spacing:0}
.sg-footer__bottom{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;margin-top:clamp(40px,5cqi,72px);padding-block:12px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.sg-top{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;margin-inline-end:-12px;color:var(--text);text-decoration:none;font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:background-color .15s ease,transform .12s ease}
.sg-top:hover{background:var(--bg-2)}
.sg-top .sg-ico{color:var(--red-t)}
.sg-root[dir="rtl"] .sg-top{font-family:var(--f-ar);font-weight:600;font-size:14px;letter-spacing:0;text-transform:none}
.sg-footer__mark{display:block;direction:ltr;text-align:center;white-space:nowrap;font-family:var(--f-brand);font-weight:800;font-size:13.6cqi;line-height:.74;letter-spacing:-.01em;
  color:#1D2345;margin-top:clamp(8px,2cqi,28px);margin-bottom:-.06em;user-select:none;pointer-events:none}

/* ============ 13. WHATSAPP DOCK + LAYERS ============ */
.sg-dock{position:sticky;bottom:0;height:0;z-index:60}
.sg-fab{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:calc(16px + env(safe-area-inset-right,0px));display:inline-flex;align-items:center;justify-content:center;gap:10px;
  z-index:2;height:56px;min-width:56px;padding:0 22px 0 18px;background:var(--red);color:#fff;border:0;cursor:pointer;box-shadow:0 12px 32px rgba(0,0,0,.5);
  font:700 13px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;transition:background-color .15s ease,transform .12s ease}
.sg-fab:hover{background:var(--red-h)}
.sg-fab:active{transform:scale(.97)}
.sg-fab .sg-ico{width:24px;height:24px}
.sg-root[dir="rtl"] .sg-fab{font-family:var(--f-ar);font-size:15px;letter-spacing:0;text-transform:none;padding:0 18px 0 22px}
.sg-root.is-menu .sg-fab{visibility:hidden}
.sg-scrim{position:fixed;inset:0;z-index:0;display:block;width:100%;height:100%;padding:0;border:0;background:rgb(0 0 0 / .45);cursor:default;animation:sg-fade .2s ease-out both}
.sg-wa{position:absolute;z-index:1;bottom:calc(84px + env(safe-area-inset-bottom,0px));inset-inline-end:16px;width:min(400px,calc(100cqi - 32px));
  background:var(--bg-2);border:1px solid var(--line-2);box-shadow:0 24px 60px rgba(0,0,0,.55);animation:sg-pop .22s cubic-bezier(.2,.7,.2,1) both}
.sg-wa__head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 20px 16px 22px;border-bottom:1px solid var(--line)}
.sg-wa__title{font-family:var(--f-display);font-size:20px;line-height:1.05;text-transform:uppercase;color:#fff}
.sg-root[dir="rtl"] .sg-wa__title{font-weight:800;font-size:19px;line-height:1.5;text-transform:none}
.sg-wa__sub{margin-top:8px;color:var(--muted);font-size:14.5px;line-height:1.5}
.sg-x{display:grid;place-items:center;flex:none;width:44px;height:44px;padding:0;background:transparent;border:1px solid var(--line-2);color:var(--text);cursor:pointer;transition:background-color .15s ease}
.sg-x:hover{background:var(--bg-3)}
.sg-x:active{transform:scale(.96)}
.sg-wa__list{padding:10px}
.sg-wa__row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;min-height:72px;padding:12px 14px;color:var(--text);text-decoration:none;transition:background-color .15s ease,transform .12s ease}
.sg-wa__list li + li{border-top:1px solid var(--line)}
.sg-wa__row:hover{background:var(--bg-3)}
.sg-wa__ico{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line-2);color:var(--red-t)}
.sg-wa__num{font-family:var(--f-mono);font-weight:500;font-size:20px;color:#fff}
.sg-wa__go{display:grid;place-items:center;width:44px;height:44px;background:var(--red);color:#fff}
.sg-wa__row:hover .sg-wa__go{background:var(--red-h)}

.sg-sheet{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);animation:sg-sheet .22s cubic-bezier(.2,.7,.2,1) both}
/* the sheet head repeats the header (same height, brand at the start, the close button where the menu button sits) so nothing jumps on open */
.sg-sheet__head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:var(--head-h);padding-inline:var(--gutter);background:var(--bg);border-bottom:1px solid var(--line);flex:none}
.sg-sheet__head .sg-x{width:48px;height:44px}
.sg-sheet__title{display:flex;align-items:center;gap:12px;margin:24px var(--gutter) 0;font-family:var(--f-mono);font-weight:500;font-size:12px;line-height:1.4;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);flex:none}
.sg-sheet__title::before{content:"";width:10px;height:10px;background:var(--red);flex:none}
.sg-root[dir="rtl"] .sg-sheet__title{font-family:var(--f-ar);font-weight:700;font-size:15px;letter-spacing:0}
.sg-sheet__nav{padding:4px var(--gutter) 0}
.sg-sheet__link{display:flex;align-items:center;gap:18px;min-height:76px;padding:12px 6px;border-bottom:1px solid var(--line);color:#fff;text-decoration:none;transition:background-color .15s ease}
.sg-sheet__link:hover{background:var(--bg-2)}
.sg-sheet__link:active{transform:scale(.99)}
.sg-sheet__label{flex:1;min-width:0;font-family:var(--f-display);font-size:clamp(26px,8cqi,40px);line-height:1;letter-spacing:-.01em;text-transform:uppercase}
.sg-root[dir="rtl"] .sg-sheet__label{font-weight:800;font-size:clamp(24px,7cqi,34px);line-height:1.4;letter-spacing:0}
.sg-sheet__link .sg-ico{color:var(--muted)}
.sg-sheet__foot{display:flex;flex-direction:column;gap:14px;padding:28px var(--gutter) 36px;margin-top:auto}
.sg-sheet__foot .sg-btn{width:100%}
.sg-sheet__tels{display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--line)}
.sg-sheet__tel{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 6px;color:var(--text);text-decoration:none;transition:background-color .15s ease,transform .12s ease;font-size:16px}
.sg-sheet__tel:hover{background:var(--bg-2)}
.sg-sheet__tel .sg-mono{color:var(--muted)}
.sg-root[dir="rtl"] .sg-sheet__tel .sg-mono{font-family:var(--f-ar);font-size:14px;letter-spacing:0}

/* ============ 14. MOTION ============ */
@keyframes sg-copy-in{from{opacity:0;transform:translateX(calc(var(--sg-in) * var(--sg-dir) * 28px))}to{opacity:1;transform:none}}
@keyframes sg-prog-a{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sg-prog-b{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sg-open{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes sg-fade{from{opacity:0}to{opacity:1}}
@keyframes sg-pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes sg-sheet{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ============ 15. CONTAINER QUERIES ============ */
@container sg (max-width: 1180px){
  .sg-nav__link{padding:0 10px}
  /* 1024-1180: the text column would reach the thin part of the scrim, so narrow it and darken the middle stops */
  .sg-hero__stack{max-width:min(800px,58%)}
  .sg-hero__scrim{background:
    linear-gradient(90deg,rgba(10,13,28,.96) 0%,rgba(10,13,28,.92) 30%,rgba(10,13,28,.86) 46%,rgba(10,13,28,.6) 62%,rgba(10,13,28,.14) 80%,rgba(10,13,28,0) 100%),
    linear-gradient(0deg,rgba(10,13,28,.94) 0%,rgba(10,13,28,.55) 16%,rgba(10,13,28,0) 40%)}
  .sg-root[dir="rtl"] .sg-hero__scrim{background:
    linear-gradient(270deg,rgba(10,13,28,.96) 0%,rgba(10,13,28,.92) 30%,rgba(10,13,28,.86) 46%,rgba(10,13,28,.6) 62%,rgba(10,13,28,.14) 80%,rgba(10,13,28,0) 100%),
    linear-gradient(0deg,rgba(10,13,28,.94) 0%,rgba(10,13,28,.55) 16%,rgba(10,13,28,0) 40%)}
  .sg-manifest__head,.sg-row__btn{grid-template-columns:72px minmax(0,1fr) 44px}
  .sg-manifest__head span:nth-child(3),.sg-row__no{display:none}
  .sg-row__panel{padding-inline-start:calc(14px + 72px + 20px)}
  .sg-slide.is-long .sg-slide__title{font-size:5.3cqi}
  .sg-root[dir="rtl"] .sg-slide.is-long .sg-slide__title{font-size:4.9cqi}
}
@container sg (max-width: 1023px){
  .sg-strip{display:none}
  .sg-nav,.sg-hero__label{display:none}
  .sg-menu-btn{display:inline-flex}
  .sg-header__act{margin-inline-start:auto}
  .sg-hero__stack{max-width:min(720px,86%)}
  .sg-slide__title{font-size:clamp(46px,8.3cqi,128px)}
  .sg-slide.is-long .sg-slide__title{font-size:6.2cqi}
  .sg-root[dir="rtl"] .sg-slide.is-long .sg-slide__title{font-size:6.4cqi}
  .sg-slide__media--b .sg-slide__img{left:0;width:100%;-webkit-mask-image:none;mask-image:none}
  .sg-hero__scrim{background:linear-gradient(90deg,rgba(10,13,28,.96) 0%,rgba(10,13,28,.9) 50%,rgba(10,13,28,.7) 78%,rgba(10,13,28,.5) 100%),linear-gradient(0deg,rgba(10,13,28,.94) 0%,rgba(10,13,28,0) 40%)}
  .sg-root[dir="rtl"] .sg-hero__scrim{background:linear-gradient(270deg,rgba(10,13,28,.96) 0%,rgba(10,13,28,.9) 50%,rgba(10,13,28,.7) 78%,rgba(10,13,28,.5) 100%),linear-gradient(0deg,rgba(10,13,28,.94) 0%,rgba(10,13,28,0) 40%)}
  .sg-intro{grid-template-columns:1fr;align-items:start}
  .sg-intro .sg-lede{justify-self:start}
  .sg-manifest{grid-template-columns:1fr}
  .sg-viewer{display:none}
  .sg-row__panel{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:28px;align-items:start;padding-inline-start:14px;padding-top:4px}
  .sg-row__media{display:block;position:relative;aspect-ratio:3/2;overflow:hidden;background:var(--bg-3)}
  .sg-row__media img{width:100%;height:100%;object-fit:cover}
  .sg-vlist{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sg-value:nth-child(3){border-inline-start:0;padding-inline-start:0}
  .sg-value:nth-child(n+3){border-top:1px solid var(--line-2);padding-top:34px}
  .sg-value{padding-bottom:30px}
  .sg-contact__grid{grid-template-columns:1fr}
  .sg-about__grid{grid-template-columns:1fr;grid-template-areas:"title" "media" "copy";row-gap:clamp(28px,4cqi,44px)}
  .sg-about__title{margin-bottom:0}
  .sg-cta__in{grid-template-columns:1fr;align-items:start}
  .sg-footer__grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sg-brand--lg{--em:clamp(56px,7cqi,72px);gap:clamp(12px,1.6cqi,16px)}
  .sg-brand--lg .sg-brand__name{font-size:clamp(17px,2.1cqi,22px)}
  .sg-brand--lg .sg-brand__tag{font-size:clamp(10px,1.15cqi,12px)}
  .sg-dedicated__in{grid-template-columns:1fr;gap:8px}
}
/* Arabic, 472-970 px (phones too, see the 640 px block): slide 1's title takes two lines here (three again from 971 px), so the long one keeps its three
   lines at two thirds of slide 1's size (6.9cqi, or 40px where that is larger), the same block height */
@container sg (max-width: 970px){
  .sg-root[dir="rtl"] .sg-slide.is-long .sg-slide__title{font-size:max(26.6px,4.6cqi)}
}
@container sg (max-width: 860px){
  .sg-header__cta{display:none}
  .sg-fact{padding:28px 22px 30px}
  .sg-fact__label{font-size:14px}
  .sg-doors{grid-template-columns:1fr}
}
@container sg (max-width: 640px){
  .sg-facts__list{grid-template-columns:1fr}
  .sg-fact{gap:8px;padding:24px 0 26px;border-inline-start:0;border-top:1px solid var(--line)}
  .sg-fact:first-child{border-top:0}
  .sg-fact__label{max-width:none;font-size:15px}
  .sg-header__in,.sg-sheet__head{min-height:64px}
  .sg-section{scroll-margin-top:64px}
  .sg-header__in{gap:10px}
  /* phone header: the mark scales with the frame and the Latin "English" label drops its caps, so brand + language + menu always fit one row */
  .sg-brand:not(.sg-brand--lg){--em:clamp(32px,9.6cqi,40px);gap:clamp(8px,2.4cqi,10px);padding-inline-end:4px}
  .sg-brand__name{font-size:clamp(12.5px,3.6cqi,15px)}
  .sg-brand__tag{font-size:clamp(8px,2.1cqi,8.5px)}
  .sg-lang__t:lang(en){text-transform:none;letter-spacing:.01em}
  .sg-brand--lg{--em:66px;gap:16px}
  .sg-brand--lg .sg-brand__name{font-size:20px}
  .sg-brand--lg .sg-brand__tag{font-size:11px}
  .sg-menu-btn{padding:0;width:48px;justify-content:center}
  .sg-menu-btn span{display:none}
  .sg-lang{min-width:0;padding:0 12px}
  .sg-hero{min-height:0}
  .sg-hero__stage{bottom:auto;height:min(124cqi,540px)}
  .sg-hero__scrim{inset:0 0 auto 0;height:min(124cqi,540px);background:linear-gradient(180deg,rgba(10,13,28,.3) 0%,rgba(10,13,28,0) 20%,rgba(10,13,28,.72) 52%,rgba(10,13,28,.95) 76%,#0A0D1C 100%)}
  .sg-root[dir="rtl"] .sg-hero__scrim{background:linear-gradient(180deg,rgba(10,13,28,.3) 0%,rgba(10,13,28,0) 20%,rgba(10,13,28,.72) 52%,rgba(10,13,28,.95) 76%,#0A0D1C 100%)}
  .sg-hero__inner{padding-top:calc(min(124cqi,540px) - 168px);padding-bottom:40px}
  .sg-hero__stack{max-width:none}
  /* the slides hang from the top of their shared cell, right under the dots: a slide with less copy (a shorter body) keeps its eyebrow and title in the
     same place and leaves the spare room above the buttons, instead of dropping away from the dots */
  .sg-slide{align-self:start}
  .sg-slide__eyebrow{margin-bottom:16px}
  /* 531-640 px: slide 1's title takes two lines here (46px, or 8.3cqi where that is larger), so the long English one takes three at two thirds of that
     (the em measure is lifted for it); the Arabic one keeps its three lines and its size from the 970 px block */
  .sg-slide.is-long .sg-slide__title{font-size:max(30.6px,5.5cqi);max-width:none}
  .sg-root[dir="rtl"] .sg-slide.is-long .sg-slide__title{max-width:10.6em}
  .sg-slide__text{margin-top:18px}
  .sg-hero__cta{flex-direction:column;align-items:stretch;margin-top:28px}
  .sg-hero__cta .sg-btn{width:100%}
  /* the dots sit on the photo, right above the slide's eyebrow (the copy overlaps the photo's foot by 168 px), so they read as the photo's own pagination */
  .sg-hero__bar{position:absolute;inset-inline:var(--gutter);top:calc(min(124cqi,540px) - 168px - 60px);margin:0;padding:0;border:0}
  .sg-section{padding-block:clamp(56px,16cqi,80px)}
  /* Latin section titles: plain wrapping on phones keeps "your shipment" together (balance would strand a short word) */
  .sg-root:not([dir="rtl"]) .sg-h2{text-wrap:wrap}
  .sg-sechead{gap:12px}
  .sg-sechead__no{padding-inline-start:12px}
  .sg-manifest__head{grid-template-columns:62px minmax(0,1fr) 44px;gap:12px;padding-inline:6px}
  .sg-manifest__head span:nth-child(3){display:none}
  .sg-row__btn{grid-template-columns:62px minmax(0,1fr) 44px;gap:12px;padding:18px 6px;min-height:84px;align-items:start}
  .sg-row__code{margin-top:2px;font-size:12px;padding:5px 7px}
  .sg-row__no{display:none}
  .sg-row__short{font-size:14.5px}
  .sg-row__panel{grid-template-columns:1fr;gap:20px;padding:4px 6px 28px}
  .sg-row__cta .sg-btn{width:100%}
  .sg-door__face{aspect-ratio:4/3}
  .sg-dedicated{grid-template-columns:1fr}
  .sg-vlist{grid-template-columns:1fr}
  .sg-value,.sg-value:nth-child(3){display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:20px;padding:26px 0;border-inline-start:0;border-top:1px solid var(--line-2)}
  .sg-value:first-child{border-top:0}
  .sg-value__no{grid-row:1/3;font-size:64px;margin:0;line-height:.82}
  .sg-value__title{align-self:end}
  .sg-cta__meta{top:16px}
  .sg-cta__perf{top:46px}
  .sg-cta__in .sg-btn{width:100%}
  .sg-form__grid{grid-template-columns:1fr;gap:20px}
  .sg-form__foot .sg-btn{width:100%}
  .sg-footer__grid{grid-template-columns:1fr;gap:32px}
  .sg-fab,.sg-root[dir="rtl"] .sg-fab{padding:0;width:56px}
  .sg-fab__label{display:none}
  .sg-frame::after{inset:-5px}
  .sg-wa{position:fixed;inset:0;z-index:3;width:auto;display:flex;flex-direction:column;background:var(--bg);border:0;box-shadow:none;overflow-y:auto;overscroll-behavior:contain;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);animation:sg-sheet .22s cubic-bezier(.2,.7,.2,1) both}
  .sg-wa__head{min-height:64px;padding:16px var(--gutter)}
  .sg-wa__title{font-size:22px}
  .sg-wa__list{padding:8px var(--gutter)}
  .sg-wa__row{min-height:84px;padding:14px 4px}
  .sg-wa__num{font-size:clamp(17px,5.4cqi,22px)}
}
/* phones where slide 1's title takes three lines (English up to 530 px, Arabic up to 471 px; the breakpoints sit exactly on those switches): the long title
   takes four lines in English, at three quarters of slide 1's size (9.2cqi keeps "every industry" on one line at 320 px), and three in Arabic, as large
   as "والخدمات اللوجستية" allows */
@container sg (max-width: 530px){
  .sg-slide.is-long .sg-slide__title{font-size:min(9.2cqi,34.5px);max-width:10.6em}
}
@container sg (max-width: 471px){
  .sg-root[dir="rtl"] .sg-slide.is-long .sg-slide__title{font-size:min(8.6cqi,39px)}
}
@container sg (max-width: 400px){
  .sg-header__in{gap:8px}
  .sg-menu-btn,.sg-sheet__head .sg-x{width:44px}
  /* narrow phones: let the Latin hero title shrink with the frame so "FOR SEA, AIR" keeps one line instead of orphaning "ONE" */
  .sg-slide__title{font-size:clamp(38px,12.4cqi,46px)}
  .sg-root[dir="rtl"] .sg-slide__title{font-size:clamp(34px,11.6cqi,40px)}
  .sg-cta__title{font-size:clamp(30px,9.6cqi,34px)}
  .sg-lang{padding:0 10px}
  .sg-brand--lg{--em:58px;gap:14px}
  .sg-brand--lg .sg-brand__name{font-size:18px}
  .sg-brand--lg .sg-brand__tag{font-size:10px}
  .sg-header__act{gap:6px}
  .sg-manifest__head,.sg-row__btn{grid-template-columns:56px minmax(0,1fr) 44px}
  .sg-row__title{font-size:18px}
}
@container sg (max-width: 359px){
  .sg-manifest__head{display:none}
  .sg-rows{border-top:1px solid var(--line-2)}
  .sg-row__btn{grid-template-columns:minmax(0,1fr) 44px;grid-template-areas:"code icon" "main icon";row-gap:12px}
  .sg-row__code{grid-area:code;margin-top:0}
  .sg-row__main{grid-area:main}
  .sg-row__icon{grid-area:icon;align-self:start}
  /* compact mark: the tagline hides, the emblem stays (one line of type beside it, so it can be a little smaller) */
  .sg-brand:not(.sg-brand--lg){--em:clamp(26px,8.8cqi,32px);gap:6px;padding-inline-start:8px;margin-inline-start:-8px}
  .sg-brand:not(.sg-brand--lg) .sg-brand__tag{display:none}
  .sg-brand:not(.sg-brand--lg) .sg-brand__name{font-size:clamp(11px,3.6cqi,12.5px);letter-spacing:.01em}
  .sg-header__in,.sg-header__act{gap:6px}
  .sg-lang{padding:0 7px}
  .sg-brand--lg{--em:52px;gap:12px}
  .sg-brand--lg .sg-brand__name{font-size:16.5px}
  .sg-brand--lg .sg-brand__tag{font-size:9.5px}
  .sg-tel__num{font-size:17px}
  /* the Arabic address one size down, so each of its lines still fits one row (the second, "طريق الأمراء، قرب الضمان الاجتماعي", is the longest) */
  .sg-root[dir="rtl"] .sg-addr{font-size:16px}
}

@media (hover:hover) and (pointer:fine){
  .sg-hero:hover .sg-dot__fill{animation-play-state:paused!important}
}
@media (prefers-reduced-motion: reduce){
  .sg-root *,.sg-root *::before,.sg-root *::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0s!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<div class="sg-root {{rootCls}}" lang="{{lang}}" dir="{{dir}}" ref="{{setRoot}}">
<a class="sg-skip" href="#sg-main" onClick="{{skip}}">{{t.nav.skip}}</a>

<div class="sg-strip">
  <div class="sg-wrap sg-strip__in">
    <span class="sg-strip__k" aria-hidden="true"><svg class="sg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span>
    <span class="sg-strip__ar">{{strip.place}}</span>
    <span class="sg-strip__sep"></span>
    <span class="sg-strip__ar">{{t.tagline}}</span>
    <span class="sg-strip__push"></span>
    <span class="sg-strip__k" aria-hidden="true"><svg class="sg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"></path><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"></path></svg></span>
    <span class="sg-strip__nums">
      <sc-for list="{{tels}}" as="n" hint-placeholder-count="2"><span dir="ltr" class="sg-pin">{{n.display}}</span></sc-for>
    </span>
    <sc-for list="{{calls}}" as="n" hint-placeholder-count="1"><span class="sg-strip__call"><span class="sg-strip__k" aria-hidden="true"><svg class="sg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></span><span dir="ltr" class="sg-pin">{{n.display}}</span></span></sc-for>
  </div>
</div>

<header class="sg-header">
  <div class="sg-wrap sg-header__in">
    <a class="sg-brand" href="#sg-top" onClick="{{goHome}}" aria-label="{{x.brandHome}}">
      <img class="sg-brand__emblem" src="../img/emblem-on-dark.svg" alt="" width="52" height="48" decoding="async"/>
      <span class="sg-brand__words"><span class="sg-brand__name">FREIGHT NET SARL</span><span class="sg-brand__tag">SEA . AIR . LAND</span></span>
    </a>
    <nav class="sg-nav" aria-label="{{x.mainNav}}">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
        <a class="sg-nav__link" href="{{n.href}}" onClick="{{n.go}}"><span>{{n.label}}</span></a>
      </sc-for>
    </nav>
    <div class="sg-header__act">
      <button type="button" class="sg-lang" onClick="{{toggleLang}}"><span class="sg-lang__t" lang="{{x.otherLang}}">{{t.nav.lang}}</span><span class="sg-vh">{{langSr}}</span></button>
      <a class="sg-btn sg-btn--red sg-header__cta" href="#sg-contact" onClick="{{goContact}}"><span>{{t.nav.quote}}</span><svg class="sg-ico sg-ico--sm sg-ico--go sg-flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
      <button type="button" class="sg-menu-btn" onClick="{{openMenu}}" aria-haspopup="dialog" aria-expanded="{{menuExpanded}}" ref="{{setMenuBtn}}"><svg class="sg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h10"></path></svg><span>{{t.nav.menu}}</span></button>
    </div>
  </div>
</header>

<main id="sg-main" tabIndex="-1" ref="{{setMain}}">
<section class="sg-hero {{heroCls}}" id="sg-top" aria-roledescription="carousel" aria-label="{{x.carousel}}" ref="{{setTop}}" onPointerDown="{{swipeDown}}" onPointerMove="{{swipeMove}}" onPointerUp="{{swipeUp}}" onPointerCancel="{{swipeCancel}}" onClickCapture="{{swipeClick}}" onDragStart="{{swipeNoDrag}}">
  <div class="sg-hero__stage">
    <div class="sg-slide__media {{slides.0.mediaCls}}" aria-hidden="{{slides.0.ariaHidden}}"><img class="sg-slide__img" src="../img/s1-hero.webp" alt="{{slides.0.alt}}" width="1672" height="941" decoding="async" style="object-position: {{slides.0.pos}}"/></div>
    <div class="sg-slide__media sg-slide__media--b {{slides.1.mediaCls}}" aria-hidden="{{slides.1.ariaHidden}}"><img class="sg-slide__img" src="../img/s1-packaging.webp" alt="{{slides.1.alt}}" width="1200" height="800" decoding="async" style="object-position: {{slides.1.pos}}"/></div>
  </div>
  <div class="sg-hero__scrim" aria-hidden="true"></div>
  <div class="sg-wrap sg-hero__inner">
    <h1 class="sg-vh">{{h1}}</h1>
    <div class="sg-hero__stack" aria-live="{{heroLive}}">
      <sc-for list="{{slides}}" as="s" hint-placeholder-count="2">
        <div class="sg-slide {{s.cls}}" role="group" aria-roledescription="slide" aria-label="{{s.label}}" aria-hidden="{{s.ariaHidden}}">
          <div class="sg-slide__copy">
            <p class="sg-slide__eyebrow sg-eyebrow">{{s.eyebrow}}</p>
            <h2 class="sg-slide__title">{{s.title}}</h2>
            <p class="sg-slide__text">{{s.body}}</p>
          </div>
        </div>
      </sc-for>
    </div>
    <div class="sg-hero__cta">
      <a class="sg-btn sg-btn--red" href="#sg-contact" onClick="{{goContact}}"><span>{{t.hero.ctaQuote}}</span><svg class="sg-ico sg-ico--go sg-flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
      <button type="button" class="sg-btn sg-btn--ghost" onClick="{{openWa}}" aria-haspopup="dialog"><svg class="sg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"></path><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"></path></svg><span>{{t.hero.ctaWhatsapp}}</span></button>
    </div>
    <div class="sg-hero__bar">
      <div class="sg-dots">
        <sc-for list="{{slides}}" as="s" hint-placeholder-count="2">
          <button type="button" class="sg-dot {{s.dotCls}}" onClick="{{s.go}}" aria-label="{{s.goLabel}}" aria-current="{{s.current}}"><span class="sg-dot__no" aria-hidden="true">{{s.no}}</span><span class="sg-dot__track" aria-hidden="true"><span class="sg-dot__fill {{s.fillCls}}" onAnimationEnd="{{onProgEnd}}"></span></span></button>
        </sc-for>
      </div>
    </div>
  </div>
  <dl class="sg-hero__label sg-frame">
    <sc-for list="{{heroLabel}}" as="r" hint-placeholder-count="2"><div><dt>{{r.k}}</dt><dd>{{r.v}}</dd></div></sc-for>
  </dl>
</section>

<section class="sg-facts" aria-label="{{x.facts}}">
  <div class="sg-wrap">
    <ul class="sg-facts__list">
      <sc-for list="{{facts}}" as="f" hint-placeholder-count="3">
        <li class="sg-fact"><span class="sg-fact__value">{{f.value}}</span><span class="sg-fact__label">{{f.label}}</span></li>
      </sc-for>
    </ul>
  </div>
</section>

<section class="sg-section sg-services" id="sg-services" aria-labelledby="{{ids.svc}}" ref="{{setServices}}">
  <div class="sg-wrap">
    <div class="sg-sechead"><span class="sg-plus" aria-hidden="true"></span><span class="sg-sechead__no" aria-hidden="true"><span class="sg-ltr">01 / 05</span></span><span class="sg-eyebrow">{{t.services.eyebrow}}</span></div>
    <div class="sg-intro">
      <h2 class="sg-h2" id="{{ids.svc}}" tabIndex="-1">{{t.services.title}}</h2>
      <p class="sg-lede">{{t.services.lede}}</p>
    </div>
    <div class="sg-manifest">
      <div class="sg-manifest__table" onMouseLeave="{{svcLeave}}">
        <div class="sg-manifest__head" aria-hidden="true"><span>{{x.colCode}}</span><span>{{x.colService}}</span><span>{{x.colRef}}</span><span></span></div>
        <ul class="sg-rows">
          <sc-for list="{{services}}" as="s" hint-placeholder-count="8">
            <li class="sg-row {{s.cls}}" onMouseEnter="{{s.hover}}">
              <h3 class="sg-row__h">
                <button type="button" class="sg-row__btn" id="{{s.btnId}}" aria-expanded="{{s.expanded}}" aria-controls="{{s.panelId}}" onClick="{{s.toggle}}">
                  <span class="sg-row__code" aria-hidden="true">{{s.code}}</span>
                  <span class="sg-row__main"><span class="sg-row__title">{{s.title}}</span><span class="sg-row__short">{{s.short}}</span></span>
                  <span class="sg-row__no" aria-hidden="true">{{s.no}}</span>
                  <span class="sg-row__icon" aria-hidden="true"><svg class="sg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span>
                </button>
              </h3>
              <div class="sg-row__panel" id="{{s.panelId}}" role="region" aria-labelledby="{{s.btnId}}" hidden="{{s.closed}}">
                <div class="sg-row__media"><img src="{{s.img}}" alt="{{s.alt}}" width="1200" height="800" loading="lazy" decoding="async" style="object-position: {{s.pos}}"/></div>
                <div class="sg-row__detail">
                  <p class="sg-row__dtitle">{{s.detailTitle}}</p>
                  <p class="sg-row__dtext">{{s.detail}}</p>
                  <div class="sg-row__cta"><a class="sg-btn sg-btn--red" href="#sg-contact" onClick="{{s.quote}}"><span>{{t.services.cta}}</span><svg class="sg-ico sg-ico--go sg-flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a></div>
                </div>
              </div>
            </li>
          </sc-for>
        </ul>
      </div>
      <figure class="sg-viewer" aria-hidden="true">
        <div class="sg-viewer__frame sg-frame">
          <div class="sg-viewer__clip">
            <sc-for list="{{viewer}}" as="v" hint-placeholder-count="8"><img class="sg-viewer__img {{v.cls}}" src="{{v.img}}" alt="" width="1200" height="800" loading="lazy" decoding="async" style="object-position: {{v.pos}}"/></sc-for>
            <div class="sg-viewer__shade"></div>
            <span class="sg-viewer__code">{{viewerNow.code}}</span>
          </div>
        </div>
        <figcaption class="sg-viewer__cap"><span><b>{{x.fig}} <span class="sg-ltr">{{viewerNow.no}}</span></b></span><span>{{viewerNow.title}}</span></figcaption>
      </figure>
    </div>
  </div>
</section>

<section class="sg-section sg-ocean" aria-labelledby="{{ids.ocean}}">
  <div class="sg-wrap">
    <div class="sg-sechead"><span class="sg-plus" aria-hidden="true"></span><span class="sg-sechead__no" aria-hidden="true"><span class="sg-ltr">02 / 05</span></span><span class="sg-eyebrow">{{t.ocean.eyebrow}}</span></div>
    <div class="sg-intro sg-intro--solo"><h2 class="sg-h2" id="{{ids.ocean}}">{{t.ocean.title}}</h2></div>
    <div class="sg-doors">
      <article class="sg-door sg-door--fcl">
        <div class="sg-door__face" aria-hidden="true">
          <span class="sg-door__bar sg-door__bar--1"><i></i></span><span class="sg-door__bar sg-door__bar--2"><i></i></span><span class="sg-door__bar sg-door__bar--3"><i></i></span><span class="sg-door__bar sg-door__bar--4"><i></i></span>
          <span class="sg-door__stencil">{{t.ocean.fcl.tag}}</span>
        </div>
        <div class="sg-door__body">
          <p class="sg-door__tag">{{t.ocean.fcl.tag}}</p>
          <h3 class="sg-door__name">{{t.ocean.fcl.name}}</h3>
          <p class="sg-door__text">{{t.ocean.fcl.body}}</p>
        </div>
      </article>
      <article class="sg-door sg-door--lcl">
        <div class="sg-door__face" aria-hidden="true">
          <div class="sg-box">
            <span class="sg-box__w sg-box__w--back"></span><span class="sg-box__w sg-box__w--top"></span><span class="sg-box__w sg-box__w--l"></span><span class="sg-box__w sg-box__w--r"></span><span class="sg-box__w sg-box__w--floor"></span>
            <div class="sg-hold"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
          </div>
          <span class="sg-door__stencil">{{t.ocean.lcl.tag}}</span>
        </div>
        <div class="sg-door__body">
          <p class="sg-door__tag">{{t.ocean.lcl.tag}}</p>
          <h3 class="sg-door__name">{{t.ocean.lcl.name}}</h3>
          <p class="sg-door__text">{{t.ocean.lcl.body}}</p>
        </div>
      </article>
    </div>
    <div class="sg-dedicated">
      <span class="sg-dedicated__ico" aria-hidden="true"><svg class="sg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 1 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"></path><path d="M21 16v2a4 4 0 0 1-4 4h-5"></path></svg></span>
      <div class="sg-dedicated__in">
        <h3 class="sg-h3">{{t.ocean.contactTitle}}</h3>
        <p class="sg-dedicated__text">{{t.ocean.contactBody}}</p>
      </div>
    </div>
  </div>
</section>

<section class="sg-section sg-values" aria-labelledby="{{ids.values}}">
  <div class="sg-wrap">
    <div class="sg-sechead"><span class="sg-plus" aria-hidden="true"></span><span class="sg-sechead__no" aria-hidden="true"><span class="sg-ltr">03 / 05</span></span><span class="sg-eyebrow">{{t.values.eyebrow}}</span></div>
    <div class="sg-intro sg-intro--solo"><h2 class="sg-h2" id="{{ids.values}}">{{t.values.title}}</h2></div>
    <ol class="sg-vlist">
      <sc-for list="{{values}}" as="v" hint-placeholder-count="4">
        <li class="sg-value"><span class="sg-value__no" aria-hidden="true">{{v.no}}</span><h3 class="sg-h3 sg-value__title">{{v.title}}</h3><p class="sg-value__body">{{v.body}}</p></li>
      </sc-for>
    </ol>
  </div>
</section>

<section class="sg-section sg-about" id="sg-about" aria-labelledby="{{ids.about}}" ref="{{setAbout}}">
  <div class="sg-wrap">
    <div class="sg-sechead"><span class="sg-plus" aria-hidden="true"></span><span class="sg-sechead__no" aria-hidden="true"><span class="sg-ltr">04 / 05</span></span><span class="sg-eyebrow">{{t.about.eyebrow}}</span></div>
    <div class="sg-about__grid">
      <h2 class="sg-h2 sg-about__title" id="{{ids.about}}" tabIndex="-1">{{t.about.title}}</h2>
      <div class="sg-about__media sg-frame">
        <div class="sg-about__clip"><img src="{{aboutImg.src}}" alt="{{aboutImg.alt}}" width="1200" height="800" loading="lazy" decoding="async"/></div>
      </div>
      <div class="sg-about__copy">
        <p class="sg-about__body">{{t.about.body}}</p>
        <div class="sg-mission">
          <h3 class="sg-mission__label">{{t.about.missionTitle}}</h3>
          <p class="sg-mission__text">{{t.about.mission}}</p>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="sg-cta" aria-labelledby="{{ids.cta}}">

        <div class="sg-bill__cell">
          <h3 class="sg-bill__label">{{c.phoneTitle}}</h3>

                  <a class="sg-chip" href="{{n.tel}}" aria-label="{{n.callLabel}}"><svg class="sg-ico sg-ico--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg><span>{{x.call}}</span></a>

            </sc-for>
            <sc-for list="{{calls}}" as="n" hint-placeholder-count="1">
              <li class="sg-tel sg-tel--call">

                <span class="sg-tel__act">
                  <span class="sg-tel__only"><span class="sg-chip sg-tel__ghost" aria-hidden="true"><svg class="sg-ico sg-ico--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"></path><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"></path></svg><span>{{t.whatsapp.button}}</span></span><span class="sg-tel__kind">{{x.callOnly}}</span></span>
                  <a class="sg-chip sg-chip--call" href="{{n.tel}}" aria-label="{{n.callLabel}}"><svg class="sg-ico sg-ico--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg><span>{{x.call}}</span></a>
                </span>
              </li>
            </sc-for>
          </ul>
        </div>
        <div class="sg-bill__cell">
          <h3 class="sg-bill__label">{{c.emailTitle}}</h3>
